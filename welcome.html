
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SADWAP | Draggable Radial Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        :root {
            --bg-primary: #0a0c15;
            --bg-secondary: #0f111a;
            --bg-card: rgba(18, 22, 35, 0.95);
            --accent-cyan: #00d4ff;
            --accent-purple: #7b2cbf;
            --accent-glow: rgba(0, 212, 255, 0.3);
            --text-primary: #ffffff;
            --text-secondary: #a0a8c0;
            --text-muted: #6b7280;
            --border-glow: rgba(0, 212, 255, 0.15);
            --header-height: 70px;
            --menu-radius: 280px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Loading Screen */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .loading-overlay.fade-out { opacity: 0; visibility: hidden; }
        .futuristic-loader { text-align: center; }
        .loader-logo {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 2rem;
        }
        .progress-container { width: 280px; height: 2px; background: rgba(0, 212, 255, 0.2); border-radius: 2px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple)); transition: width 0.05s linear; }
        .loading-percent { font-size: 1rem; font-weight: 600; color: var(--accent-cyan); margin-top: 1rem; font-family: monospace; }

        /* Draggable Circular Menu */
        .circular-menu-container {
            position: fixed;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1000;
            cursor: grab;
        }
        .circular-menu-container.dragging { cursor: grabbing; opacity: 0.9; }
        .menu-center-btn {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            z-index: 50;
            box-shadow: 0 0 30px var(--accent-glow);
            transition: all 0.3s ease;
            border: 2px solid rgba(255,255,255,0.2);
        }
        .menu-center-btn:hover { transform: scale(1.05); box-shadow: 0 0 45px var(--accent-glow); }
        .menu-center-btn i { font-size: 2rem; color: white; }
        .menu-center-btn span {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            white-space: nowrap;
            color: var(--text-secondary);
            font-weight: 500;
            background: rgba(10,12,21,0.8);
            padding: 2px 10px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }
        .circular-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            width: var(--menu-radius);
            height: var(--menu-radius);
            margin-left: -140px;
            margin-top: -140px;
            border-radius: 50%;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform: scale(0.3);
            pointer-events: none;
        }
        .circular-menu.active { opacity: 1; visibility: visible; transform: scale(1); pointer-events: auto; }
        .menu-item {
            position: absolute;
            width: 65px;
            height: 65px;
            background: rgba(18, 22, 35, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid var(--border-glow);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            color: var(--text-primary);
        }
        .menu-item:hover { transform: scale(1.15); border-color: var(--accent-cyan); box-shadow: 0 0 20px var(--accent-glow); background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(123,44,191,0.2)); }
        .menu-item i { font-size: 1.5rem; }
        .menu-item .item-label {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.6rem;
            white-space: nowrap;
            color: var(--text-muted);
            font-weight: 500;
            background: rgba(10,12,21,0.8);
            padding: 2px 8px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }
        .drag-handle {
            position: absolute;
            top: -15px;
            right: -15px;
            width: 30px;
            height: 30px;
            background: rgba(0,212,255,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            cursor: grab;
            z-index: 60;
            backdrop-filter: blur(4px);
            border: 1px solid var(--border-glow);
        }

        /* Main Content */
        .main-content { flex: 1; margin-left: 0; background: var(--bg-primary); }
        .top-navbar {
            background: rgba(10, 12, 21, 0.95);
            backdrop-filter: blur(12px);
            padding: 0 2rem;
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            border-bottom: 1px solid var(--border-glow);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-actions { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .lang-switch { display: flex; gap: 0.3rem; background: rgba(0, 212, 255, 0.1); padding: 0.25rem; border-radius: 2rem; border: 1px solid var(--border-glow); }
        .lang-btn { background: transparent; border: none; padding: 0.4rem 1rem; border-radius: 2rem; font-weight: 600; font-size: 0.75rem; cursor: pointer; color: var(--text-secondary); }
        .lang-btn.active { background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); color: white; }
        .user-badge { display: flex; align-items: center; gap: 0.6rem; background: rgba(0, 212, 255, 0.08); padding: 0.4rem 1rem; border-radius: 2rem; border: 1px solid var(--border-glow); font-size: 0.85rem; }
        .refresh-btn { background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); border: none; border-radius: 2rem; padding: 0.4rem 1.2rem; color: white; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
        .dashboard-inner { padding: 2rem; max-width: 1400px; margin: 0 auto; }
        .hero-futuristic {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.08), rgba(123, 44, 191, 0.08));
            border-radius: 24px;
            padding: 2.5rem 2rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-glow);
            position: relative;
            overflow: hidden;
        }
        .hero-futuristic::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.05), transparent);
            animation: pulse 4s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.1); opacity: 0.8; } }
        .hero-title { font-size: 2.5rem; font-weight: 800; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); background-clip: text; -webkit-background-clip: text; color: transparent; margin-bottom: 0.5rem; position: relative; z-index: 1; }
        .hero-subtitle { font-size: 1rem; color: var(--text-secondary); position: relative; z-index: 1; }
        .hero-stats { display: flex; gap: 2.5rem; margin-top: 1.5rem; position: relative; z-index: 1; flex-wrap: wrap; }
        .hero-stat-value { font-size: 1.8rem; font-weight: 700; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .hero-stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .welcome-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-glow); }
        .greeting h1 { font-size: 1.3rem; font-weight: 600; }
        .info-badge { display: flex; gap: 1.2rem; background: rgba(0, 212, 255, 0.08); padding: 0.5rem 1.2rem; border-radius: 40px; font-size: 0.8rem; border: 1px solid var(--border-glow); }
        .section-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 0.8rem; }
        .modules-grid-enhanced { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .module-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid var(--border-glow);
            position: relative;
            overflow: hidden;
        }
        .module-card:hover { transform: translateY(-4px); border-color: var(--accent-cyan); box-shadow: 0 0 20px var(--accent-glow); }
        .module-icon { font-size: 2.2rem; margin-bottom: 0.5rem; }
        .module-card h3 { font-size: 0.9rem; font-weight: 700; margin: 0.5rem 0; }
        .module-card p { font-size: 0.7rem; color: var(--text-muted); }
        .module-badge { font-size: 0.65rem; background: rgba(0, 212, 255, 0.15); padding: 4px 12px; border-radius: 20px; margin-top: 8px; color: var(--accent-cyan); display: inline-block; }
        .activity-feed-full { background: var(--bg-card); backdrop-filter: blur(10px); border-radius: 20px; padding: 1.5rem; border: 1px solid var(--border-glow); }
        .activity-item { font-size: 0.85rem; padding: 0.8rem 0; border-bottom: 1px solid var(--border-glow); display: flex; gap: 1rem; align-items: center; }
        .notification-toast { position: fixed; bottom: 24px; right: 24px; background: var(--bg-card); border-left: 3px solid var(--accent-cyan); padding: 0.8rem 1.2rem; border-radius: 12px; z-index: 1100; display: none; align-items: center; gap: 12px; }
        .floating-ai-assistant {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1100;
            box-shadow: 0 0 20px var(--accent-glow);
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .chatbot-modal {
            position: fixed;
            bottom: 105px;
            right: 30px;
            width: 420px;
            height: 580px;
            background: var(--bg-card);
            border-radius: 20px;
            z-index: 1150;
            display: none;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-glow);
        }
        .chatbot-modal.open { display: flex; }
        .chatbot-header { background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); padding: 0.8rem 1.2rem; display: flex; justify-content: space-between; align-items: center; }
        .chatbot-header button { background: none; border: none; color: white; font-size: 1.1rem; cursor: pointer; }
        .chatbot-iframe { flex: 1; width: 100%; border: none; background: var(--bg-secondary); }
        .iframe-container { position: fixed; top: var(--header-height); left: 0; right: 0; bottom: 0; z-index: 90; background: var(--bg-primary); display: none; }
        .iframe-container.active { display: block; }
        .iframe-container iframe { width: 100%; height: 100%; border: none; }
        .close-iframe { position: absolute; top: 15px; right: 15px; width: 40px; height: 40px; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 95; box-shadow: 0 0 15px var(--accent-glow); }
        @media (max-width: 768px) { .menu-center-btn { width: 60px; height: 60px; } .circular-menu { width: 220px; height: 220px; margin-left: -110px; margin-top: -110px; } .menu-item { width: 50px; height: 50px; } .chatbot-modal { width: calc(100vw - 40px); right: 20px; left: 20px; height: 65vh; } }
        [dir="rtl"] .floating-ai-assistant { right: auto; left: 30px; }
        [dir="rtl"] .chatbot-modal { right: auto; left: 30px; }
    </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="futuristic-loader">
        <div class="loader-logo">SADWAP</div>
        <div class="progress-container"><div class="progress-bar-fill" id="loadingProgressBar"></div></div>
        <div class="loading-percent" id="loadingPercentText">0%</div>
    </div>
</div>

<div class="dashboard-container">
    <div class="circular-menu-container" id="circularMenuContainer">
        <div class="drag-handle" id="dragHandle"><i class="fas fa-arrows-alt"></i></div>
        <div class="menu-center-btn" id="menuCenterBtn"><i class="fas fa-compass"></i><span id="menuLabel">MENU</span></div>
        <div class="circular-menu" id="circularMenu"></div>
    </div>

    <div class="iframe-container" id="iframeContainer">
        <div class="close-iframe" id="closeIframeBtn"><i class="fas fa-times"></i></div>
        <iframe id="pageIframe" src="about:blank"></iframe>
    </div>

    <div class="main-content" id="mainContent">
        <div class="top-navbar">
            <div class="nav-actions">
                <div class="lang-switch"><button class="lang-btn active" id="langEn">EN</button><button class="lang-btn" id="langAr">AR</button></div>
                <div class="user-badge"><i class="fas fa-user-circle"></i> <span>SADWAP Admin</span></div>
                <button class="refresh-btn" id="refreshDataBtn"><i class="fas fa-sync-alt"></i> <span>Refresh</span></button>
            </div>
        </div>
        <div class="dashboard-inner" id="dashboardInner">
            <div class="hero-futuristic">
                <div class="hero-title">SADWAP StreamOps</div>
                <div class="hero-subtitle">Enterprise Operations · Real-time Intelligence · AI Powered</div>
                <div class="hero-stats">
                    <div class="hero-stat"><div class="hero-stat-value" id="activeUsers">1,247</div><div class="hero-stat-label">Active Users</div></div>
                    <div class="hero-stat"><div class="hero-stat-value" id="systemHealth">99.9%</div><div class="hero-stat-label">System Health</div></div>
                    <div class="hero-stat"><div class="hero-stat-value" id="processedOps">45.2K</div><div class="hero-stat-label">Processed Ops</div></div>
                </div>
            </div>
            <div class="welcome-header"><div class="greeting"><h1 id="welcomeMsg">Welcome back, Operations Director</h1><p style="color:var(--text-muted);">Main Hub · Real-time Metrics</p></div><div class="info-badge"><span id="currentDate"></span> <span id="currentTime"></span></div></div>
            <div class="section-title"><i class="fas fa-th-large"></i> <span>Quick Access Modules</span></div>
            <div class="modules-grid-enhanced" id="modulesGrid"></div>
            <div class="section-title"><i class="fas fa-history"></i> <span>Recent Activity</span></div>
            <div class="activity-feed-full"><div id="activityList"></div></div>
        </div>
    </div>
</div>

<div class="floating-ai-assistant" id="floatingAiBtn"><i class="fas fa-robot"></i></div>
<div class="chatbot-modal" id="chatbotModal"><div class="chatbot-header"><h4><i class="fas fa-microchip"></i> SADWAP AI Assistant</h4><button id="closeChatbotBtn"><i class="fas fa-times"></i></button></div><iframe class="chatbot-iframe" id="chatbotIframe" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-top-navigation"></iframe></div>
<div id="toastMessage" class="notification-toast"><i class="fas fa-check-circle"></i> <span></span></div>

<script>
    // Loading Animation
    let progress = 0;
    const progressBar = document.getElementById('loadingProgressBar');
    const percentText = document.getElementById('loadingPercentText');
    const loadingOverlay = document.getElementById('loadingOverlay');
    function simulateLoading() {
        const interval = setInterval(() => {
            if (progress >= 100) {
                clearInterval(interval);
                setTimeout(() => { loadingOverlay.classList.add('fade-out'); setTimeout(() => loadingOverlay.style.display = 'none', 800); }, 200);
            } else {
                let increment = progress < 30 ? 3 : (progress < 70 ? 2 : 1);
                progress = Math.min(progress + increment, 100);
                progressBar.style.width = progress + '%';
                percentText.innerText = progress + '%';
            }
        }, 40);
    }
    simulateLoading();

    // Navigation
    const iframeContainer = document.getElementById('iframeContainer');
    const pageIframe = document.getElementById('pageIframe');
    const closeIframeBtn = document.getElementById('closeIframeBtn');
    const mainContentDiv = document.getElementById('dashboardInner');
    function navigateTo(url) {
        if (!url || url === '#') { showToast('Already on Dashboard'); return; }
        showToast('Loading page...');
        pageIframe.src = url;
        mainContentDiv.style.display = 'none';
        iframeContainer.classList.add('active');
        if (menuOpen) toggleMenu();
        addActivityLog(`📄 Navigated to: ${url.split('/').pop()}`);
    }
    function closeIframe() { mainContentDiv.style.display = 'block'; iframeContainer.classList.remove('active'); pageIframe.src = 'about:blank'; addActivityLog(`🏠 Returned to Dashboard`); }
    closeIframeBtn.addEventListener('click', closeIframe);

    // Menu Items
    const menuItems = [
        { icon: "fas fa-tachometer-alt", name: "Dashboard", nameAr: "الرئيسية", url: "#" },
        { icon: "fas fa-boxes", name: "Inventory", nameAr: "المخزون", url: "https://ghostkmr.github.io/2026/inventory.html" },
        { icon: "fas fa-calendar-times", name: "Expiry", nameAr: "الصلاحية", url: "https://ghostkmr.github.io/2026/expiration%20tracker.html" },
        { icon: "fas fa-chart-line", name: "Sales", nameAr: "المبيعات", url: "https://ghostkmr.github.io/2026/salestracker.html" },
        { icon: "fas fa-exchange-alt", name: "Transfers", nameAr: "التحويلات", url: "https://ghostkmr.github.io/2026/transferrecords.html" },
        { icon: "fas fa-calendar-alt", name: "Training", nameAr: "التدريب", url: "https://ghostkmr.github.io/2026/training%20calender.html" },
        { icon: "fas fa-id-card", name: "Municipality", nameAr: "البلدية", url: "https://ghostkmr.github.io/2026/muncipality.html" },
        { icon: "fas fa-user-shield", name: "Admin", nameAr: "الإدارة", url: "https://ghostkmr.github.io/2026/pannel.html" }
    ];

    function positionMenuItems() {
        const container = document.getElementById('circularMenu');
        const count = menuItems.length, radius = 130;
        const angleStep = (Math.PI * 2) / count;
        container.innerHTML = '';
        menuItems.forEach((item, idx) => {
            const angle = angleStep * idx - Math.PI / 2;
            const x = Math.cos(angle) * radius, y = Math.sin(angle) * radius;
            const el = document.createElement('div');
            el.className = 'menu-item';
            el.style.transform = `translate(${x}px, ${y}px)`;
            el.innerHTML = `<i class="${item.icon}"></i><span class="item-label" data-name="${item.name}" data-name-ar="${item.nameAr}">${item.name}</span>`;
            el.onclick = (e) => { e.stopPropagation(); if (item.url === '#') showToast('Dashboard'); else navigateTo(item.url); addActivityLog(`🔘 ${currentLang === 'ar' ? item.nameAr : item.name}`); if (menuOpen) toggleMenu(); };
            container.appendChild(el);
        });
    }

    // Drag & Drop
    const dragContainer = document.getElementById('circularMenuContainer'), dragHandle = document.getElementById('dragHandle');
    let isDragging = false, startX, startY, currentLeft, currentTop;
    function loadSavedPosition() { let l = localStorage.getItem('circularMenuLeft'), t = localStorage.getItem('circularMenuTop'); if (l && t) { dragContainer.style.left = l + 'px'; dragContainer.style.top = t + 'px'; dragContainer.style.transform = 'none'; } else { dragContainer.style.left = '30px'; dragContainer.style.top = (window.innerHeight/2 - 40) + 'px'; dragContainer.style.transform = 'none'; } }
    function savePosition(l,t) { localStorage.setItem('circularMenuLeft', l); localStorage.setItem('circularMenuTop', t); }
    function startDrag(e) { e.preventDefault(); isDragging = true; dragContainer.classList.add('dragging'); const rect = dragContainer.getBoundingClientRect(); currentLeft = rect.left; currentTop = rect.top; startX = e.clientX || e.touches[0].clientX; startY = e.clientY || e.touches[0].clientY; document.addEventListener('mousemove', onDrag); document.addEventListener('mouseup', stopDrag); document.addEventListener('touchmove', onDrag); document.addEventListener('touchend', stopDrag); }
    function onDrag(e) { if (!isDragging) return; e.preventDefault(); let cx = e.clientX || e.touches[0].clientX, cy = e.clientY || e.touches[0].clientY; let dx = cx - startX, dy = cy - startY; let nl = currentLeft + dx, nt = currentTop + dy; let maxL = window.innerWidth - dragContainer.offsetWidth - 10, maxT = window.innerHeight - dragContainer.offsetHeight - 10; nl = Math.max(10, Math.min(nl, maxL)); nt = Math.max(10, Math.min(nt, maxT)); dragContainer.style.left = nl + 'px'; dragContainer.style.top = nt + 'px'; dragContainer.style.transform = 'none'; }
    function stopDrag() { if (!isDragging) return; isDragging = false; dragContainer.classList.remove('dragging'); let l = parseInt(dragContainer.style.left), t = parseInt(dragContainer.style.top); if (!isNaN(l) && !isNaN(t)) savePosition(l, t); document.removeEventListener('mousemove', onDrag); document.removeEventListener('mouseup', stopDrag); document.removeEventListener('touchmove', onDrag); document.removeEventListener('touchend', stopDrag); }
    dragHandle.addEventListener('mousedown', startDrag); dragHandle.addEventListener('touchstart', startDrag);
    
    let menuOpen = false;
    const menuBtn = document.getElementById('menuCenterBtn'), circularMenu = document.getElementById('circularMenu');
    function toggleMenu() { menuOpen = !menuOpen; if (menuOpen) { circularMenu.classList.add('active'); document.getElementById('menuLabel').innerText = currentLang === 'ar' ? 'إغلاق' : 'CLOSE'; } else { circularMenu.classList.remove('active'); document.getElementById('menuLabel').innerText = currentLang === 'ar' ? 'القائمة' : 'MENU'; } }
    menuBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu(); });
    document.addEventListener('click', (e) => { if (menuOpen && !circularMenu.contains(e.target) && !menuBtn.contains(e.target) && !dragHandle.contains(e.target)) toggleMenu(); });

    // Language
    let currentLang = "en";
    function setLanguage(lang) { currentLang = lang; document.getElementById("welcomeMsg").innerText = lang === 'en' ? "Welcome back, Operations Director" : "مرحباً بعودتك، مدير العمليات"; document.documentElement.setAttribute("dir", lang === 'ar' ? 'rtl' : 'ltr'); document.querySelectorAll('.menu-item .item-label').forEach(l => { l.innerText = lang === 'ar' ? l.getAttribute('data-name-ar') : l.getAttribute('data-name'); }); document.getElementById("menuLabel").innerText = menuOpen ? (lang === 'ar' ? 'إغلاق' : 'CLOSE') : (lang === 'ar' ? 'القائمة' : 'MENU'); buildQuickModules(); }
    document.getElementById("langEn").onclick = () => { currentLang = "en"; document.getElementById("langEn").classList.add("active"); document.getElementById("langAr").classList.remove("active"); setLanguage("en"); showToast("English interface loaded"); };
    document.getElementById("langAr").onclick = () => { currentLang = "ar"; document.getElementById("langAr").classList.add("active"); document.getElementById("langEn").classList.remove("active"); setLanguage("ar"); showToast("تم تحويل الواجهة إلى العربية"); };
    
    // Modules
    function buildQuickModules() {
        const modules = [
            { name: "Expiry Tracker", nameAr: "متتبع الصلاحية", icon: "fas fa-calendar-times", color: "#00d4ff", description: "Monitor expiring products", descriptionAr: "مراقبة المنتجات المنتهية", url: "https://ghostkmr.github.io/2026/expiration%20tracker.html" },
            { name: "Sales Dashboard", nameAr: "المبيعات", icon: "fas fa-chart-line", color: "#7b2cbf", description: "Track daily revenue", descriptionAr: "تتبع الإيرادات", url: "https://ghostkmr.github.io/2026/salestracker.html" },
            { name: "Inventory Mgmt", nameAr: "المخزون", icon: "fas fa-boxes", color: "#00d4ff", description: "Stock & supplies", descriptionAr: "المخزون والمستلزمات", url: "https://ghostkmr.github.io/2026/inventory.html" },
            { name: "Transfers", nameAr: "التحويلات", icon: "fas fa-exchange-alt", color: "#7b2cbf", description: "Stock movements", descriptionAr: "حركات المخزون", url: "https://ghostkmr.github.io/2026/transferrecords.html" },
            { name: "Training", nameAr: "التدريب", icon: "fas fa-calendar-alt", color: "#00d4ff", description: "Staff training", descriptionAr: "تدريب الموظفين", url: "https://ghostkmr.github.io/2026/training%20calender.html" },
            { name: "Municipality", nameAr: "البلدية", icon: "fas fa-id-card", color: "#7b2cbf", description: "License management", descriptionAr: "إدارة الرخص", url: "https://ghostkmr.github.io/2026/muncipality.html" },
            { name: "Admin Panel", nameAr: "الإدارة", icon: "fas fa-user-shield", color: "#00d4ff", description: "System config", descriptionAr: "إعدادات النظام", url: "https://ghostkmr.github.io/2026/pannel.html" }
        ];
        const grid = document.getElementById("modulesGrid");
        grid.innerHTML = '';
        modules.forEach(mod => {
            const card = document.createElement('div'); card.className = 'module-card';
            const displayName = currentLang === 'en' ? mod.name : mod.nameAr;
            const displayDesc = currentLang === 'en' ? mod.description : mod.descriptionAr;
            card.innerHTML = `<div class="module-icon" style="color:${mod.color};"><i class="${mod.icon}"></i></div><h3>${displayName}</h3><p>${displayDesc}</p><div class="module-badge"><i class="fas fa-arrow-right"></i> Launch</div>`;
            card.onclick = () => { addActivityLog(`🚀 Launched ${displayName}`); navigateTo(mod.url); };
            grid.appendChild(card);
        });
    }
    
    // Activity & Toast
    function addActivityLog(msg) { let cont = document.getElementById("activityList"); let div = document.createElement("div"); div.className = "activity-item"; let t = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); div.innerHTML = `<i class="fas fa-bell"></i> <span>${msg}</span><small style="margin-left:auto; color:#6b7280;">${t}</small>`; cont.prepend(div); if(cont.children.length > 15) cont.removeChild(cont.lastChild); let logs = JSON.parse(localStorage.getItem('activity_logs_stream')||'[]'); logs.unshift({message:msg, time:t}); if(logs.length>40) logs.pop(); localStorage.setItem('activity_logs_stream', JSON.stringify(logs)); }
    function loadActivityLogs() { let logs = JSON.parse(localStorage.getItem('activity_logs_stream')||'[]'); let cont = document.getElementById("activityList"); cont.innerHTML = ""; if(logs.length===0) { cont.innerHTML = `<div class="activity-item"><i class="fas fa-check-circle"></i> <span>Welcome to SADWAP StreamOps.</span></div>`; return; } logs.slice(0,15).forEach(l => { let div = document.createElement("div"); div.className = "activity-item"; div.innerHTML = `<i class="fas fa-history"></i> <span>${l.message}</span><small style="margin-left:auto; color:#6b7280;">${l.time}</small>`; cont.appendChild(div); }); }
    function showToast(msg) { let t = document.getElementById("toastMessage"); t.querySelector("span").innerText = msg; t.style.display = "flex"; setTimeout(() => t.style.display = "none", 2500); }
    function refreshAllData() { addActivityLog("🔄 Manual data sync completed"); showToast("Dashboard refreshed"); }
    document.getElementById("refreshDataBtn").addEventListener("click", refreshAllData);
    
    // Chatbot with working hyperlinks
    const chatbotPageContent = `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI Chat</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:'Inter',sans-serif;background:#0f111a;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden;}.chat-header{background:linear-gradient(135deg,#00d4ff,#7b2cbf);padding:16px;display:flex;align-items:center;gap:12px;}.messages-area{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}.message{display:flex;gap:10px;animation:fadeIn 0.3s ease;}.message.ai{justify-content:flex-start;}.message.user{justify-content:flex-end;}.bubble{max-width:85%;padding:10px 14px;border-radius:18px;font-size:0.85rem;line-height:1.4;}.ai .bubble{background:#1a1f2e;border-bottom-left-radius:4px;}.user .bubble{background:linear-gradient(135deg,#00d4ff,#7b2cbf);border-bottom-right-radius:4px;}.input-area{padding:12px 16px;background:#0a0c15;border-top:1px solid rgba(255,255,255,0.1);display:flex;gap:10px;}.input-area input{flex:1;background:#1a1f2e;border:1px solid #2a2f3e;padding:12px 16px;border-radius:25px;color:white;}.input-area button{background:linear-gradient(135deg,#00d4ff,#7b2cbf);border:none;padding:0 20px;border-radius:25px;cursor:pointer;color:white;}.quick-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}.quick-link{background:rgba(0,212,255,0.15);border:1px solid rgba(0,212,255,0.3);padding:6px 12px;border-radius:20px;font-size:0.7rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}.quick-link:hover{background:rgba(0,212,255,0.3);}@keyframes fadeIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}</style></head><body><div class="chat-header"><i class="fas fa-robot"></i><div><h3>SADWAP AI Assistant</h3><p>Click any link to navigate</p></div></div><div class="messages-area" id="messagesArea"><div class="message ai"><div class="bubble">👋 Hello! I can open any page for you.<br><br><strong>Quick Links (click to open):</strong><div class="quick-links" id="quickLinks"></div><br>Or type a command like: Inventory, Sales, Municipality, Transfers, Training, Admin, Expiry</div></div></div><div class="input-area"><input type="text" id="chatInput" placeholder="Ask me to open a page..."><button id="sendBtn"><i class="fas fa-paper-plane"></i></button></div><script>const links=[{name:"Inventory",url:"https://ghostkmr.github.io/2026/inventory.html",icon:"fa-boxes"},{name:"Sales",url:"https://ghostkmr.github.io/2026/salestracker.html",icon:"fa-chart-line"},{name:"Expiry",url:"https://ghostkmr.github.io/2026/expiration%20tracker.html",icon:"fa-calendar-times"},{name:"Municipality",url:"https://ghostkmr.github.io/2026/muncipality.html",icon:"fa-id-card"},{name:"Transfers",url:"https://ghostkmr.github.io/2026/transferrecords.html",icon:"fa-exchange-alt"},{name:"Training",url:"https://ghostkmr.github.io/2026/training%20calender.html",icon:"fa-calendar-alt"},{name:"Admin",url:"https://ghostkmr.github.io/2026/pannel.html",icon:"fa-user-shield"}];const ql=document.getElementById('quickLinks');links.forEach(l=>{let btn=document.createElement('div');btn.className='quick-link';btn.innerHTML='<i class="fas '+l.icon+'"></i> '+l.name;btn.onclick=()=>{window.parent.postMessage({type:'navigate',url:l.url},'*');};ql.appendChild(btn);});function addMessage(txt,isUser=false){let div=document.createElement('div');div.className='message '+(isUser?'user':'ai');div.innerHTML='<div class="bubble">'+txt+'</div>';document.getElementById('messagesArea').appendChild(div);div.scrollIntoView({behavior:'smooth'});}const map={inventory:"https://ghostkmr.github.io/2026/inventory.html",sales:"https://ghostkmr.github.io/2026/salestracker.html",expiry:"https://ghostkmr.github.io/2026/expiration%20tracker.html",municipality:"https://ghostkmr.github.io/2026/muncipality.html",transfers:"https://ghostkmr.github.io/2026/transferrecords.html",training:"https://ghostkmr.github.io/2026/training%20calender.html",admin:"https://ghostkmr.github.io/2026/pannel.html"};document.getElementById('sendBtn').onclick=()=>{let inp=document.getElementById('chatInput');let txt=inp.value.trim().toLowerCase();if(!txt)return;addMessage(inp.value.trim(),true);inp.value='';for(let[k,v]of Object.entries(map)){if(txt.includes(k)){window.parent.postMessage({type:'navigate',url:v},'*');addMessage("Opening "+k+"...",false);return;}}addMessage("Try: Inventory, Sales, Municipality, Transfers, Training, Expiry, or Admin",false);};document.getElementById('chatInput').addEventListener('keypress',(e)=>{if(e.key==='Enter')document.getElementById('sendBtn').click();});<\/script></body></html>`;
    const chatbotIframe = document.getElementById('chatbotIframe');
    chatbotIframe.srcdoc = chatbotPageContent;
    window.addEventListener('message', (event) => { if(event.data && event.data.type === 'navigate') { navigateTo(event.data.url); closeChatbot(); } });
    const floatingBtn = document.getElementById('floatingAiBtn'), chatbotModal = document.getElementById('chatbotModal'), closeChatbotBtn = document.getElementById('closeChatbotBtn');
    function openChatbot() { chatbotModal.classList.add('open'); addActivityLog("🤖 AI Assistant opened"); }
    function closeChatbot() { chatbotModal.classList.remove('open'); }
    floatingBtn.addEventListener('click', openChatbot); closeChatbotBtn.addEventListener('click', closeChatbot);
    
    // Date/Time & Stats
    function updateDateTime() { let n=new Date(); document.getElementById("currentDate").innerHTML = n.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); document.getElementById("currentTime").innerHTML = n.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
    setInterval(updateDateTime,1000); updateDateTime();
    let statsAnimated=false;
    function animateStats(){ if(statsAnimated) return; statsAnimated=true; let start=0; let iv=setInterval(()=>{ start+=50; if(start>=1247){ document.getElementById("activeUsers").innerText="1,247"; document.getElementById("systemHealth").innerText="99.9%"; document.getElementById("processedOps").innerText="45.2K"; clearInterval(iv); } else { document.getElementById("activeUsers").innerText=Math.floor(start); document.getElementById("processedOps").innerText=Math.floor(start*36.2); } },20); }
    setTimeout(animateStats,1000);
    
    // Initialize
    positionMenuItems(); loadSavedPosition(); setLanguage("en"); buildQuickModules(); loadActivityLogs();
    let existing = JSON.parse(localStorage.getItem('activity_logs_stream')||'[]');
    if(existing.length===0){ addActivityLog("🚀 SADWAP StreamOps initialized · Drag the circular menu anywhere!"); addActivityLog("📋 Click the compass icon to open the radial menu"); addActivityLog("🤖 AI Assistant ready - click the floating robot button"); addActivityLog("🔗 The chatbot has working hyperlinks!"); }
</script>
