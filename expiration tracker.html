
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Expiration Tracker | Corporate Suite</title>
    <!-- Bootstrap 5 Dark Mode + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Corporate & Arabic optimized fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- SheetJS + html2pdf -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { transition: all 0.2s ease; }
        body { background: #0A0C10; font-family: 'Inter', 'Cairo', sans-serif; color: #F0F2F5; padding-bottom: 2rem; }
        .card, .modal-content { background: #12151C; border: 1px solid #2A2E3A; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); }
        .btn-corporate { background: #1E2A3A; border: none; color: white; border-radius: 16px; padding: 8px 20px; font-weight: 500; transition: 0.2s; }
        .btn-corporate:hover { background: #2C3E50; transform: translateY(-2px); color: white; }
        .btn-outline-corporate { border: 1px solid #3A4A5A; background: transparent; color: #E0E4E9; border-radius: 16px; }
        .btn-outline-corporate:hover { background: #1E2A3A; }
        .table-dark th, .table-dark td { border-color: #2A2E3A; color: #EFF1F3; vertical-align: middle; }
        .status-badge { padding: 5px 12px; border-radius: 40px; font-size: 0.75rem; font-weight: 600; display: inline-block; white-space: nowrap; }
        .blink-red { animation: blinkWarning 0.9s step-start infinite; background-color: #C62828 !important; color: white; font-weight: bold; }
        @keyframes blinkWarning { 50% { background-color: #FF5722; box-shadow: 0 0 6px red; } }
        .critical-row { background-color: rgba(220, 53, 69, 0.18); border-left: 4px solid #dc3545; }
        .lang-pill { cursor: pointer; background: #1E2A3A; border-radius: 40px; padding: 6px 18px; font-weight: 600; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 6px; }
        [dir="rtl"] { text-align: right; }
        [dir="rtl"] .me-2 { margin-right: 0 !important; margin-left: 0.5rem !important; }
        [dir="rtl"] .ms-2 { margin-left: 0 !important; margin-right: 0.5rem !important; }
        input, input[type="date"] { background-color: #1A1E26 !important; border: 1px solid #2F3A48 !important; color: white !important; border-radius: 14px !important; padding: 10px 14px !important; }
        [dir="rtl"] input, [dir="rtl"] input::placeholder { text-align: right; font-family: 'Cairo', sans-serif; }
        label { font-weight: 500; margin-bottom: 0.3rem; font-size: 0.85rem; letter-spacing: 0.3px; }
        /* SIDEBAR GRAPH STYLES */
        .dashboard-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-top: 0.5rem;
        }
        .table-section {
            flex: 2;
            min-width: 280px;
        }
        .stats-sidebar {
            flex: 1;
            min-width: 240px;
            max-width: 320px;
        }
        .stats-card {
            background: #12151C;
            border-radius: 24px;
            border: 1px solid #2A2E3A;
            padding: 1.2rem;
            position: sticky;
            top: 1rem;
        }
        .chart-circle {
            display: flex;
            justify-content: center;
            margin-bottom: 1.2rem;
        }
        .chart-circle canvas {
            max-width: 180px;
            max-height: 180px;
            width: 100%;
            height: auto;
        }
        .stats-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid #2A2E3A;
        }
        .stat-badge {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 30px;
        }
        .stat-number {
            font-weight: 700;
            font-size: 1.3rem;
            background: #1A1E26;
            padding: 2px 12px;
            border-radius: 30px;
        }
        @media (max-width: 768px) {
            .stats-sidebar {
                max-width: 100%;
                order: 2;
            }
            .table-section {
                order: 1;
            }
            .dashboard-grid {
                flex-direction: column;
            }
        }
        [dir="rtl"] .stat-item {
            direction: rtl;
        }
        .toast-container { z-index: 1060; }
        [dir="rtl"] input[type="date"]::-webkit-calendar-picker-indicator { margin-left: 0; margin-right: auto; filter: invert(0.8); }
    </style>
</head>
<body>
<div class="container py-3 py-md-4">
    <!-- Header with language toggle -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <h1 class="fw-bold" id="mainTitle"><i class="fas fa-boxes me-2"></i>Expiration Tracker</h1>
        <div class="lang-pill" id="langToggleBtn">
            <i class="fas fa-globe"></i> <span id="langToggleText">العربية / EN</span>
        </div>
    </div>

    <!-- Add Product Card -->
    <div class="card p-3 p-md-4 mb-4">
        <div class="row g-3 align-items-end">
            <div class="col-md-4">
                <label id="productNameLabel" class="form-label">Product Name</label>
                <input type="text" id="productName" class="form-control" placeholder="e.g., Organic Milk" autocomplete="off">
            </div>
            <div class="col-md-4">
                <label id="expiryLabel" class="form-label">Expiration Date</label>
                <input type="date" id="expiryDate" class="form-control">
            </div>
            <div class="col-md-4 d-flex gap-2">
                <button id="addBtn" class="btn btn-corporate w-100"><i class="fas fa-plus-circle me-1"></i> <span id="addBtnText">Add Product</span></button>
            </div>
        </div>
    </div>

    <!-- Action Bar -->
    <div class="d-flex flex-wrap gap-2 mb-3 justify-content-between align-items-center">
        <div class="d-flex gap-2 flex-wrap">
            <button id="deleteEntireListBtn" class="btn btn-outline-danger btn-corporate"><i class="fas fa-trash-alt"></i> <span id="deleteAllText">Delete Entire List</span></button>
            <button id="hideListBtn" class="btn btn-outline-secondary btn-corporate"><i class="fas fa-eye-slash"></i> <span id="hideListText">Hide List</span></button>
            <button id="exportPdfBtn" class="btn btn-corporate"><i class="fas fa-file-pdf"></i> PDF</button>
            <button id="exportExcelBtn" class="btn btn-corporate"><i class="fas fa-file-excel"></i> Excel</button>
        </div>
        <span id="listStatus" class="small text-muted"></span>
    </div>

    <!-- Main Dashboard: Table (left/main) + Graph Sidebar (right) -->
    <div class="dashboard-grid">
        <!-- Product Table Section -->
        <div class="table-section" id="productTableWrapper">
            <div class="card p-0 overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-dark table-hover mb-0" id="productTable">
                        <thead class="bg-dark border-bottom">
                            <tr>
                                <th id="thProduct">Product</th>
                                <th id="thExpiry">Expiry Date</th>
                                <th id="thStatus">Status</th>
                                <th id="thActions">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Graph & Stats Sidebar (Right Side) -->
        <div class="stats-sidebar">
            <div class="stats-card">
                <h5 id="chartTitle" class="mb-3 text-center"><i class="fas fa-chart-pie me-2"></i> <span id="chartTitleText">Inventory Health</span></h5>
                <div class="chart-circle">
                    <canvas id="expiryChart" width="200" height="200"></canvas>
                </div>
                <div class="stats-list" id="statsList">
                    <!-- dynamic stats injected via JS but we'll populate with spans for language updates -->
                    <div class="stat-item" id="statCritical">
                        <span class="stat-badge bg-danger blink-red" id="criticalLabel">Critical (&lt;7d)</span>
                        <span class="stat-number" id="criticalCount">0</span>
                    </div>
                    <div class="stat-item" id="statDanger">
                        <span class="stat-badge bg-warning text-dark" id="dangerLabel">Danger (7-10d)</span>
                        <span class="stat-number" id="dangerCount">0</span>
                    </div>
                    <div class="stat-item" id="statCheck">
                        <span class="stat-badge bg-success" style="background:#2E7D32 !important;" id="checkLabel">Check (10-15d)</span>
                        <span class="stat-number" id="checkCount">0</span>
                    </div>
                    <div class="stat-item" id="statSafe">
                        <span class="stat-badge bg-info" style="background:#1B5E20 !important;" id="safeLabel">Safe (&gt;15d)</span>
                        <span class="stat-number" id="safeCount">0</span>
                    </div>
                    <div class="stat-item" id="statExpired">
                        <span class="stat-badge bg-secondary" id="expiredLabel">Expired</span>
                        <span class="stat-number" id="expiredCount">0</span>
                    </div>
                </div>
                <div class="mt-3 text-center small text-muted" id="lastUpdatedHint">
                    <i class="fas fa-sync-alt"></i>实时更新
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL POPUP with loop sound + 30sec cooldown, fully bilingual -->
<div class="modal fade" id="criticalModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content bg-dark text-white border-danger">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="criticalModalTitle"><i class="fas fa-exclamation-triangle text-danger me-2"></i> URGENT ALERT</h5>
                <button type="button" class="btn-close btn-close-white" id="closeModalCrossBtn"></button>
            </div>
            <div class="modal-body" id="criticalModalBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger" id="closeModalBtn"><span id="modalAckText">Acknowledge & Close</span></button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
    // ---------- PERSISTENT DATA ----------
    let products = [];          // each: { id, name, expiryDate }
    let isListHidden = false;
    let currentLang = 'en';     // 'en' or 'ar'
    let chart = null;
    
    // --- ALERT SOUND & POPUP COOLDOWN LOGIC (30 seconds after close)---
    let audioContext = null;
    let soundInterval = null;
    let popupModal = null;
    let popupCooldownUntil = 0;          // timestamp (ms) until next popup can appear
    
    // Play a single beep sound (loud)
    function playBeepSound() {
        try {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            const ctx = audioContext;
            const now = ctx.currentTime;
            const oscillator = ctx.createOscillator();
            const gain = ctx.createGain();
            oscillator.connect(gain);
            gain.connect(ctx.destination);
            oscillator.frequency.value = 980;
            gain.gain.value = 0.5;
            oscillator.start();
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
            oscillator.stop(now + 0.7);
            if (ctx.state === 'suspended') ctx.resume();
        } catch(e) { console.warn("audio error", e); }
    }
    
    function startSoundLoop() {
        if (soundInterval) clearInterval(soundInterval);
        playBeepSound();
        soundInterval = setInterval(() => {
            if (popupModal && popupModal._isShown && hasCriticalOrExpired()) {
                playBeepSound();
            } else if (!hasCriticalOrExpired()) {
                stopSoundLoop();
            }
        }, 2000); // loop every 2 sec while modal visible
    }
    
    function stopSoundLoop() {
        if (soundInterval) { clearInterval(soundInterval); soundInterval = null; }
    }
    
    function hasCriticalOrExpired() {
        for (let p of products) {
            const info = getStatusInfo(p.expiryDate);
            if (info.category === 'critical' || info.status === 'expired') return true;
        }
        return false;
    }
    
    function getCriticalAndExpiredList() {
        const critical = products.filter(p => getStatusInfo(p.expiryDate).category === 'critical');
        const expired = products.filter(p => getStatusInfo(p.expiryDate).status === 'expired');
        return { critical, expired };
    }
    
    function buildPopupMessage() {
        const { critical, expired } = getCriticalAndExpiredList();
        let msg = '';
        if (currentLang === 'en') {
            if (critical.length) msg += `⚠️ CRITICAL (expires within 7 days): ${critical.map(p=>p.name).join(', ')}.\n`;
            if (expired.length) msg += `❌ EXPIRED ITEMS: ${expired.map(p=>p.name).join(', ')}. Please remove from list immediately.`;
            if (!msg) msg = "No active alerts.";
        } else {
            if (critical.length) msg += `⚠️ حرج (ينتهي خلال 7 أيام): ${critical.map(p=>p.name).join(', ')}.\n`;
            if (expired.length) msg += `❌ عناصر منتهية الصلاحية: ${expired.map(p=>p.name).join(', ')}. الرجاء إزالة العناصر من القائمة فوراً.`;
            if (!msg) msg = "لا توجد تنبيهات نشطة.";
        }
        return msg;
    }
    
    function showAlertPopupIfNeeded() {
        if (!hasCriticalOrExpired()) {
            if (popupModal && popupModal._isShown) popupModal.hide();
            stopSoundLoop();
            return;
        }
        const now = Date.now();
        if (popupCooldownUntil > now) return;
        if (popupModal && popupModal._isShown) {
            if (!soundInterval) startSoundLoop();
            return;
        }
        const msg = buildPopupMessage();
        document.getElementById('criticalModalBody').innerText = msg;
        const modalTitleElem = document.getElementById('criticalModalTitle');
        if (currentLang === 'en') {
            modalTitleElem.innerHTML = '<i class="fas fa-bell text-danger me-2"></i> CRITICAL / EXPIRED ALERT';
            document.getElementById('modalAckText').innerText = 'Acknowledge & Close';
        } else {
            modalTitleElem.innerHTML = '<i class="fas fa-bell text-danger me-2"></i> تنبيه حرج / منتجات منتهية';
            document.getElementById('modalAckText').innerText = 'إغلاق وتأكيد';
        }
        if (!popupModal) popupModal = new bootstrap.Modal(document.getElementById('criticalModal'), { backdrop: 'static', keyboard: false });
        popupModal.show();
        startSoundLoop();
    }
    
    function onModalClosedManually() {
        if (popupModal) popupModal.hide();
        stopSoundLoop();
        popupCooldownUntil = Date.now() + 30000; // 30 seconds cooldown
        setTimeout(() => {
            if (hasCriticalOrExpired() && popupCooldownUntil <= Date.now()) {
                showAlertPopupIfNeeded();
            }
        }, 30500);
    }
    
    function initAlertWatcher() {
        setInterval(() => {
            if (hasCriticalOrExpired()) {
                if (popupCooldownUntil <= Date.now()) {
                    if (!popupModal || !popupModal._isShown) showAlertPopupIfNeeded();
                }
            } else {
                if (popupModal && popupModal._isShown) popupModal.hide();
                stopSoundLoop();
            }
        }, 5000);
    }
    
    // --- Helper: Product Status Calculation ---
    function getStatusInfo(expiryDateStr) {
        const today = new Date(); today.setHours(0,0,0,0);
        const expDate = new Date(expiryDateStr); expDate.setHours(0,0,0,0);
        const diffDays = Math.ceil((expDate - today) / (1000*3600*24));
        if (expDate < today) return { status: 'expired', category: 'expired', textEn: 'Expired', textAr: 'منتهي', class: 'bg-secondary', blink: false };
        if (diffDays <= 7) return { status: 'critical', category: 'critical', textEn: 'Critical (<7d)', textAr: 'حرج (<7 أيام)', class: 'bg-danger blink-red', blink: true };
        if (diffDays <= 10) return { status: 'danger', category: 'danger', textEn: 'Danger (7-10d)', textAr: 'خطر (7-10 أيام)', class: 'bg-warning text-dark', blink: false };
        if (diffDays <= 15) return { status: 'check', category: 'check', textEn: 'Need Check (10-15d)', textAr: 'بحاجة مراجعة (10-15 يوم)', class: 'bg-success', blink: false };
        return { status: 'safe', category: 'safe', textEn: 'Safe (>15d)', textAr: 'آمن (>15 يوم)', class: 'bg-info', blink: false };
    }
    
    // --- LocalStorage Load/Save (persist on reload)---
    function loadFromStorage() {
        const stored = localStorage.getItem('expiration_tracker_data');
        if (stored) {
            try { products = JSON.parse(stored); } catch(e) { products = []; }
        } else { products = []; }
        const hiddenPref = localStorage.getItem('expiration_list_hidden');
        isListHidden = (hiddenPref === 'true');
    }
    
    function saveToStorage() {
        localStorage.setItem('expiration_tracker_data', JSON.stringify(products));
        localStorage.setItem('expiration_list_hidden', isListHidden);
    }
    
    // Render table with bilingual status
    function renderTable() {
        const tbody = document.getElementById('productTableBody');
        tbody.innerHTML = '';
        if (products.length === 0) {
            const emptyMsg = currentLang === 'en' ? 'No products added.' : 'لا توجد منتجات مضافة.';
            tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted">${emptyMsg}</td></tr>`;
            return;
        }
        const sorted = [...products].sort((a,b) => new Date(a.expiryDate) - new Date(b.expiryDate));
        sorted.forEach(prod => {
            const info = getStatusInfo(prod.expiryDate);
            const displayStatus = currentLang === 'en' ? info.textEn : info.textAr;
            const row = tbody.insertRow();
            if (info.category === 'critical') row.classList.add('critical-row');
            row.insertCell(0).innerText = prod.name;
            row.insertCell(1).innerText = prod.expiryDate;
            row.insertCell(2).innerHTML = `<span class="status-badge ${info.class}">${displayStatus}</span>`;
            const actionCell = row.insertCell(3);
            const editIcon = currentLang === 'en' ? 'Edit' : 'تعديل';
            const deleteIcon = currentLang === 'en' ? 'Delete' : 'حذف';
            actionCell.innerHTML = `<button class="btn btn-sm btn-outline-info me-1 edit-product" data-id="${prod.id}" title="${editIcon}"><i class="fas fa-pen"></i></button>
                                    <button class="btn btn-sm btn-outline-danger delete-product" data-id="${prod.id}" title="${deleteIcon}"><i class="fas fa-trash"></i></button>`;
        });
        document.querySelectorAll('.edit-product').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); editProduct(parseInt(btn.dataset.id)); }));
        document.querySelectorAll('.delete-product').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); deleteProduct(parseInt(btn.dataset.id)); }));
    }
    
    function updateChartAndCounters() {
        let counts = { critical:0, danger:0, check:0, safe:0, expired:0 };
        products.forEach(p => {
            const info = getStatusInfo(p.expiryDate);
            if (info.category === 'critical') counts.critical++;
            else if (info.category === 'danger') counts.danger++;
            else if (info.category === 'check') counts.check++;
            else if (info.category === 'safe') counts.safe++;
            else if (info.status === 'expired') counts.expired++;
        });
        document.getElementById('criticalCount').innerText = counts.critical;
        document.getElementById('dangerCount').innerText = counts.danger;
        document.getElementById('checkCount').innerText = counts.check;
        document.getElementById('safeCount').innerText = counts.safe;
        document.getElementById('expiredCount').innerText = counts.expired;
        if (chart) chart.destroy();
        const ctx = document.getElementById('expiryChart').getContext('2d');
        const chartLabels = currentLang === 'en' 
            ? ['Critical (<7d)','Danger (7-10d)','Check (10-15d)','Safe (>15d)','Expired']
            : ['حرج (<7 أيام)','خطر (7-10 أيام)','مراجعة (10-15)','آمن (>15 يوم)','منتهي'];
        chart = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: chartLabels, datasets: [{ data: [counts.critical, counts.danger, counts.check, counts.safe, counts.expired], backgroundColor: ['#dc3545','#ffc107','#2E7D32','#17a2b8','#6c757d'], borderWidth: 0 }] },
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom', labels: { color: '#ddd', font: { size: 9 } } } } }
        });
    }
    
    // Refresh UI completely (language aware)
    function refreshUI() {
        renderTable();
        updateChartAndCounters();
        const wrapper = document.getElementById('productTableWrapper');
        wrapper.style.display = isListHidden ? 'none' : 'block';
        document.getElementById('listStatus').innerText = isListHidden ? (currentLang === 'en' ? '📋 List hidden' : 'القائمة مخفية') : '';
        const hideBtnSpan = document.getElementById('hideListText');
        hideBtnSpan.innerText = currentLang === 'en' ? (isListHidden ? 'Show List' : 'Hide List') : (isListHidden ? 'إظهار القائمة' : 'إخفاء القائمة');
        // Update side labels
        document.getElementById('criticalLabel').innerText = currentLang === 'en' ? 'Critical (<7d)' : 'حرج (<7 أيام)';
        document.getElementById('dangerLabel').innerText = currentLang === 'en' ? 'Danger (7-10d)' : 'خطر (7-10 أيام)';
        document.getElementById('checkLabel').innerText = currentLang === 'en' ? 'Check (10-15d)' : 'مراجعة (10-15 يوم)';
        document.getElementById('safeLabel').innerText = currentLang === 'en' ? 'Safe (>15d)' : 'آمن (>15 يوم)';
        document.getElementById('expiredLabel').innerText = currentLang === 'en' ? 'Expired' : 'منتهي';
        document.getElementById('chartTitleText').innerText = currentLang === 'en' ? 'Inventory Health' : 'صحة المخزون';
        document.getElementById('lastUpdatedHint').innerHTML = currentLang === 'en' ? '<i class="fas fa-sync-alt"></i> Live updates' : '<i class="fas fa-sync-alt"></i> تحديث مباشر';
    }
    
    // Data mutations
    function addProduct() {
        let name = document.getElementById('productName').value.trim();
        let expDate = document.getElementById('expiryDate').value;
        if (!name) {
            alert(currentLang === 'en' ? 'Product name required' : 'اسم المنتج مطلوب');
            return;
        }
        if (!expDate) {
            alert(currentLang === 'en' ? 'Expiry date required' : 'تاريخ الانتهاء مطلوب');
            return;
        }
        products.push({ id: Date.now(), name: name, expiryDate: expDate });
        saveToStorage();
        refreshUI();
        document.getElementById('productName').value = '';
        document.getElementById('expiryDate').value = '';
        setTimeout(() => { if(hasCriticalOrExpired()) showAlertPopupIfNeeded(); }, 200);
    }
    
    function deleteProduct(id) {
        products = products.filter(p => p.id !== id);
        saveToStorage();
        refreshUI();
        if (!hasCriticalOrExpired()) { if(popupModal && popupModal._isShown) popupModal.hide(); stopSoundLoop(); }
        else showAlertPopupIfNeeded();
    }
    
    function editProduct(id) {
        const prod = products.find(p => p.id === id);
        if (!prod) return;
        let newName = prompt(currentLang === 'en' ? 'Edit product name' : 'تعديل اسم المنتج', prod.name);
        if (newName && newName.trim()) prod.name = newName.trim();
        let newDate = prompt(currentLang === 'en' ? 'Edit expiry date (YYYY-MM-DD)' : 'تعديل تاريخ الانتهاء (YYYY-MM-DD)', prod.expiryDate);
        if (newDate && !isNaN(Date.parse(newDate))) prod.expiryDate = newDate;
        saveToStorage();
        refreshUI();
        if(hasCriticalOrExpired()) showAlertPopupIfNeeded();
        else { if(popupModal && popupModal._isShown) popupModal.hide(); stopSoundLoop(); }
    }
    
    function deleteEntireList() {
        const confirmMsg = currentLang === 'en' ? 'Delete ALL products permanently?' : 'هل تريد حذف جميع المنتجات نهائياً؟';
        if (confirm(confirmMsg)) {
            products = [];
            saveToStorage();
            refreshUI();
            if(popupModal && popupModal._isShown) popupModal.hide();
            stopSoundLoop();
        }
    }
    
    function toggleHideList() {
        isListHidden = !isListHidden;
        saveToStorage();
        refreshUI();
    }
    
    function exportToPDF() {
        if(!products.length) { alert(currentLang === 'en' ? 'No data to export' : 'لا توجد بيانات للتصدير'); return; }
        html2pdf().set({ margin: 0.5, filename: 'expiry_report.pdf' }).from(document.getElementById('productTableWrapper')).save();
    }
    function exportToExcel() {
        if(!products.length) { alert(currentLang === 'en' ? 'No data' : 'لا توجد بيانات'); return; }
        let sheetData = products.map(p => ({ 
            [currentLang === 'en' ? 'Product' : 'المنتج']: p.name, 
            [currentLang === 'en' ? 'Expiry Date' : 'تاريخ الانتهاء']: p.expiryDate, 
            [currentLang === 'en' ? 'Status' : 'الحالة']: (currentLang === 'en' ? getStatusInfo(p.expiryDate).textEn : getStatusInfo(p.expiryDate).textAr) 
        }));
        const ws = XLSX.utils.json_to_sheet(sheetData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'ExpirationTracker');
        XLSX.writeFile(wb, `expiration_${new Date().toISOString().slice(0,10)}.xlsx`);
    }
    
    // --- FULL BILINGUAL UI (everything on page)---
    function applyLanguage() {
        const isAr = currentLang === 'ar';
        document.body.setAttribute('dir', isAr ? 'rtl' : 'ltr');
        document.documentElement.lang = isAr ? 'ar' : 'en';
        const nameInput = document.getElementById('productName');
        if (isAr) {
            nameInput.placeholder = 'مثال: حليب عضوي';
            nameInput.setAttribute('lang', 'ar');
            nameInput.style.fontFamily = "'Cairo', sans-serif";
        } else {
            nameInput.placeholder = 'e.g., Organic Milk';
            nameInput.setAttribute('lang', 'en');
            nameInput.style.fontFamily = "'Inter', sans-serif";
        }
        document.getElementById('mainTitle').innerHTML = isAr ? '<i class="fas fa-boxes me-2"></i> متتبع انتهاء الصلاحية' : '<i class="fas fa-boxes me-2"></i> Expiration Tracker';
        document.getElementById('productNameLabel').innerText = isAr ? 'اسم المنتج' : 'Product Name';
        document.getElementById('expiryLabel').innerText = isAr ? 'تاريخ الانتهاء' : 'Expiration Date';
        document.getElementById('addBtnText').innerText = isAr ? 'إضافة منتج' : 'Add Product';
        document.getElementById('deleteAllText').innerText = isAr ? 'حذف القائمة بالكامل' : 'Delete Entire List';
        document.getElementById('hideListText').innerText = isAr ? (isListHidden ? 'إظهار القائمة' : 'إخفاء القائمة') : (isListHidden ? 'Show List' : 'Hide List');
        document.getElementById('thProduct').innerText = isAr ? 'المنتج' : 'Product';
        document.getElementById('thExpiry').innerText = isAr ? 'تاريخ الانتهاء' : 'Expiry Date';
        document.getElementById('thStatus').innerText = isAr ? 'الحالة' : 'Status';
        document.getElementById('thActions').innerText = isAr ? 'إجراءات' : 'Actions';
        document.getElementById('langToggleText').innerHTML = isAr ? '🇸🇦 English / عربي' : '🇸🇦 العربية / EN';
        refreshUI();
    }
    
    function toggleLanguage() { 
        currentLang = currentLang === 'en' ? 'ar' : 'en'; 
        applyLanguage();
        if(hasCriticalOrExpired() && (!popupModal || !popupModal._isShown)) showAlertPopupIfNeeded();
    }
    
    // --- Event Binding & Initialization ---
    document.getElementById('addBtn').addEventListener('click', addProduct);
    document.getElementById('deleteEntireListBtn').addEventListener('click', deleteEntireList);
    document.getElementById('hideListBtn').addEventListener('click', toggleHideList);
    document.getElementById('exportPdfBtn').addEventListener('click', exportToPDF);
    document.getElementById('exportExcelBtn').addEventListener('click', exportToExcel);
    document.getElementById('langToggleBtn').addEventListener('click', toggleLanguage);
    document.getElementById('closeModalBtn').addEventListener('click', onModalClosedManually);
    document.getElementById('closeModalCrossBtn').addEventListener('click', onModalClosedManually);
    
    loadFromStorage();
    applyLanguage();
    initAlertWatcher();
    setTimeout(() => { if(hasCriticalOrExpired()) showAlertPopupIfNeeded(); }, 500);
</script>
</body>
</html>
