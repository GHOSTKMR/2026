
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>SADWAP | Expiry Tracking Dashboard</title>
    <!-- Bootstrap 5 + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- XLSX for export -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-page: #f1f5f9;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border-light: #e2e8f0;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --critical-red: #dc2626;
            --critical-bg: #fee2e2;
            --warning-orange: #f59e0b;
            --warning-bg: #fffbeb;
            --expired-bg: #fef2f2;
            --today-bg: #fef3c7;
            --success-green: #10b981;
            --sidebar-width: 260px;
        }

        body.dark {
            --bg-page: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-light: #334155;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --critical-red: #f87171;
            --critical-bg: #450a0a;
            --warning-orange: #fbbf24;
            --warning-bg: #422006;
            --expired-bg: #7f1a1a;
            --today-bg: #78350f;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            transition: background 0.2s, color 0.2s;
            padding: 16px;
        }

        .dashboard-container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Header */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            background: var(--card-bg);
            padding: 12px 24px;
            border-radius: 28px;
            border: 1px solid var(--border-light);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #2563eb, #8b5cf6);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: 700;
            color: white;
        }
        .controls-group {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .theme-lang {
            display: flex;
            gap: 8px;
            background: var(--border-light);
            padding: 6px;
            border-radius: 40px;
        }
        .btn-icon {
            background: transparent;
            border: none;
            padding: 8px 16px;
            border-radius: 32px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .btn-icon.active {
            background: var(--accent);
            color: white;
        }

        /* Summary Cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px 16px;
            border: 1px solid var(--border-light);
            transition: transform 0.1s;
        }
        .stat-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .stat-number {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 8px 0;
        }
        .stat-sub {
            font-size: 0.7rem;
        }

        /* Filters */
        .filter-bar {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px 20px;
            margin-bottom: 24px;
            border: 1px solid var(--border-light);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
        }
        .filter-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .filter-chip {
            background: var(--bg-page);
            border: 1px solid var(--border-light);
            border-radius: 40px;
            padding: 8px 20px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
        }
        .filter-chip.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .search-input {
            background: var(--bg-page);
            border: 1px solid var(--border-light);
            border-radius: 40px;
            padding: 8px 20px;
            width: 240px;
            color: var(--text-primary);
        }

        /* Table / Cards (mobile optimized) */
        .products-container {
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--border-light);
            overflow-x: auto;
        }
        .product-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }
        .product-table th {
            text-align: left;
            padding: 16px 16px;
            border-bottom: 2px solid var(--border-light);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.85rem;
        }
        .product-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-light);
            vertical-align: middle;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        .badge-critical { background: var(--critical-red); color: white; }
        .badge-warning { background: var(--warning-orange); color: #1e293b; }
        .badge-expired { background: #6b7280; color: white; }
        .badge-today { background: var(--warning-orange); color: #422006; }

        .row-critical { background-color: var(--critical-bg); border-left: 4px solid var(--critical-red); }
        .row-warning { background-color: var(--warning-bg); border-left: 4px solid var(--warning-orange); }
        .row-expired { background-color: var(--expired-bg); opacity: 0.8; }
        .row-today { background-color: var(--today-bg); }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .loading-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .spinner-large {
            width: 50px;
            height: 50px;
            border: 4px solid #cbd5e1;
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Toast */
        .toast-notify {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--card-bg);
            border-left: 5px solid var(--accent);
            padding: 12px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            z-index: 1100;
            display: none;
            align-items: center;
            gap: 12px;
        }

        @media (max-width: 768px) {
            body { padding: 12px; }
            .stat-number { font-size: 1.6rem; }
            .filter-chip { padding: 6px 14px; font-size: 0.75rem; }
        }

        [dir="rtl"] .product-table th, [dir="rtl"] .product-table td {
            text-align: right;
        }
        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            margin: 0 4px;
            cursor: pointer;
        }
        .btn-export {
            background: var(--accent);
            border: none;
            border-radius: 40px;
            padding: 8px 20px;
            color: white;
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <!-- Header -->
    <div class="header-bar">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-hourglass-half"></i></div>
            <div><h2 style="font-weight: 700; margin:0;">Expiry Tracker</h2><small style="color: var(--text-secondary);">SADWAP Operations</small></div>
        </div>
        <div class="controls-group">
            <div class="theme-lang">
                <button class="btn-icon" id="darkModeToggle"><i class="fas fa-moon"></i> <span id="themeText">Dark</span></button>
                <button class="btn-icon active" id="langEn">EN</button>
                <button class="btn-icon" id="langAr">AR</button>
            </div>
            <button class="btn-export" id="exportExcelBtn"><i class="fas fa-file-excel"></i> Export</button>
        </div>
    </div>

    <!-- Summary Cards -->
    <div class="summary-grid" id="summaryGrid">
        <div class="stat-card"><div class="stat-title" data-key="totalItems">Total Items</div><div class="stat-number" id="totalItems">0</div><div class="stat-sub">active products</div></div>
        <div class="stat-card"><div class="stat-title" data-key="expiringToday">Expiring Today</div><div class="stat-number" id="expiringToday" style="color: #f59e0b;">0</div><div class="stat-sub">needs action</div></div>
        <div class="stat-card"><div class="stat-title" data-key="criticalItems">Critical (≤7 days)</div><div class="stat-number" id="criticalItems" style="color: #dc2626;">0</div><div class="stat-sub">warning zone</div></div>
        <div class="stat-card"><div class="stat-title" data-key="expiredItems">Expired Items</div><div class="stat-number" id="expiredItems" style="color: #6b7280;">0</div><div class="stat-sub">dispose required</div></div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
        <div class="filter-group" id="filterGroup">
            <button class="filter-chip active" data-filter="all" data-key="allFilter">All</button>
            <button class="filter-chip" data-filter="critical" data-key="criticalFilter">Critical (≤7d)</button>
            <button class="filter-chip" data-filter="today" data-key="todayFilter">Expiring Today</button>
            <button class="filter-chip" data-filter="expired" data-key="expiredFilter">Expired</button>
        </div>
        <div>
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search product..." autocomplete="off">
        </div>
    </div>

    <!-- Products Table / Responsive -->
    <div class="products-container">
        <table class="product-table" id="productTable">
            <thead>
                <tr><th data-key="productName">Product Name</th><th data-key="expiryDate">Expiry Date</th><th data-key="status">Status</th><th data-key="daysLeft">Days Left</th><th data-key="actions">Actions</th></tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="5" style="text-align:center; padding: 40px;"><i class="fas fa-spinner fa-pulse"></i> Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Loading Overlay -->
<div id="loadingOverlay" class="loading-overlay"><div class="spinner-large"></div></div>
<div id="toastMsg" class="toast-notify"><i class="fas fa-check-circle"></i> <span id="toastText"></span></div>

<script>
    // ========== translations ==========
    const translations = {
        en: {
            totalItems: "Total Items", expiringToday: "Expiring Today", criticalItems: "Critical (≤7 days)", expiredItems: "Expired Items",
            allFilter: "All", criticalFilter: "Critical (≤7d)", todayFilter: "Expiring Today", expiredFilter: "Expired",
            productName: "Product Name", expiryDate: "Expiry Date", status: "Status", daysLeft: "Days Left", actions: "Actions",
            criticalStatus: "Critical", warningStatus: "Warning", expiredStatus: "Expired", todayStatus: "Today"
        },
        ar: {
            totalItems: "إجمالي العناصر", expiringToday: "تنتهي اليوم", criticalItems: "حرج (≤7 أيام)", expiredItems: "منتهي الصلاحية",
            allFilter: "الكل", criticalFilter: "حرج (≤7د)", todayFilter: "تنتهي اليوم", expiredFilter: "منتهي",
            productName: "اسم المنتج", expiryDate: "تاريخ الانتهاء", status: "الحالة", daysLeft: "الأيام المتبقية", actions: "إجراءات",
            criticalStatus: "حرج", warningStatus: "تحذير", expiredStatus: "منتهي", todayStatus: "اليوم"
        }
    };
    let currentLang = "en";
    let currentFilter = "all";
    let currentSearch = "";
    let products = [];

    // Helper date functions
    function getDaysRemaining(expiryDateStr) {
        const today = new Date(); today.setHours(0,0,0,0);
        const expiry = new Date(expiryDateStr); expiry.setHours(0,0,0,0);
        return Math.ceil((expiry - today) / (1000*60*60*24));
    }

    function getStatusInfo(days) {
        if (days < 0) return { status: "expired", label: "Expired", class: "badge-expired", priority: 0 };
        if (days === 0) return { status: "today", label: "Expires Today", class: "badge-today", priority: 1 };
        if (days <= 7) return { status: "critical", label: "Critical", class: "badge-critical", priority: 2 };
        return { status: "warning", label: "Warning", class: "badge-warning", priority: 3 };
    }

    // Load mock + localStorage
    function loadMockData() {
        const stored = localStorage.getItem("sadwap_expiry_items");
        if (stored) return JSON.parse(stored);
        // Default mock
        const now = new Date();
        const today = new Date(now); today.setHours(0,0,0,0);
        const tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate()+1);
        const in3days = new Date(now); in3days.setDate(in3days.getDate()+3);
        const in10days = new Date(now); in10days.setDate(in10days.getDate()+10);
        const expired = new Date(now); expired.setDate(expired.getDate()-5);
        return [
            { id: "1", name: "Fresh Milk", expiry: new Date(today).toISOString().split('T')[0] },
            { id: "2", name: "Yogurt Drink", expiry: new Date(tomorrow).toISOString().split('T')[0] },
            { id: "3", name: "Chicken Breast", expiry: new Date(in3days).toISOString().split('T')[0] },
            { id: "4", name: "Lettuce Pack", expiry: new Date(in10days).toISOString().split('T')[0] },
            { id: "5", name: "Cheese Slices", expiry: new Date(expired).toISOString().split('T')[0] },
            { id: "6", name: "Beef Mince", expiry: new Date(in3days).toISOString().split('T')[0] }
        ];
    }

    function saveToLocal() { localStorage.setItem("sadwap_expiry_items", JSON.stringify(products)); }

    // Render stats and table with filter & search
    function renderDashboard() {
        if (!products.length) { document.getElementById("tableBody").innerHTML = `<tr><td colspan="5" style="text-align:center; padding:40px;"><i class="fas fa-box-open"></i> No items</td></tr>`; updateStats(); return; }
        let filtered = products.filter(p => {
            const days = getDaysRemaining(p.expiry);
            let matchesFilter = false;
            if (currentFilter === "all") matchesFilter = true;
            else if (currentFilter === "critical") matchesFilter = days <= 7 && days >= 0;
            else if (currentFilter === "today") matchesFilter = days === 0;
            else if (currentFilter === "expired") matchesFilter = days < 0;
            else matchesFilter = true;
            const search = currentSearch.trim().toLowerCase();
            const matchesSearch = search === "" || p.name.toLowerCase().includes(search);
            return matchesFilter && matchesSearch;
        });
        // sort by urgency
        filtered.sort((a,b) => {
            const da = getDaysRemaining(a.expiry);
            const db = getDaysRemaining(b.expiry);
            if (da < 0 && db >=0) return 1;
            if (da >=0 && db <0) return -1;
            return da - db;
        });
        renderTableRows(filtered);
        updateStats();
    }

    function renderTableRows(items) {
        const tbody = document.getElementById("tableBody");
        if (items.length === 0) { tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:40px;"><i class="fas fa-filter"></i> No matching items</td></tr>`; return; }
        tbody.innerHTML = items.map(item => {
            const days = getDaysRemaining(item.expiry);
            const statusObj = getStatusInfo(days);
            let rowClass = "";
            if (statusObj.status === "expired") rowClass = "row-expired";
            else if (statusObj.status === "critical" && days > 0) rowClass = "row-critical";
            else if (statusObj.status === "today") rowClass = "row-today";
            else if (statusObj.status === "warning" && days <=7) rowClass = "row-warning";
            const daysLeftText = days < 0 ? `Expired (${Math.abs(days)} days ago)` : days === 0 ? "Today" : `${days} days`;
            const statusLabel = currentLang === "ar" ? 
                (statusObj.status === "expired" ? "منتهي" : statusObj.status === "today" ? "اليوم" : statusObj.status === "critical" ? "حرج" : "تحذير") :
                statusObj.label;
            const badgeClass = statusObj.class;
            return `<tr class="${rowClass}">
                <td><i class="fas fa-box me-2" style="color:var(--accent);"></i>${escapeHtml(item.name)}</td>
                <td>${item.expiry}</td>
                <td><span class="status-badge ${badgeClass}">${statusLabel}</span></td>
                <td>${daysLeftText}</td>
                <td><button class="action-btn edit-product" data-id="${item.id}" title="Edit"><i class="fas fa-edit"></i></button>
                    <button class="action-btn delete-product" data-id="${item.id}" title="Delete"><i class="fas fa-trash-alt"></i></button></td>
            </tr>`;
        }).join('');
        // attach events
        document.querySelectorAll('.edit-product').forEach(btn => btn.addEventListener('click', (e) => { const id = btn.getAttribute('data-id'); editProductById(id); }));
        document.querySelectorAll('.delete-product').forEach(btn => btn.addEventListener('click', (e) => { const id = btn.getAttribute('data-id'); deleteProductById(id); }));
    }

    function updateStats() {
        const total = products.length;
        let expiringToday = 0;
        let criticalCount = 0;
        let expiredCount = 0;
        products.forEach(p => {
            const days = getDaysRemaining(p.expiry);
            if (days === 0) expiringToday++;
            if (days <= 7 && days >= 0) criticalCount++;
            if (days < 0) expiredCount++;
        });
        document.getElementById("totalItems").innerText = total;
        document.getElementById("expiringToday").innerText = expiringToday;
        document.getElementById("criticalItems").innerText = criticalCount;
        document.getElementById("expiredItems").innerText = expiredCount;
    }

    function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    // Edit / Delete actions with toast
    function editProductById(id) {
        const product = products.find(p => p.id === id);
        if (!product) return;
        const newName = prompt("Edit product name:", product.name);
        if (newName && newName.trim()) product.name = newName.trim();
        const newDate = prompt("Edit expiry date (YYYY-MM-DD):", product.expiry);
        if (newDate && newDate.match(/^\d{4}-\d{2}-\d{2}$/)) product.expiry = newDate;
        saveToLocal();
        renderDashboard();
        showToast("Product updated", "success");
    }
    function deleteProductById(id) {
        if (confirm("Delete this product?")) {
            products = products.filter(p => p.id !== id);
            saveToLocal();
            renderDashboard();
            showToast("Deleted", "info");
        }
    }
    function showToast(msg, type="success") {
        const toast = document.getElementById("toastMsg");
        document.getElementById("toastText").innerText = msg;
        toast.style.display = "flex";
        setTimeout(() => toast.style.display = "none", 2500);
    }

    // Add new product form (inline quick add)
    function initAddForm() {
        const header = document.querySelector(".header-bar");
        const addBtn = document.createElement("button");
        addBtn.className = "btn-export";
        addBtn.innerHTML = '<i class="fas fa-plus-circle"></i> Add Product';
        addBtn.style.background = "#10b981";
        addBtn.style.marginLeft = "8px";
        addBtn.onclick = () => {
            const name = prompt("Product name:", "New Item");
            if (!name) return;
            const dateStr = prompt("Expiry date (YYYY-MM-DD):", new Date().toISOString().split('T')[0]);
            if (!dateStr || !dateStr.match(/^\d{4}-\d{2}-\d{2}$/)) return;
            const newId = Date.now().toString();
            products.push({ id: newId, name: name.trim(), expiry: dateStr });
            saveToLocal();
            renderDashboard();
            showToast(`Added ${name}`, "success");
        };
        document.querySelector(".controls-group").appendChild(addBtn);
    }

    // Loading simulation (fast)
    function showLoading(show) {
        const overlay = document.getElementById("loadingOverlay");
        if (show) overlay.classList.add("active");
        else overlay.classList.remove("active");
    }

    // Language update & RTL
    function updateLanguage() {
        const t = translations[currentLang];
        for (let key in t) {
            const elems = document.querySelectorAll(`[data-key="${key}"]`);
            elems.forEach(el => { if (el) el.innerText = t[key]; });
        }
        document.querySelectorAll("#filterGroup .filter-chip").forEach(btn => {
            const filterKey = btn.getAttribute("data-filter");
            if (filterKey === "all") btn.innerText = t.allFilter;
            if (filterKey === "critical") btn.innerText = t.criticalFilter;
            if (filterKey === "today") btn.innerText = t.todayFilter;
            if (filterKey === "expired") btn.innerText = t.expiredFilter;
        });
        document.querySelectorAll("#summaryGrid .stat-card .stat-title").forEach((el, idx) => {
            const keys = ["totalItems", "expiringToday", "criticalItems", "expiredItems"];
            if (idx < keys.length) el.innerText = t[keys[idx]];
        });
        document.querySelectorAll("#productTable thead th").forEach((th, idx) => {
            const keys = ["productName", "expiryDate", "status", "daysLeft", "actions"];
            if (idx < keys.length) th.innerText = t[keys[idx]];
        });
        if (currentLang === "ar") document.documentElement.setAttribute("dir", "rtl");
        else document.documentElement.setAttribute("dir", "ltr");
        renderDashboard(); // refresh status labels
    }

    // Dark mode
    let darkMode = localStorage.getItem("sadwap_dark") === "true";
    function applyDarkMode() {
        if (darkMode) document.body.classList.add("dark");
        else document.body.classList.remove("dark");
        document.getElementById("themeText").innerText = darkMode ? "Light" : "Dark";
    }
    document.getElementById("darkModeToggle").addEventListener("click", () => {
        darkMode = !darkMode;
        localStorage.setItem("sadwap_dark", darkMode);
        applyDarkMode();
    });

    // filters & search
    function bindFilters() {
        document.querySelectorAll(".filter-chip").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".filter-chip").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentFilter = btn.getAttribute("data-filter");
                renderDashboard();
            });
        });
        const searchInput = document.getElementById("searchInput");
        searchInput.addEventListener("input", (e) => { currentSearch = e.target.value; renderDashboard(); });
    }

    // Export to Excel
    function exportToExcel() {
        const data = products.map(p => ({ Name: p.name, "Expiry Date": p.expiry, "Days Left": getDaysRemaining(p.expiry) }));
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "ExpiryTracker");
        XLSX.writeFile(wb, `expiry_export_${new Date().toISOString().slice(0,19)}.xlsx`);
        showToast("Export complete", "success");
    }

    // Initialize real-time
    async function init() {
        showLoading(true);
        await new Promise(r => setTimeout(r, 400));
        products = loadMockData();
        saveToLocal();
        renderDashboard();
        bindFilters();
        initAddForm();
        updateLanguage();
        applyDarkMode();
        document.getElementById("exportExcelBtn").addEventListener("click", exportToExcel);
        document.getElementById("langEn").addEventListener("click", () => { currentLang = "en"; document.getElementById("langEn").classList.add("active"); document.getElementById("langAr").classList.remove("active"); updateLanguage(); });
        document.getElementById("langAr").addEventListener("click", () => { currentLang = "ar"; document.getElementById("langAr").classList.add("active"); document.getElementById("langEn").classList.remove("active"); updateLanguage(); });
        showLoading(false);
        // play subtle alert if critical items
        const criticalCount = products.filter(p => getDaysRemaining(p.expiry) <= 7 && getDaysRemaining(p.expiry) >= 0).length;
        if (criticalCount > 0) showToast(`${criticalCount} critical items require attention`, "warning");
    }
    init();
</script>
</body>
</html>
