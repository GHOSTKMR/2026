

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>SADWAP | Corporate Phone Book</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #1e4a76;
            --primary-dark: #0f3b5c;
            --primary-soft: #eef2f8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --card-bg: #ffffff;
            --border: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --radius-card: 20px;
            --radius-element: 12px;
            --touch-target: 44px;
        }

        body.dark {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-soft: #1e293b;
            --gray-50: #0f172a;
            --gray-100: #1e293b;
            --gray-200: #334155;
            --gray-500: #94a3b8;
            --gray-600: #cbd5e1;
            --gray-700: #e2e8f0;
            --gray-800: #f1f5f9;
            --card-bg: #1e293b;
            --border: #334155;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--gray-100);
            color: var(--gray-800);
            transition: background 0.2s, color 0.2s;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header-card {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            padding: 20px 24px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .logo-area h1 { font-size: 1.5rem; font-weight: 700; margin: 0; color: var(--primary); }
        .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .lang-switch { display: flex; gap: 6px; background: var(--gray-200); padding: 4px; border-radius: 40px; }
        .lang-btn { background: transparent; border: none; padding: 6px 18px; border-radius: 32px; font-weight: 600; font-size: 0.75rem; cursor: pointer; color: var(--gray-600); transition: all 0.2s; }
        .lang-btn.active { background: var(--primary); color: white; }
        .theme-toggle { background: var(--gray-200); border: none; border-radius: 40px; padding: 6px 18px; display: flex; align-items: center; gap: 6px; color: var(--gray-700); font-weight: 500; font-size: 0.75rem; cursor: pointer; }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            padding: 16px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .stat-value { font-size: 1.8rem; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; color: var(--gray-500); letter-spacing: 0.5px; }

        /* Add Contact Form */
        .form-card {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }
        .form-card h3 { font-size: 1rem; font-weight: 600; margin-bottom: 16px; color: var(--primary); }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 12px; }
        .form-control {
            background: var(--gray-50);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 12px 16px;
            font-size: 0.85rem;
            color: var(--gray-800);
            width: 100%;
            min-height: var(--touch-target);
        }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30,74,118,0.1); }
        .btn { border-radius: 40px; padding: 12px 24px; font-weight: 600; font-size: 0.8rem; border: none; cursor: pointer; transition: opacity 0.2s; min-height: var(--touch-target); display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:active { opacity: 0.8; }
        .btn-success { background: var(--success); color: white; }
        .btn-outline { background: var(--gray-100); border: 1px solid var(--border); color: var(--gray-700); }

        /* Search */
        .search-bar { margin-bottom: 20px; }
        .search-input { width: 100%; padding: 14px 20px; border-radius: 40px; border: 1px solid var(--border); background: var(--card-bg); color: var(--gray-800); font-size: 0.9rem; }

        /* Contact Grid */
        .contacts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .contact-card {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            border: 1px solid var(--border);
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .contact-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .contact-name { font-size: 1.1rem; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
        .contact-job { font-size: 0.75rem; color: var(--gray-500); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
        .contact-detail { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 0.8rem; }
        .contact-detail i { width: 24px; color: var(--primary); font-size: 1rem; }
        .contact-detail a { color: var(--gray-700); text-decoration: none; word-break: break-all; }
        .contact-detail a:hover { color: var(--primary); text-decoration: underline; }
        .contact-actions { display: flex; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
        .action-btn { background: none; border: none; padding: 8px 12px; border-radius: 40px; cursor: pointer; font-size: 0.7rem; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; transition: background 0.2s; }
        .action-btn.call { background: var(--success); color: white; }
        .action-btn.email { background: var(--primary); color: white; }
        .action-btn.delete { background: var(--danger); color: white; }
        .action-btn:active { opacity: 0.8; }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--gray-500); }

        /* Toast */
        .toast-notify {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: var(--card-bg);
            border-left: 4px solid var(--success);
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            z-index: 1100;
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            max-width: 400px;
            margin: 0 auto;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }
        .modal-content {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            padding: 24px;
            max-width: 400px;
            width: 100%;
            border: 1px solid var(--border);
        }
        .modal-content h3 { margin-bottom: 16px; }
        .modal-buttons { display: flex; gap: 12px; margin-top: 20px; justify-content: flex-end; }

        @media (max-width: 640px) {
            body { padding: 12px; }
            .contacts-grid { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
        }

        [dir="rtl"] .contact-detail { flex-direction: row-reverse; }
        [dir="rtl"] .contact-detail i { margin-left: 12px; margin-right: 0; }
    </style>
</head>
<body>
<div class="container">
    <!-- Header -->
    <div class="header-card">
        <div class="logo-area"><h1><i class="bi bi-telephone-forward me-2"></i><span id="titleMain">Corporate Phone Book</span></h1></div>
        <div class="controls">
            <div class="lang-switch"><button class="lang-btn active" id="langEn">EN</button><button class="lang-btn" id="langAr">AR</button></div>
            <button class="theme-toggle" id="themeToggle"><i class="bi bi-moon"></i> <span id="themeText">Dark</span></button>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
        <div class="stat-card"><div class="stat-value" id="totalContacts">0</div><div class="stat-label" data-key="totalContacts">TOTAL CONTACTS</div></div>
        <div class="stat-card"><div class="stat-value" id="departments">0</div><div class="stat-label" data-key="departments">DEPARTMENTS</div></div>
        <div class="stat-card"><div class="stat-value" id="lastUpdated">—</div><div class="stat-label" data-key="lastUpdated">LAST UPDATED</div></div>
    </div>

    <!-- Add Contact Form -->
    <div class="form-card">
        <h3><i class="bi bi-person-plus me-2"></i><span data-key="addNewContact">Add New Contact</span></h3>
        <div class="form-row">
            <input type="text" class="form-control" id="newName" placeholder="Full Name" required>
            <input type="text" class="form-control" id="newJob" placeholder="Job Title">
            <input type="text" class="form-control" id="newDept" placeholder="Department">
        </div>
        <div class="form-row">
            <input type="tel" class="form-control" id="newPhone" placeholder="Phone Number" required>
            <input type="email" class="form-control" id="newEmail" placeholder="Email Address">
            <input type="text" class="form-control" id="newLocation" placeholder="Location">
        </div>
        <div style="display: flex; gap: 12px; margin-top: 12px;">
            <button class="btn btn-primary" id="saveContactBtn"><i class="bi bi-save"></i> <span data-key="saveContact">Save Contact</span></button>
            <button class="btn btn-outline" id="clearFormBtn"><i class="bi bi-arrow-clockwise"></i> <span data-key="clear">Clear</span></button>
        </div>
    </div>

    <!-- Search -->
    <div class="search-bar"><input type="text" class="search-input" id="searchInput" placeholder="🔍 Search by name, job, department or location..."></div>

    <!-- Contacts Grid -->
    <div id="contactsGrid" class="contacts-grid"></div>
    <div id="emptyState" class="empty-state" style="display: none;"><i class="bi bi-person-circle" style="font-size: 3rem;"></i><p data-key="noContacts">No contacts found</p></div>
</div>

<div id="toastMsg" class="toast-notify"><i class="bi bi-check-circle-fill"></i> <span id="toastText"></span></div>

<script>
    // ======================== TRANSLATIONS ========================
    const translations = {
        en: { titleMain: "Corporate Phone Book", totalContacts: "TOTAL CONTACTS", departments: "DEPARTMENTS", lastUpdated: "LAST UPDATED", addNewContact: "Add New Contact", saveContact: "Save Contact", clear: "Clear", noContacts: "No contacts found", call: "Call", email: "Email", delete: "Delete", confirmDelete: "Delete this contact?" },
        ar: { titleMain: "دفتر الهاتف المؤسسي", totalContacts: "إجمالي جهات الاتصال", departments: "الأقسام", lastUpdated: "آخر تحديث", addNewContact: "إضافة جهة اتصال", saveContact: "حفظ", clear: "مسح", noContacts: "لا توجد جهات اتصال", call: "اتصال", email: "بريد إلكتروني", delete: "حذف", confirmDelete: "حذف جهة الاتصال هذه؟" }
    };
    let currentLang = "en";

    // Default contacts data
    let contacts = [
        { id: 1, name: "Amal A. Al Enazi", job: "HR Director", dept: "HR", phone: "+966555555551", email: "aalenaizi@kudu.com.sa", location: "HQ" },
        { id: 2, name: "Hani Sowa'ilim", job: "HR Manager", dept: "HR", phone: "+966503404445", email: "hswailim@kudu.com.sa", location: "Riyadh-HO" },
        { id: 3, name: "PPVthran P", job: "Area Manager - Operation", dept: "Operation", phone: "+966561825680", email: "ks-022@kudu.com.sa", location: "Abha" },
        { id: 4, name: "Mahmoud Hafez", job: "Area Supervisor", dept: "Operation", phone: "+966581827031", email: "mhafez@kudu.com.sa", location: "Western Region" },
        { id: 5, name: "Murat Ungun", job: "Chief Executive Officer", dept: "Executive", phone: "+966569444420", email: "mungun@kudu.com.sa", location: "Riyadh" },
        { id: 6, name: "Mohamed Eldahshan", job: "Eastern Region Manager", dept: "Operation", phone: "+966543289624", email: "meldahshan@kudu.com.sa", location: "Eastern Region" },
        { id: 7, name: "Mueen Ahange", job: "Cares Coach", dept: "OPS Excellence", phone: "+966573207876", email: "mahange@kudu.com.sa", location: "Jeddah" },
        { id: 8, name: "Owais Mattoo", job: "Cares Coach", dept: "OPS Excellence", phone: "+966568870172", email: "omattoo@kudu.com.sa", location: "Riyadh" }
    ];

    let nextId = 9;

    // Load from localStorage
    function loadData() {
        const saved = localStorage.getItem('corporate_phonebook');
        if (saved) {
            const parsed = JSON.parse(saved);
            contacts = parsed.contacts;
            nextId = parsed.nextId;
        }
        renderContacts();
        updateStats();
    }

    function saveData() {
        localStorage.setItem('corporate_phonebook', JSON.stringify({ contacts, nextId }));
        updateStats();
    }

    function updateStats() {
        document.getElementById('totalContacts').innerText = contacts.length;
        const uniqueDepts = new Set(contacts.map(c => c.dept).filter(d => d));
        document.getElementById('departments').innerText = uniqueDepts.size;
        document.getElementById('lastUpdated').innerText = new Date().toLocaleDateString();
    }

    function renderContacts() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const filtered = contacts.filter(c => 
            c.name.toLowerCase().includes(searchTerm) ||
            (c.job && c.job.toLowerCase().includes(searchTerm)) ||
            (c.dept && c.dept.toLowerCase().includes(searchTerm)) ||
            (c.location && c.location.toLowerCase().includes(searchTerm))
        );
        
        const grid = document.getElementById('contactsGrid');
        const emptyState = document.getElementById('emptyState');
        
        if (filtered.length === 0) {
            grid.innerHTML = '';
            emptyState.style.display = 'block';
            return;
        }
        emptyState.style.display = 'none';
        
        grid.innerHTML = filtered.map(c => `
            <div class="contact-card" data-id="${c.id}">
                <div class="contact-name">${escapeHtml(c.name)}</div>
                <div class="contact-job">${escapeHtml(c.job || '—')} • ${escapeHtml(c.dept || '—')}</div>
                <div class="contact-detail"><i class="bi bi-telephone"></i> <a href="tel:${c.phone}">${c.phone}</a></div>
                ${c.email ? `<div class="contact-detail"><i class="bi bi-envelope"></i> <a href="mailto:${c.email}">${c.email}</a></div>` : ''}
                ${c.location ? `<div class="contact-detail"><i class="bi bi-geo-alt"></i> <span>${c.location}</span></div>` : ''}
                <div class="contact-actions">
                    <button class="action-btn call" onclick="makeCall('${c.phone}')"><i class="bi bi-telephone-fill"></i> <span data-key="call">Call</span></button>
                    ${c.email ? `<button class="action-btn email" onclick="sendEmail('${c.email}')"><i class="bi bi-envelope-fill"></i> <span data-key="email">Email</span></button>` : ''}
                    <button class="action-btn delete" onclick="deleteContact(${c.id})"><i class="bi bi-trash-fill"></i> <span data-key="delete">Delete</span></button>
                </div>
            </div>
        `).join('');
        
        // Re-apply translations for dynamic buttons
        applyButtonTexts();
    }

    function applyButtonTexts() {
        const t = translations[currentLang];
        document.querySelectorAll('.action-btn.call span').forEach(el => el.innerText = t.call);
        document.querySelectorAll('.action-btn.email span').forEach(el => el.innerText = t.email);
        document.querySelectorAll('.action-btn.delete span').forEach(el => el.innerText = t.delete);
    }

    window.makeCall = function(phone) {
        window.location.href = `tel:${phone}`;
        showToast(`Calling ${phone}`, 'success');
    };

    window.sendEmail = function(email) {
        window.location.href = `mailto:${email}`;
        showToast(`Email to ${email}`, 'success');
    };

    window.deleteContact = function(id) {
        if (confirm(translations[currentLang].confirmDelete)) {
            contacts = contacts.filter(c => c.id !== id);
            saveData();
            renderContacts();
            showToast(translations[currentLang].delete + ' ' + (currentLang === 'en' ? 'successful' : 'ناجح'), 'info');
        }
    };

    function addNewContact() {
        const name = document.getElementById('newName').value.trim();
        const phone = document.getElementById('newPhone').value.trim();
        if (!name || !phone) {
            showToast(currentLang === 'en' ? 'Name and phone are required' : 'الاسم والهاتف مطلوبان', 'error');
            return;
        }
        
        const newContact = {
            id: nextId++,
            name: name,
            job: document.getElementById('newJob').value.trim(),
            dept: document.getElementById('newDept').value.trim(),
            phone: phone,
            email: document.getElementById('newEmail').value.trim(),
            location: document.getElementById('newLocation').value.trim()
        };
        
        contacts.push(newContact);
        saveData();
        renderContacts();
        clearForm();
        showToast(currentLang === 'en' ? 'Contact added successfully' : 'تم إضافة جهة الاتصال', 'success');
    }

    function clearForm() {
        document.getElementById('newName').value = '';
        document.getElementById('newJob').value = '';
        document.getElementById('newDept').value = '';
        document.getElementById('newPhone').value = '';
        document.getElementById('newEmail').value = '';
        document.getElementById('newLocation').value = '';
    }

    function showToast(msg, type = 'success') {
        const toast = document.getElementById('toastMsg');
        document.getElementById('toastText').innerText = msg;
        toast.style.display = 'flex';
        toast.style.borderLeftColor = type === 'error' ? '#ef4444' : '#10b981';
        setTimeout(() => toast.style.display = 'none', 2000);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Language & Theme
    function updateLanguage() {
        const t = translations[currentLang];
        document.getElementById('titleMain').innerText = t.titleMain;
        document.querySelectorAll('[data-key]').forEach(el => {
            const key = el.getAttribute('data-key');
            if (t[key]) el.innerText = t[key];
        });
        document.documentElement.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
        applyButtonTexts();
        renderContacts();
    }

    document.getElementById('langEn').addEventListener('click', () => {
        currentLang = 'en';
        document.getElementById('langEn').classList.add('active');
        document.getElementById('langAr').classList.remove('active');
        updateLanguage();
    });
    document.getElementById('langAr').addEventListener('click', () => {
        currentLang = 'ar';
        document.getElementById('langAr').classList.add('active');
        document.getElementById('langEn').classList.remove('active');
        updateLanguage();
    });

    let darkMode = localStorage.getItem('phonebookDark') === 'true';
    function applyDarkMode() {
        if (darkMode) document.body.classList.add('dark');
        else document.body.classList.remove('dark');
        document.getElementById('themeText').innerText = darkMode ? 'Light' : 'Dark';
        document.getElementById('themeToggle').innerHTML = darkMode ? '<i class="bi bi-sun"></i> Light' : '<i class="bi bi-moon"></i> Dark';
    }
    document.getElementById('themeToggle').addEventListener('click', () => {
        darkMode = !darkMode;
        localStorage.setItem('phonebookDark', darkMode);
        applyDarkMode();
    });

    // Event Listeners
    document.getElementById('saveContactBtn').addEventListener('click', addNewContact);
    document.getElementById('clearFormBtn').addEventListener('click', clearForm);
    document.getElementById('searchInput').addEventListener('input', () => renderContacts());

    // Initialize
    applyDarkMode();
    updateLanguage();
    loadData();
</script>
</body>
</html>
