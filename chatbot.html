<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>SADWAP · DevOps Team</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: #1a1a2e;
            border-radius: 24px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: #c8d0dc;
            padding: 8px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
            margin-bottom: 30px;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.12);
            color: white;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 4px;
        }
        .team-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .team-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: 0.2s;
        }
        .team-card:hover {
            background: rgba(255,255,255,0.06);
            border-color: rgba(251,191,36,0.2);
        }
        .team-card .avatar {
            font-size: 36px;
            margin-bottom: 8px;
        }
        .team-card .name {
            font-weight: 700;
            font-size: 15px;
            color: #f1f5f9;
        }
        .team-card .role {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 2px;
        }
        .team-card .badge {
            display: inline-block;
            background: rgba(52, 211, 153, 0.15);
            color: #34d399;
            font-size: 10px;
            padding: 2px 12px;
            border-radius: 30px;
            margin-top: 8px;
            font-weight: 600;
        }
        .status-bar {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .status-bar .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #94a3b8;
        }
        .status-bar .status .dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
        .status-bar .version {
            font-size: 12px;
            color: #475569;
        }
        @media (max-width: 500px) {
            .container { padding: 24px; }
            .team-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://ghostkmr.github.io/2026/chatbotformobile.html" class="back-btn">← Start A NEW CHAT</a>
        
        <div class="header">
            <div class="icon">⚙️</div>
            <h1>DevOps Team</h1>
            <p>SADWAP AI Platform · Development & Operations</p>
        </div>

        <div class="team-grid">
            <div class="team-card">
                <div class="avatar">👨‍💻</div>
                <div class="name">Mueen ul islam </div>
                <div class="role">FRONTEND ENGINEER</div>
                <div class="badge">● Active</div>
            </div>
            <div class="team-card">
                <div class="avatar">👨‍💻</div>
                <div class="name">ABC</div>
                <div class="role">Information/ DATA provider</div>
                <div class="badge">● Active</div>
           
        <div class="status-bar">
            <div class="status">
                <span class="dot"></span>
                All systems operational
            </div>
            <div class="version">v2.4.1 · <span id="timestamp">Loading...</span></div>
        </div>
    </div>

    <script>
        document.getElementById('timestamp').textContent = new Date().toLocaleString();
    </script>
</body>
</html>
