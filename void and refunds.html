<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>SADWAP · Refund & Void (SAR)</title>
    <!-- Bootstrap 5 + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        /* DARK MODE ONLY - removed light theme */
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-soft: #1e293b;
            --success: #10b981;
            --success-soft: #064e3b;
            --warning: #f59e0b;
            --warning-soft: #78350f;
            --danger: #ef4444;
            --danger-soft: #7f1d1d;
            --gray-50: #0f172a;
            --gray-100: #1e293b;
            --gray-200: #334155;
            --gray-300: #475569;
            --gray-400: #64748b;
            --gray-500: #94a3b8;
            --gray-600: #cbd5e1;
            --gray-700: #e2e8f0;
            --gray-800: #f1f5f9;
            --gray-900: #f8fafc;
            --card-bg: #1e293b;
            --border: #334155;
            --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.3);
            --shadow-md: 0 8px 16px -4px rgba(0,0,0,0.4);
            --radius-card: 24px;
            --radius-element: 14px;
            --transition: 0.25s ease;
            --accent-gold: #fbbf24;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: var(--text-primary);
            transition: background 0.2s, color 0.2s;
            padding: 16px 20px;
            min-height: 100vh;
        }

        .dashboard-container {
            max-width: 820px;
            margin: 0 auto;
        }

        /* Highlight Banner - Yellow */
        .highlight-banner {
            background: var(--accent-gold);
            color: #0b0e1a;
            padding: 14px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(251, 191, 36, 0.25);
            border: 1px solid #eab308;
        }
        .highlight-banner i { font-size: 1.2rem; }
        .highlight-banner .tag { 
            background: rgba(11, 14, 26, 0.12); 
            padding: 2px 14px; 
            border-radius: 40px; 
            font-weight: 700; 
            font-size: 0.75rem;
        }
        .highlight-banner .banner-text {
            flex: 1;
            text-align: center;
            min-width: 160px;
        }
        .highlight-banner .device-icons {
            display: flex;
            gap: 8px;
            font-size: 1rem;
        }
        @media (max-width: 600px) {
            .highlight-banner { font-size: 0.7rem; padding: 10px 16px; gap: 8px; }
            .highlight-banner .tag { font-size: 0.6rem; padding: 2px 10px; }
            .highlight-banner .device-icons { font-size: 0.85rem; }
        }

        /* header card */
        .header-card {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            padding: 16px 24px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo-area h1 {
            font-size: 1.35rem;
            font-weight: 700;
            margin: 0;
            color: var(--primary);
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .lang-switch {
            display: flex;
            gap: 4px;
            background: var(--gray-100);
            padding: 4px;
            border-radius: 60px;
            border: 1px solid var(--border);
        }
        .lang-btn {
            background: transparent;
            border: none;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            color: var(--gray-500);
            transition: all 0.2s;
        }
        .lang-btn.active {
            background: var(--primary);
            color: white;
        }
        /* Removed theme-toggle - dark mode only */

        /* stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        }
        .stat-card {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            padding: 14px 10px;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: var(--shadow-sm);
            transition: 0.2s;
        }
        .stat-card:hover { border-color: var(--primary); }
        .stat-title {
            font-size: 0.6rem;
            text-transform: uppercase;
            font-weight: 600;
            color: var(--gray-500);
            letter-spacing: 0.5px;
        }
        .stat-value {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 4px 0;
            color: var(--text-primary);
        }
        .stat-icon { font-size: 0.9rem; }

        /* main grid - 2 columns on desktop */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
        }

        /* cards */
        .form-card, .records-card {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            padding: 22px 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            height: fit-content;
        }
        .form-card h5, .records-header h5 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--primary);
        }
        .form-label {
            font-size: 0.72rem;
            font-weight: 500;
            margin-bottom: 4px;
            color: var(--gray-400);
        }
        .form-control, .form-select {
            background: var(--gray-100);
            border: 1px solid var(--border);
            border-radius: 60px;
            padding: 10px 16px;
            font-size: 0.85rem;
            color: var(--text-primary);
            transition: 0.2s;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59,130,246,0.15);
            background: var(--gray-100);
            color: var(--text-primary);
        }
        .form-control::placeholder { color: var(--gray-500); }
        textarea.form-control { border-radius: 20px; resize: vertical; min-height: 70px; }

        /* camera */
        .camera-container {
            background: #0a0f1a;
            border-radius: 20px;
            overflow: hidden;
            margin: 10px 0 12px;
            position: relative;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
        }
        #cameraPreview {
            width: 100%;
            height: 180px;
            background: #0a0f1a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray-500);
        }
        #cameraPreview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #capturedImage {
            width: 100%;
            max-height: 180px;
            object-fit: contain;
            display: none;
            background: #0a0f1a;
        }
        .camera-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .camera-controls .btn {
            flex: 1 0 auto;
            font-size: 0.7rem;
            padding: 8px 14px;
            border-radius: 60px;
            font-weight: 500;
        }
        .btn-primary-custom {
            background: var(--primary);
            color: white;
            border: none;
        }
        .btn-primary-custom:hover { background: var(--primary-dark); color: white; }
        .btn-outline-custom {
            background: var(--gray-100);
            border: 1px solid var(--border);
            color: var(--gray-300);
        }
        .btn-outline-custom:hover { background: var(--gray-200); color: var(--text-primary); }
        .btn-success-custom {
            background: var(--success);
            color: white;
            border: none;
        }
        .btn-success-custom:hover { opacity: 0.85; color: white; }
        .btn-warning-custom {
            background: var(--warning);
            color: #0b0e1a;
            border: none;
        }
        .btn-warning-custom:hover { opacity: 0.85; }

        /* records */
        .records-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .records-header h5 {
            margin: 0;
        }
        .btn-pdf {
            background: var(--success);
            color: white;
            border: none;
            border-radius: 60px;
            padding: 6px 20px;
            font-size: 0.72rem;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-pdf:hover { opacity: 0.85; color: white; }

        .record-card {
            background: var(--gray-100);
            border-radius: 20px;
            padding: 14px 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            border-left-width: 5px;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }
        .record-card:hover { border-color: var(--primary); }
        .record-card.refund { border-left-color: var(--warning); }
        .record-card.void { border-left-color: var(--danger); }
        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .record-badge {
            font-size: 0.6rem;
            padding: 3px 14px;
            border-radius: 60px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .badge-refund { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .badge-void { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .record-detail {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .record-image {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            object-fit: cover;
            background: var(--gray-200);
            border: 1px solid var(--border);
        }
        .record-info {
            flex: 1;
            font-size: 0.75rem;
            line-height: 1.4;
            color: var(--gray-400);
        }
        .record-info strong { color: var(--text-primary); }
        .record-info p { margin-bottom: 2px; }
        .delete-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            color: var(--danger);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 30px;
            transition: 0.2s;
        }
        .delete-btn:hover { background: rgba(239, 68, 68, 0.15); }

        .empty-state {
            text-align: center;
            padding: 30px 0;
            color: var(--gray-500);
        }
        .empty-state i { font-size: 2.5rem; opacity: 0.3; }

        /* records scroll */
        .records-scroll {
            max-height: 480px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .records-scroll::-webkit-scrollbar { width: 4px; }
        .records-scroll::-webkit-scrollbar-track { background: var(--gray-100); border-radius: 4px; }
        .records-scroll::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

        /* toast */
        .toast-notify {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card-bg);
            border-left: 5px solid var(--success);
            padding: 12px 24px;
            border-radius: 18px;
            box-shadow: var(--shadow-md);
            z-index: 1100;
            display: none;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            font-weight: 500;
            max-width: 480px;
            width: 90%;
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        /* RTL */
        [dir="rtl"] .record-card { border-left-width: 1px; border-right-width: 5px; border-right-color: inherit; }
        [dir="rtl"] .record-card.refund { border-left-color: var(--border); border-right-color: var(--warning); }
        [dir="rtl"] .record-card.void { border-left-color: var(--border); border-right-color: var(--danger); }
        [dir="rtl"] .delete-btn { right: auto; left: 12px; }

        /* responsive */
        @media (max-width: 600px) {
            body { padding: 12px; }
            .header-card { padding: 14px 16px; flex-direction: column; align-items: stretch; }
            .controls { justify-content: flex-start; }
            .logo-area h1 { font-size: 1.1rem; }
            .form-card, .records-card { padding: 16px; }
            .stats-grid { gap: 8px; }
            .stat-value { font-size: 1.1rem; }
            .camera-container { min-height: 150px; }
            #cameraPreview { height: 150px; }
            #capturedImage { max-height: 150px; }
        }
        @media (max-width: 400px) {
            .camera-controls .btn { font-size: 0.6rem; padding: 6px 8px; }
            .highlight-banner { font-size: 0.6rem; padding: 8px 12px; }
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    
    <!-- Highlight Banner - Yellow -->
    <div class="highlight-banner">
        <i class="bi bi-camera"></i>
        <span class="tag">📸</span>
        <span class="banner-text" id="bannerText">Use the rear camera for clear bill images — optimised for tablets and mobile devices</span>
        <span class="device-icons"><i class="bi bi-tablet"></i> <i class="bi bi-phone"></i></span>
    </div>

    <!-- Header -->
    <div class="header-card">
        <div class="logo-area"><h1><i class="bi bi-receipt-cutoff"></i> <span id="titleMain">Refund & Void</span></h1></div>
        <div class="controls">
            <div class="lang-switch">
                <button class="lang-btn active" id="langEn">EN</button>
                <button class="lang-btn" id="langAr">AR</button>
            </div>
            <!-- Dark mode only - no toggle -->
        </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
        <div class="stat-card"><div class="stat-title" data-key="total">TOTAL</div><div class="stat-value" id="totalBills">0</div><div class="stat-icon text-primary"><i class="bi bi-receipt"></i></div></div>
        <div class="stat-card"><div class="stat-title" data-key="refund">REFUND</div><div class="stat-value" id="refundBills">0</div><div class="stat-icon text-warning"><i class="bi bi-arrow-counterclockwise"></i></div></div>
        <div class="stat-card"><div class="stat-title" data-key="void">VOID</div><div class="stat-value" id="voidBills">0</div><div class="stat-icon text-danger"><i class="bi bi-x-circle"></i></div></div>
        <div class="stat-card"><div class="stat-title" data-key="amount">AMOUNT</div><div class="stat-value" id="totalAmount">SAR 0.00</div><div class="stat-icon text-success"><i class="bi bi-currency-exchange"></i></div></div>
    </div>

    <!-- Main Grid: 2 columns on desktop -->
    <div class="main-grid">

        <!-- Form Card -->
        <div class="form-card">
            <h5><i class="bi bi-plus-circle me-2"></i><span data-key="newBill">New Bill</span></h5>
            <form id="billForm">
                <div class="mb-2">
                    <label class="form-label" data-key="typeLabel">Type *</label>
                    <select class="form-select" id="billType" required>
                        <option value="">Select</option><option value="refund">Refund</option><option value="void">Void</option>
                    </select>
                </div>
                <div class="row g-2 mb-2">
                    <div class="col-6"><label class="form-label" data-key="billNumberLabel">Bill # *</label><input type="text" class="form-control" id="billNumber" required></div>
                    <div class="col-6"><label class="form-label" data-key="amountLabel">Amount (SAR) *</label><input type="number" class="form-control" id="billAmount" min="0.01" step="0.01" required></div>
                </div>
                <div class="mb-2" id="customerMobileField" style="display: none;">
                    <label class="form-label" data-key="mobileLabel">Mobile *</label>
                    <input type="tel" class="form-control" id="customerMobile">
                </div>
                <div class="mb-3">
                    <label class="form-label" data-key="reasonLabel">Reason *</label>
                    <textarea class="form-control" id="reason" rows="2" required></textarea>
                </div>

                <label class="form-label" data-key="imageLabel">Bill Image *</label>
                <div class="camera-container">
                    <div id="cameraPreview"><div class="text-center"><i class="bi bi-camera fs-2"></i><p class="mt-1 small">Start camera</p></div></div>
                    <img id="capturedImage" alt="bill">
                </div>
                <div class="camera-controls">
                    <button type="button" class="btn btn-primary-custom" id="startCamera"><i class="bi bi-camera-video"></i> <span data-key="start">Start</span></button>
                    <button type="button" class="btn btn-outline-custom" id="switchCamera" disabled><i class="bi bi-arrow-left-right"></i> <span data-key="switch">Switch</span></button>
                    <button type="button" class="btn btn-success-custom" id="captureImage" disabled><i class="bi bi-camera"></i> <span data-key="capture">Capture</span></button>
                    <button type="button" class="btn btn-warning-custom" id="retakeImage" style="display: none;"><i class="bi bi-arrow-clockwise"></i> <span data-key="retake">Retake</span></button>
                    <button type="button" class="btn btn-outline-custom" id="uploadImage"><i class="bi bi-upload"></i> <span data-key="upload">Upload</span></button>
                    <input type="file" id="imageUpload" accept="image/*" style="display: none;">
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary-custom flex-grow-1"><i class="bi bi-check2-circle me-2"></i><span data-key="save">Save</span></button>
                    <button type="button" class="btn btn-outline-custom" id="clearForm"><i class="bi bi-arrow-clockwise"></i></button>
                </div>
            </form>
        </div>

        <!-- Records Card -->
        <div class="records-card">
            <div class="records-header">
                <h5><i class="bi bi-clock-history me-2"></i><span data-key="history">History</span></h5>
                <button class="btn-pdf" id="exportPDF"><i class="bi bi-file-pdf me-1"></i><span data-key="export">PDF</span></button>
            </div>
            <div class="records-scroll">
                <div id="savedRecordsContainer"></div>
                <div id="noRecordsMessage" class="empty-state"><i class="bi bi-receipt"></i><p data-key="noRecords">No bills yet</p></div>
            </div>
        </div>

    </div>
</div>

<div id="toastMsg" class="toast-notify"><i class="bi bi-check-circle-fill"></i> <span id="toastText"></span></div>

<script>
    // ========== TRANSLATIONS ==========
    const translations = {
        en: {
            titleMain: "Refund & Void", total: "TOTAL", refund: "REFUND", void: "VOID", amount: "AMOUNT",
            newBill: "New Bill", typeLabel: "Type *", billNumberLabel: "Bill # *", amountLabel: "Amount (SAR) *",
            mobileLabel: "Mobile *", reasonLabel: "Reason *", imageLabel: "Bill Image *",
            start: "Start", switch: "Switch", capture: "Capture", retake: "Retake", upload: "Upload",
            save: "Save", history: "History", export: "PDF", noRecords: "No bills yet",
            banner: "Use the rear camera for clear bill images — optimised for tablets and mobile devices"
        },
        ar: {
            titleMain: "المبالغ المستردة والإلغاء", total: "الإجمالي", refund: "مسترد", void: "ملغي", amount: "المبلغ",
            newBill: "فاتورة جديدة", typeLabel: "النوع *", billNumberLabel: "رقم الفاتورة *", amountLabel: "المبلغ (ريال) *",
            mobileLabel: "الجوال *", reasonLabel: "السبب *", imageLabel: "صورة الفاتورة *",
            start: "تشغيل", switch: "تبديل", capture: "تصوير", retake: "إعادة", upload: "رفع",
            save: "حفظ", history: "السجل", export: "PDF", noRecords: "لا توجد فواتير",
            banner: "استخدم الكاميرا الخلفية للحصول على صور واضحة للفواتير — مُحسَّن للأجهزة اللوحية والهواتف"
        }
    };

    let currentLang = "en";
    let bills = JSON.parse(localStorage.getItem('bills_mobile')) || [];
    let stream = null, capturedImageData = null, currentFacingMode = 'environment';

    // DOM refs
    const container = document.getElementById('savedRecordsContainer');
    const emptyMsg = document.getElementById('noRecordsMessage');
    const totalSpan = document.getElementById('totalBills');
    const refundSpan = document.getElementById('refundBills');
    const voidSpan = document.getElementById('voidBills');
    const amountSpan = document.getElementById('totalAmount');
    const form = document.getElementById('billForm');
    const billType = document.getElementById('billType');
    const billNumber = document.getElementById('billNumber');
    const billAmount = document.getElementById('billAmount');
    const customerMobile = document.getElementById('customerMobile');
    const reason = document.getElementById('reason');
    const mobileField = document.getElementById('customerMobileField');
    const clearBtn = document.getElementById('clearForm');
    const toast = document.getElementById('toastMsg');
    const toastText = document.getElementById('toastText');
    const bannerText = document.getElementById('bannerText');

    function showToast(msg, type = 'success') {
        toastText.innerText = msg;
        toast.style.display = 'flex';
        toast.style.borderLeftColor = type === 'error' ? '#ef4444' : '#10b981';
        clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => toast.style.display = 'none', 2600);
    }

    function updateStats() {
        totalSpan.innerText = bills.length;
        refundSpan.innerText = bills.filter(b => b.billType === 'refund').length;
        voidSpan.innerText = bills.filter(b => b.billType === 'void').length;
        const totalSAR = bills.reduce((acc, b) => acc + (b.billAmount || 0), 0);
        amountSpan.innerText = 'SAR ' + totalSAR.toFixed(2);
    }

    function renderRecords() {
        if (bills.length === 0) { container.innerHTML = ''; emptyMsg.style.display = 'block'; return; }
        emptyMsg.style.display = 'none';
        container.innerHTML = bills.slice().reverse().map(b => `
            <div class="record-card ${b.billType}" data-id="${b.id}">
                <div class="record-header">
                    <span class="record-badge ${b.billType === 'refund' ? 'badge-refund' : 'badge-void'}">${b.billType.toUpperCase()}</span>
                    <small style="color:var(--gray-500);">${b.date}</small>
                </div>
                <div class="record-detail">
                    <img src="${b.imageData}" class="record-image" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2252%22 height=%2252%22 viewBox=%220 0 52 52%22%3E%3Crect width=%2252%22 height=%2252%22 fill=%22%23333%22/%3E%3Ctext x=%2210%22 y=%2232%22 fill=%22%23fff%22 font-size=%2214%22%3Ebill%3C/text%3E%3C/svg%3E'">
                    <div class="record-info">
                        <p><strong>#${b.billNumber}</strong> SAR ${b.billAmount.toFixed(2)}</p>
                        ${b.customerMobile && b.customerMobile !== 'N/A' ? `<p><i class="bi bi-phone"></i> ${b.customerMobile}</p>` : ''}
                        <p class="text-truncate" style="max-width:180px;" title="${b.reason}">${b.reason}</p>
                    </div>
                </div>
                <button class="delete-btn" onclick="deleteBill(${b.id})"><i class="bi bi-trash3"></i></button>
            </div>`).join('');
    }

    window.deleteBill = function(id) {
        if (confirm(currentLang === 'en' ? 'Delete this record?' : 'حذف هذا السجل؟')) {
            bills = bills.filter(b => b.id !== id);
            localStorage.setItem('bills_mobile', JSON.stringify(bills));
            renderRecords(); updateStats();
            showToast(currentLang === 'en' ? 'Deleted' : 'تم الحذف', 'error');
        }
    };

    // ========== CAMERA ==========
    async function startCamera(facingMode = 'environment') {
        try {
            if (stream) stopCamera();
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode }, audio: false });
            const preview = document.getElementById('cameraPreview');
            preview.innerHTML = '';
            const video = document.createElement('video');
            video.srcObject = stream; video.autoplay = true; video.playsInline = true;
            preview.appendChild(video);
            document.getElementById('captureImage').disabled = false;
            document.getElementById('switchCamera').disabled = false;
            document.getElementById('startCamera').disabled = true;
            currentFacingMode = facingMode;
        } catch (err) {
            showToast(currentLang === 'en' ? 'Camera access denied' : 'تم رفض الوصول للكاميرا', 'error');
        }
    }

    function stopCamera() {
        if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    }

    function captureImage() {
        if (stream) {
            const video = document.querySelector('#cameraPreview video');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            capturedImageData = canvas.toDataURL('image/png');
            document.getElementById('capturedImage').src = capturedImageData;
            document.getElementById('capturedImage').style.display = 'block';
            document.getElementById('cameraPreview').style.display = 'none';
            stopCamera();
            document.getElementById('retakeImage').style.display = 'inline-block';
            document.getElementById('captureImage').disabled = true;
            document.getElementById('switchCamera').disabled = true;
            document.getElementById('startCamera').disabled = false;
        }
    }

    function retakeImage() {
        capturedImageData = null;
        document.getElementById('capturedImage').style.display = 'none';
        document.getElementById('cameraPreview').style.display = 'flex';
        document.getElementById('retakeImage').style.display = 'none';
        startCamera(currentFacingMode);
    }

    document.getElementById('startCamera').addEventListener('click', () => startCamera('environment'));
    document.getElementById('switchCamera').addEventListener('click', () => {
        const newMode = currentFacingMode === 'environment' ? 'user' : 'environment';
        startCamera(newMode);
    });
    document.getElementById('captureImage').addEventListener('click', captureImage);
    document.getElementById('retakeImage').addEventListener('click', retakeImage);
    document.getElementById('uploadImage').addEventListener('click', () => document.getElementById('imageUpload').click());
    document.getElementById('imageUpload').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            stopCamera();
            document.getElementById('cameraPreview').style.display = 'none';
            const reader = new FileReader();
            reader.onload = (ev) => {
                capturedImageData = ev.target.result;
                document.getElementById('capturedImage').src = capturedImageData;
                document.getElementById('capturedImage').style.display = 'block';
                document.getElementById('retakeImage').style.display = 'inline-block';
            };
            reader.readAsDataURL(file);
        }
    });

    // toggle mobile field
    billType.addEventListener('change', () => {
        if (billType.value === 'refund') { mobileField.style.display = 'block'; customerMobile.required = true; }
        else { mobileField.style.display = 'none'; customerMobile.required = false; }
    });

    // ========== FORM SUBMIT ==========
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (!capturedImageData) {
            showToast(currentLang === 'en' ? 'Please capture or upload a bill image' : 'الرجاء تصوير أو رفع صورة الفاتورة', 'error');
            return;
        }
        const newBill = {
            id: Date.now(),
            date: new Date().toLocaleString(),
            billType: billType.value,
            billNumber: billNumber.value,
            billAmount: parseFloat(billAmount.value),
            customerMobile: billType.value === 'refund' ? customerMobile.value : 'N/A',
            reason: reason.value,
            imageData: capturedImageData
        };
        bills.push(newBill);
        localStorage.setItem('bills_mobile', JSON.stringify(bills));
        renderRecords(); updateStats();
        form.reset();
        mobileField.style.display = 'none';
        capturedImageData = null;
        document.getElementById('capturedImage').style.display = 'none';
        document.getElementById('cameraPreview').style.display = 'flex';
        document.getElementById('retakeImage').style.display = 'none';
        stopCamera();
        showToast(currentLang === 'en' ? 'Bill saved' : 'تم حفظ الفاتورة');
    });

    clearBtn.addEventListener('click', () => {
        form.reset();
        mobileField.style.display = 'none';
        capturedImageData = null;
        document.getElementById('capturedImage').style.display = 'none';
        document.getElementById('cameraPreview').style.display = 'flex';
        document.getElementById('retakeImage').style.display = 'none';
        stopCamera();
    });

    // ========== EXPORT PDF ==========
    document.getElementById('exportPDF').addEventListener('click', async () => {
        if (bills.length === 0) {
            showToast(currentLang === 'en' ? 'No records to export' : 'لا توجد سجلات للتصدير', 'error');
            return;
        }
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(16);
        doc.setTextColor(255, 255, 255);
        doc.setFillColor(30, 41, 59);
        doc.rect(0, 0, 210, 297, 'F');
        doc.text(currentLang === 'en' ? 'Bills Report (SAR)' : 'تقرير الفواتير (ريال)', 105, 20, { align: 'center' });
        let y = 35;
        for (let i = 0; i < bills.length; i++) {
            const b = bills[i];
            if (y > 260) { doc.addPage(); y = 20; }
            doc.setFontSize(9);
            doc.setTextColor(200, 200, 200);
            doc.text(`${i+1}. ${b.billType.toUpperCase()} #${b.billNumber} - SAR ${b.billAmount.toFixed(2)}`, 14, y);
            y += 5;
            doc.text(`   ${currentLang === 'en' ? 'Date' : 'التاريخ'}: ${b.date}`, 14, y);
            y += 5;
            if (b.imageData) {
                try {
                    const imgProps = doc.getImageProperties(b.imageData);
                    let imgW = 40, imgH = (imgProps.height * imgW) / imgProps.width;
                    if (imgH > 35) { imgH = 35; imgW = (imgProps.width * imgH) / imgProps.height; }
                    doc.addImage(b.imageData, 'PNG', 14, y, imgW, imgH);
                    y += imgH + 5;
                } catch (err) {
                    doc.text('   [Image unavailable]', 14, y);
                    y += 5;
                }
            } else {
                doc.text('   [No image]', 14, y);
                y += 5;
            }
            const reasonLines = doc.splitTextToSize(`${currentLang === 'en' ? 'Reason' : 'السبب'}: ${b.reason}`, 180);
            doc.text(reasonLines, 14, y);
            y += (reasonLines.length * 4) + 8;
        }
        doc.save('bills_sar.pdf');
        showToast(currentLang === 'en' ? 'PDF exported' : 'تم تصدير PDF');
    });

    // ========== LANGUAGE ==========
    function updateLanguage() {
        const t = translations[currentLang];
        document.getElementById('titleMain').innerText = t.titleMain;
        bannerText.innerText = t.banner;
        document.querySelectorAll('[data-key]').forEach(el => {
            const key = el.getAttribute('data-key');
            if (t[key]) el.innerText = t[key];
        });
        document.documentElement.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
        renderRecords(); updateStats();
    }
    document.getElementById('langEn').addEventListener('click', () => {
        currentLang = 'en';
        document.getElementById('langEn').classList.add('active');
        document.getElementById('langAr').classList.remove('active');
        updateLanguage();
    });
    document.getElementById('langAr').addEventListener('click', () => {
        currentLang = 'ar';
        document.getElementById('langAr').classList.add('active');
        document.getElementById('langEn').classList.remove('active');
        updateLanguage();
    });

    // ========== INIT ==========
    updateLanguage();
    renderRecords();
    updateStats();
</script>
</body>
</html>
