
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SADWAP | Municipality License Manager</title>
    <!-- Google Fonts + Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- html2pdf -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <!-- SheetJS for Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <!-- Hijri Date Library -->
    <script src="https://cdn.jsdelivr.net/npm/hijri-date@1.0.4/dist/hijri-date.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Netflix Red & Black Theme */
        :root {
            --netflix-black: #000000;
            --netflix-dark: #0a0a0a;
            --netflix-card: #141414;
            --netflix-card-hover: #1f1f1f;
            --netflix-red: #e50914;
            --netflix-red-dark: #b20710;
            --netflix-gray: #808080;
            --netflix-light-gray: #b3b3b3;
            --netflix-white: #ffffff;
            --netflix-border: #222222;
            --radius-card: 16px;
            --radius-element: 8px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--netflix-black);
            color: var(--netflix-white);
            padding: 20px;
        }

        .container-fluid {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header-card {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-card);
            padding: 20px 24px;
            margin-bottom: 24px;
            border: 1px solid var(--netflix-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .logo-area h1 {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--netflix-red), #ff4d4d);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .lang-switch {
            display: flex;
            gap: 0.3rem;
            background: var(--netflix-card);
            padding: 0.25rem;
            border-radius: 2rem;
            border: 1px solid var(--netflix-border);
        }
        .lang-btn {
            background: transparent;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            color: var(--netflix-light-gray);
            transition: all 0.2s;
        }
        .lang-btn.active {
            background: var(--netflix-red);
            color: white;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .stat-card {
            background: var(--netflix-card);
            border-radius: var(--radius-card);
            padding: 18px 16px;
            border: 1px solid var(--netflix-border);
            transition: all 0.2s;
        }
        .stat-card:hover {
            border-color: var(--netflix-red);
            transform: translateY(-2px);
        }
        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 600;
            color: var(--netflix-gray);
            letter-spacing: 0.5px;
        }
        .stat-value {
            font-size: 1.6rem;
            font-weight: 700;
            margin-top: 6px;
        }
        .stat-value.warning {
            color: #f59e0b;
        }
        .stat-value.critical {
            color: #ef4444;
        }

        /* Add Employee Form */
        .form-card {
            background: var(--netflix-card);
            border-radius: var(--radius-card);
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--netflix-border);
        }
        .form-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: var(--netflix-red);
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--netflix-border);
            padding-bottom: 12px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--netflix-gray);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: var(--netflix-dark);
            border: 1px solid var(--netflix-border);
            border-radius: var(--radius-element);
            color: var(--netflix-white);
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--netflix-red);
        }
        .btn-add {
            background: var(--netflix-red);
            border: none;
            border-radius: var(--radius-element);
            padding: 12px 24px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 28px;
        }
        .btn-add:hover {
            background: var(--netflix-red-dark);
            transform: scale(0.98);
        }

        /* Table Section */
        .table-container {
            background: var(--netflix-card);
            border-radius: var(--radius-card);
            border: 1px solid var(--netflix-border);
            overflow-x: auto;
        }
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--netflix-border);
            flex-wrap: wrap;
            gap: 12px;
        }
        .table-title {
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .export-buttons {
            display: flex;
            gap: 12px;
        }
        .export-btn {
            background: transparent;
            border: 1px solid var(--netflix-border);
            border-radius: 40px;
            padding: 8px 20px;
            color: var(--netflix-white);
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .export-btn:hover {
            border-color: var(--netflix-red);
            color: var(--netflix-red);
        }
        .employee-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }
        .employee-table th {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid var(--netflix-border);
            color: var(--netflix-gray);
            font-weight: 600;
            font-size: 0.7rem;
            background: var(--netflix-black);
        }
        .employee-table td {
            padding: 12px;
            border-bottom: 1px solid var(--netflix-border);
            font-size: 0.8rem;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .status-good {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .status-warning {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .status-expired {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .delete-btn {
            background: transparent;
            border: none;
            color: var(--netflix-red);
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }
        .delete-btn:hover {
            transform: scale(1.1);
        }
        .notification-badge {
            background: var(--netflix-red);
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 0.7rem;
            margin-left: 8px;
        }

        /* Toast */
        .toast-notify {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--netflix-card);
            border-left: 4px solid var(--netflix-red);
            padding: 12px 20px;
            border-radius: 12px;
            z-index: 1100;
            display: none;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        /* RTL */
        [dir="rtl"] .employee-table th,
        [dir="rtl"] .employee-table td {
            text-align: right;
        }
        [dir="rtl"] .toast-notify {
            right: auto;
            left: 24px;
        }

        @media (max-width: 640px) {
            body {
                padding: 12px;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <!-- Header -->
    <div class="header-card">
        <div class="logo-area">
            <h1><i class="fas fa-id-card me-2"></i><span id="titleMain">Municipality License Manager</span></h1>
        </div>
        <div class="controls">
            <div class="lang-switch">
                <button class="lang-btn active" id="langEn">EN</button>
                <button class="lang-btn" id="langAr">AR</button>
            </div>
        </div>
    </div>

    <!-- Stats Cards -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label" data-key="totalEmployees">Total Employees</div>
            <div class="stat-value" id="totalEmployees">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label" data-key="expiringSoon">Expiring in 15 Days</div>
            <div class="stat-value warning" id="expiringSoon">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label" data-key="expired">Expired</div>
            <div class="stat-value critical" id="expiredCount">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label" data-key="validLicenses">Valid Licenses</div>
            <div class="stat-value" id="validCount">0</div>
        </div>
    </div>

    <!-- Add Employee Form -->
    <div class="form-card">
        <div class="form-title"><i class="fas fa-user-plus"></i> <span data-key="addEmployee">Add New Employee</span></div>
        <div class="form-grid">
            <div class="form-group">
                <label data-key="employeeName">Employee Name</label>
                <input type="text" id="empName" placeholder="Enter full name">
            </div>
            <div class="form-group">
                <label data-key="employeeId">Employee ID / Iqama</label>
                <input type="text" id="empId" placeholder="Enter ID / Iqama number">
            </div>
            <div class="form-group">
                <label data-key="hijriDate">Municipality Expiry (Hijri/Islamic Date)</label>
                <input type="text" id="hijriExpiry" placeholder="e.g., 1445-12-25 or 1445/12/25">
            </div>
            <div class="form-group">
                <label data-key="gregorianDate">Gregorian Equivalent</label>
                <input type="text" id="gregorianExpiry" readonly placeholder="Auto-converted">
            </div>
        </div>
        <button class="btn-add" id="addEmployeeBtn"><i class="fas fa-save"></i> <span data-key="saveEmployee">Save Employee</span></button>
    </div>

    <!-- Employee Table -->
    <div class="table-container">
        <div class="table-header">
            <div class="table-title"><i class="fas fa-users"></i> <span data-key="employeeList">Employee Municipality Licenses</span></div>
            <div class="export-buttons">
                <button class="export-btn" id="exportExcelBtn"><i class="fas fa-file-excel"></i> <span data-key="exportExcel">Excel</span></button>
                <button class="export-btn" id="exportPdfBtn"><i class="fas fa-file-pdf"></i> <span data-key="exportPdf">PDF</span></button>
            </div>
        </div>
        <div style="overflow-x: auto;">
            <table class="employee-table" id="employeeTable">
                <thead>
                    <tr>
                        <th data-key="name">Name</th>
                        <th data-key="id">ID/Iqama</th>
                        <th data-key="hijriExpiryCol">Hijri Expiry</th>
                        <th data-key="gregorianExpiryCol">Gregorian Expiry</th>
                        <th data-key="daysLeft">Days Left</th>
                        <th data-key="status">Status</th>
                        <th data-key="actions">Actions</th>
                    </tr>
                </thead>
                <tbody id="employeeBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast-notify"><i class="fas fa-check-circle"></i> <span id="toastText"></span></div>

<script>
    // ========== TRANSLATIONS ==========
    const translations = {
        en: {
            titleMain: "Municipality License Manager",
            totalEmployees: "Total Employees",
            expiringSoon: "Expiring in 15 Days",
            expired: "Expired",
            validLicenses: "Valid Licenses",
            addEmployee: "Add New Employee",
            employeeName: "Employee Name",
            employeeId: "Employee ID / Iqama",
            hijriDate: "Municipality Expiry (Hijri/Islamic Date)",
            gregorianDate: "Gregorian Equivalent",
            saveEmployee: "Save Employee",
            employeeList: "Employee Municipality Licenses",
            exportExcel: "Excel",
            exportPdf: "PDF",
            name: "Name",
            id: "ID/Iqama",
            hijriExpiryCol: "Hijri Expiry",
            gregorianExpiryCol: "Gregorian Expiry",
            daysLeft: "Days Left",
            status: "Status",
            actions: "Actions"
        },
        ar: {
            titleMain: "مدير رخص البلدية",
            totalEmployees: "إجمالي الموظفين",
            expiringSoon: "تنتهي خلال 15 يوم",
            expired: "منتهية",
            validLicenses: "رخص سارية",
            addEmployee: "إضافة موظف جديد",
            employeeName: "اسم الموظف",
            employeeId: "رقم الهوية / الإقامة",
            hijriDate: "تاريخ انتهاء رخصة البلدية (هجري)",
            gregorianDate: "التاريخ الميلادي المحول",
            saveEmployee: "حفظ الموظف",
            employeeList: "رخص البلدية للموظفين",
            exportExcel: "إكسل",
            exportPdf: "PDF",
            name: "الاسم",
            id: "الهوية / الإقامة",
            hijriExpiryCol: "التاريخ الهجري",
            gregorianExpiryCol: "التاريخ الميلادي",
            daysLeft: "الأيام المتبقية",
            status: "الحالة",
            actions: "إجراءات"
        }
    };

    let currentLang = "en";
    let employees = [];

    // Load from localStorage
    function loadEmployees() {
        const stored = localStorage.getItem('municipality_employees');
        if (stored) {
            employees = JSON.parse(stored);
        } else {
            // Sample data
            employees = [
                { id: "EMP001", name: "Ahmed Al-Rashid", hijriExpiry: "1446-12-15", gregorianExpiry: "", daysLeft: 0, status: "" },
                { id: "EMP002", name: "Mohammed Al-Otaibi", hijriExpiry: "1446-06-20", gregorianExpiry: "", daysLeft: 0, status: "" },
                { id: "EMP003", name: "Fatima Al-Zahrani", hijriExpiry: "1445-08-10", gregorianExpiry: "", daysLeft: 0, status: "" }
            ];
            employees.forEach(emp => {
                const converted = convertHijriToGregorian(emp.hijriExpiry);
                emp.gregorianExpiry = converted.gregorian;
                emp.daysLeft = converted.daysLeft;
                emp.status = getStatusText(converted.daysLeft);
            });
            saveEmployees();
        }
        renderTable();
        updateStats();
    }

    // Hijri to Gregorian Conversion (Islamic Calendar)
    function convertHijriToGregorian(hijriDateStr) {
        try {
            // Parse Hijri date (format: YYYY-MM-DD or YYYY/MM/DD)
            let cleanDate = hijriDateStr.replace(/\//g, '-');
            let parts = cleanDate.split('-');
            if (parts.length !== 3) {
                return { gregorian: "Invalid date", daysLeft: -999, error: true };
            }
            
            let hijriYear = parseInt(parts[0]);
            let hijriMonth = parseInt(parts[1]);
            let hijriDay = parseInt(parts[2]);
            
            // Approximate conversion using known reference
            // Reference: 1 Muharram 1445 AH = 19 July 2023
            const referenceHijriYear = 1445;
            const referenceHijriMonth = 1;
            const referenceHijriDay = 1;
            const referenceGregorian = new Date(2023, 6, 19); // July 19, 2023
            
            // Calculate days difference
            let daysDiff = 0;
            
            // Add years difference
            let yearDiff = hijriYear - referenceHijriYear;
            daysDiff += yearDiff * 354.367; // Average Hijri year days
            
            // Add months difference
            let monthDiff = hijriMonth - referenceHijriMonth;
            daysDiff += monthDiff * 29.53; // Average month length
            
            // Add days difference
            let dayDiff = hijriDay - referenceHijriDay;
            daysDiff += dayDiff;
            
            // Calculate Gregorian date
            let gregorianDate = new Date(referenceGregorian);
            gregorianDate.setDate(referenceGregorian.getDate() + Math.round(daysDiff));
            
            // Format Gregorian date
            let gregorianStr = gregorianDate.toLocaleDateString('en-GB', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            }).split('/').reverse().join('-');
            
            // Calculate days until expiry
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const daysLeft = Math.ceil((gregorianDate - today) / (1000 * 60 * 60 * 24));
            
            return {
                gregorian: gregorianStr,
                daysLeft: daysLeft,
                date: gregorianDate
            };
        } catch (e) {
            return { gregorian: "Conversion error", daysLeft: -999, error: true };
        }
    }

    function getStatusText(daysLeft) {
        if (daysLeft < 0) return "expired";
        if (daysLeft <= 15) return "warning";
        return "good";
    }

    function getStatusBadge(status, daysLeft) {
        if (status === "expired" || daysLeft < 0) {
            return '<span class="status-badge status-expired">Expired</span>';
        } else if (status === "warning" || daysLeft <= 15) {
            return '<span class="status-badge status-warning">Expiring Soon</span>';
        } else {
            return '<span class="status-badge status-good">Valid</span>';
        }
    }

    function getArabicStatus(status, daysLeft) {
        if (status === "expired" || daysLeft < 0) {
            return '<span class="status-badge status-expired">منتهية</span>';
        } else if (status === "warning" || daysLeft <= 15) {
            return '<span class="status-badge status-warning">تنتهي قريباً</span>';
        } else {
            return '<span class="status-badge status-good">سارية</span>';
        }
    }

    function saveEmployees() {
        localStorage.setItem('municipality_employees', JSON.stringify(employees));
    }

    function renderTable() {
        const tbody = document.getElementById('employeeBody');
        tbody.innerHTML = '';
        
        employees.forEach((emp, index) => {
            // Recalculate days left
            const converted = convertHijriToGregorian(emp.hijriExpiry);
            emp.gregorianExpiry = converted.gregorian;
            emp.daysLeft = converted.daysLeft;
            emp.status = getStatusText(converted.daysLeft);
            
            const row = document.createElement('tr');
            const t = translations[currentLang];
            
            row.innerHTML = `
                <td>${emp.name}</td>
                <td>${emp.id}</td>
                <td>${emp.hijriExpiry}</td>
                <td>${emp.gregorianExpiry}</td>
                <td>${emp.daysLeft < 0 ? 'Expired' : emp.daysLeft + ' days'}</td>
                <td>${currentLang === 'ar' ? getArabicStatus(emp.status, emp.daysLeft) : getStatusBadge(emp.status, emp.daysLeft)}</td>
                <td><button class="delete-btn" onclick="deleteEmployee(${index})"><i class="fas fa-trash"></i></button></td>
            `;
            tbody.appendChild(row);
        });
        
        saveEmployees();
        updateStats();
        checkAndNotify();
    }

    function updateStats() {
        const total = employees.length;
        const expiringSoon = employees.filter(e => e.daysLeft > 0 && e.daysLeft <= 15).length;
        const expired = employees.filter(e => e.daysLeft < 0).length;
        const valid = employees.filter(e => e.daysLeft > 15).length;
        
        document.getElementById('totalEmployees').innerText = total;
        document.getElementById('expiringSoon').innerText = expiringSoon;
        document.getElementById('expiredCount').innerText = expired;
        document.getElementById('validCount').innerText = valid;
        
        // Show warning if any expiring soon
        if (expiringSoon > 0) {
            showToast(`${expiringSoon} employee(s) have municipality licenses expiring within 15 days!`, "warning");
        }
    }

    function checkAndNotify() {
        const expiringEmployees = employees.filter(e => e.daysLeft > 0 && e.daysLeft <= 15);
        if (expiringEmployees.length > 0) {
            console.log(`⚠️ ${expiringEmployees.length} employee(s) need attention`);
        }
    }

    function addEmployee() {
        const name = document.getElementById('empName').value.trim();
        const id = document.getElementById('empId').value.trim();
        let hijriExpiry = document.getElementById('hijriExpiry').value.trim();
        
        if (!name || !id || !hijriExpiry) {
            showToast(currentLang === 'ar' ? 'الرجاء ملء جميع الحقول' : 'Please fill all fields', 'error');
            return;
        }
        
        // Validate Hijri date format
        hijriExpiry = hijriExpiry.replace(/\//g, '-');
        const hijriPattern = /^\d{4}-\d{1,2}-\d{1,2}$/;
        if (!hijriPattern.test(hijriExpiry)) {
            showToast(currentLang === 'ar' ? 'صيغة التاريخ الهجري غير صحيحة (مثال: 1445-12-25)' : 'Invalid Hijri date format (e.g., 1445-12-25)', 'error');
            return;
        }
        
        const converted = convertHijriToGregorian(hijriExpiry);
        
        const newEmployee = {
            name: name,
            id: id,
            hijriExpiry: hijriExpiry,
            gregorianExpiry: converted.gregorian,
            daysLeft: converted.daysLeft,
            status: getStatusText(converted.daysLeft)
        };
        
        employees.push(newEmployee);
        saveEmployees();
        renderTable();
        
        // Clear form
        document.getElementById('empName').value = '';
        document.getElementById('empId').value = '';
        document.getElementById('hijriExpiry').value = '';
        document.getElementById('gregorianExpiry').value = '';
        
        showToast(currentLang === 'ar' ? 'تم إضافة الموظف بنجاح' : 'Employee added successfully', 'success');
        
        // Show warning if expiring soon
        if (converted.daysLeft <= 15 && converted.daysLeft > 0) {
            showToast(currentLang === 'ar' ? `تنبيه: رخصة ${name} تنتهي خلال ${converted.daysLeft} يوم` : `Alert: ${name}'s license expires in ${converted.daysLeft} days`, 'warning');
        }
    }

    function deleteEmployee(index) {
        if (confirm(currentLang === 'ar' ? 'هل أنت متأكد من حذف هذا الموظف؟' : 'Are you sure you want to delete this employee?')) {
            employees.splice(index, 1);
            saveEmployees();
            renderTable();
            showToast(currentLang === 'ar' ? 'تم حذف الموظف' : 'Employee deleted', 'success');
        }
    }

    window.deleteEmployee = deleteEmployee;

    // Hijri to Gregorian live conversion
    document.getElementById('hijriExpiry').addEventListener('input', function() {
        const hijriDate = this.value.trim().replace(/\//g, '-');
        if (hijriDate.match(/^\d{4}-\d{1,2}-\d{1,2}$/)) {
            const converted = convertHijriToGregorian(hijriDate);
            document.getElementById('gregorianExpiry').value = converted.gregorian;
            if (converted.daysLeft <= 15 && converted.daysLeft > 0) {
                document.getElementById('gregorianExpiry').style.color = '#f59e0b';
            } else if (converted.daysLeft < 0) {
                document.getElementById('gregorianExpiry').style.color = '#ef4444';
            } else {
                document.getElementById('gregorianExpiry').style.color = '#10b981';
            }
        } else {
            document.getElementById('gregorianExpiry').value = '';
        }
    });

    // Export to Excel
    function exportToExcel() {
        const wsData = [
            ['Name', 'ID/Iqama', 'Hijri Expiry', 'Gregorian Expiry', 'Days Left', 'Status']
        ];
        
        employees.forEach(emp => {
            wsData.push([
                emp.name,
                emp.id,
                emp.hijriExpiry,
                emp.gregorianExpiry,
                emp.daysLeft < 0 ? 'Expired' : `${emp.daysLeft} days`,
                emp.daysLeft < 0 ? 'Expired' : (emp.daysLeft <= 15 ? 'Expiring Soon' : 'Valid')
            ]);
        });
        
        const ws = XLSX.utils.aoa_to_sheet(wsData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Municipality Licenses');
        XLSX.writeFile(wb, `Municipality_Licenses_${new Date().toISOString().split('T')[0]}.xlsx`);
        showToast(currentLang === 'ar' ? 'تم التصدير إلى إكسل' : 'Exported to Excel', 'success');
    }

    // Export to PDF
    function exportToPDF() {
        const printWindow = window.open('', '_blank');
        const t = translations[currentLang];
        
        let htmlContent = `
            <!DOCTYPE html>
            <html>
            <head>
                <title>Municipality Licenses Report</title>
                <style>
                    body { font-family: Arial, sans-serif; margin: 40px; }
                    h1 { color: #e50914; border-bottom: 2px solid #e50914; padding-bottom: 10px; }
                    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
                    th { background-color: #141414; color: white; }
                    .footer { margin-top: 30px; text-align: center; color: #666; font-size: 12px; }
                    .status-valid { color: #10b981; }
                    .status-warning { color: #f59e0b; }
                    .status-expired { color: #ef4444; }
                </style>
            </head>
            <body>
                <h1>Municipality Licenses Report</h1>
                <p>Generated on: ${new Date().toLocaleString()}</p>
                <p>Total Employees: ${employees.length}</p>
                <p>Expiring within 15 days: ${employees.filter(e => e.daysLeft > 0 && e.daysLeft <= 15).length}</p>
                <p>Expired: ${employees.filter(e => e.daysLeft < 0).length}</p>
                <table>
                    <thead>
                        <tr><th>Name</th><th>ID/Iqama</th><th>Hijri Expiry</th><th>Gregorian Expiry</th><th>Days Left</th><th>Status</th></tr>
                    </thead>
                    <tbody>
        `;
        
        employees.forEach(emp => {
            let statusClass = '';
            let statusText = '';
            if (emp.daysLeft < 0) {
                statusClass = 'status-expired';
                statusText = 'Expired';
            } else if (emp.daysLeft <= 15) {
                statusClass = 'status-warning';
                statusText = 'Expiring Soon';
            } else {
                statusClass = 'status-valid';
                statusText = 'Valid';
            }
            htmlContent += `
                <tr>
                    <td>${emp.name}</td>
                    <td>${emp.id}</td>
                    <td>${emp.hijriExpiry}</td>
                    <td>${emp.gregorianExpiry}</td>
                    <td>${emp.daysLeft < 0 ? 'Expired' : emp.daysLeft + ' days'}</td>
                    <td class="${statusClass}">${statusText}</td>
                </tr>
            `;
        });
        
        htmlContent += `
                    </tbody>
                </table>
                <div class="footer">Generated by SADWAP Municipality License Management System</div>
            </body>
            </html>
        `;
        
        printWindow.document.write(htmlContent);
        printWindow.document.close();
        printWindow.print();
        showToast(currentLang === 'ar' ? 'تم فتح التقرير للطباعة' : 'Report opened for printing', 'success');
    }

    function showToast(msg, type = "success") {
        const toast = document.getElementById('toastMsg');
        const text = document.getElementById('toastText');
        text.innerText = msg;
        toast.style.display = 'flex';
        toast.style.borderLeftColor = type === 'error' ? '#ef4444' : '#e50914';
        setTimeout(() => toast.style.display = 'none', 3000);
    }

    // Language
    function updateLanguage() {
        const t = translations[currentLang];
        document.getElementById('titleMain').innerText = t.titleMain;
        document.querySelectorAll('[data-key]').forEach(el => {
            const key = el.getAttribute('data-key');
            if (t[key]) el.innerText = t[key];
        });
        
        if (currentLang === 'ar') {
            document.documentElement.setAttribute('dir', 'rtl');
            document.body.style.textAlign = 'right';
        } else {
            document.documentElement.setAttribute('dir', 'ltr');
            document.body.style.textAlign = 'left';
        }
        renderTable();
    }

    // Event Listeners
    document.getElementById('addEmployeeBtn').addEventListener('click', addEmployee);
    document.getElementById('exportExcelBtn').addEventListener('click', exportToExcel);
    document.getElementById('exportPdfBtn').addEventListener('click', exportToPDF);
    
    document.getElementById('langEn').addEventListener('click', () => {
        currentLang = 'en';
        document.getElementById('langEn').classList.add('active');
        document.getElementById('langAr').classList.remove('active');
        updateLanguage();
    });
    
    document.getElementById('langAr').addEventListener('click', () => {
        currentLang = 'ar';
        document.getElementById('langAr').classList.add('active');
        document.getElementById('langEn').classList.remove('active');
        updateLanguage();
    });
    
    // Enter key support
    document.getElementById('hijriExpiry').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addEmployee();
    });
    
    // Initialize
    loadEmployees();
    updateLanguage();
</script>
</body>
</html>
