<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>SADWAP | Inventory Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS for Excel export -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Professional Corporate Theme */
        :root {
            --bg-primary: #f4f6fa;
            --card-bg: #ffffff;
            --text-dark: #1a2c3e;
            --text-muted: #5a6e8c;
            --border-light: #e4e9f0;
            --accent: #2c5f8a;
            --accent-hover: #1e405e;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
            --radius-card: 20px;
            --radius-element: 12px;
        }

        body.dark {
            --bg-primary: #0f172a;
            --card-bg: #1e293b;
            --text-dark: #f1f5f9;
            --text-muted: #94a3b8;
            --border-light: #334155;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-dark);
            transition: background 0.2s, color 0.2s;
            padding: 20px;
        }

        .container-fluid { max-width: 1600px; margin: 0 auto; }

        /* Header */
        .header-card {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            padding: 20px 24px;
            margin-bottom: 24px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .logo-area h1 { font-size: 1.4rem; font-weight: 700; margin: 0; color: var(--accent); letter-spacing: -0.3px; }
        .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .lang-switch { display: flex; gap: 6px; background: var(--border-light); padding: 4px; border-radius: 40px; }
        .lang-btn { background: transparent; border: none; padding: 6px 18px; border-radius: 32px; font-weight: 600; font-size: 0.75rem; cursor: pointer; color: var(--text-muted); transition: all 0.2s; }
        .lang-btn.active { background: var(--accent); color: white; }
        .theme-toggle { background: var(--border-light); border: none; border-radius: 40px; padding: 6px 18px; display: flex; align-items: center; gap: 6px; color: var(--text-dark); font-weight: 500; font-size: 0.75rem; }

        /* Live Time */
        .live-time-card {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            padding: 16px 20px;
            margin-bottom: 24px;
            border: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .time-display { font-size: 1.1rem; font-weight: 600; }
        .date-display { color: var(--text-muted); font-size: 0.8rem; }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
        @media (max-width: 768px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
        .stat-card { background: var(--card-bg); border-radius: var(--radius-card); padding: 18px 16px; border: 1px solid var(--border-light); box-shadow: var(--shadow-sm); transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; font-weight: 600; color: var(--text-muted); letter-spacing: 0.5px; }
        .stat-value { font-size: 1.6rem; font-weight: 700; margin: 6px 0 0; }

        /* Chart Panel - Balanced Layout */
        .chart-panel {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid var(--border-light);
        }
        .panel-title { font-weight: 600; font-size: 1rem; margin-bottom: 20px; color: var(--accent); display: flex; align-items: center; gap: 8px; border-bottom: 2px solid var(--border-light); padding-bottom: 12px; }
        .chart-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        .chart-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            height: 320px;
            position: relative;
        }
        @media (max-width: 768px) {
            .chart-container { height: 260px; }
        }

        /* Sales Forecast Panel */
        .forecast-panel { background: var(--accent); border-radius: var(--radius-card); padding: 24px; margin-bottom: 24px; }
        .forecast-panel label { color: white; font-size: 0.75rem; font-weight: 500; margin-bottom: 8px; display: block; }
        .forecast-panel .form-control, .forecast-panel .form-select { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); color: white; border-radius: 40px; padding: 12px 18px; font-size: 0.9rem; }
        .forecast-panel .form-control:focus { background: rgba(255,255,255,0.25); border-color: white; box-shadow: none; }
        .forecast-panel .form-control::placeholder { color: rgba(255,255,255,0.6); }
        .forecast-panel .form-select option { background: var(--accent); color: white; }

        /* Date Navigator */
        .date-nav-panel { background: var(--card-bg); border-radius: var(--radius-card); padding: 20px; margin-bottom: 24px; border: 1px solid var(--border-light); }
        .date-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
        .date-row select { flex: 1; min-width: 100px; background: var(--bg-primary); border: 1px solid var(--border-light); border-radius: 40px; padding: 12px 16px; color: var(--text-dark); font-size: 0.85rem; }
        .action-buttons { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
        .action-buttons .btn { flex: 1; border-radius: 40px; padding: 12px; font-weight: 600; font-size: 0.8rem; border: none; transition: all 0.2s; }
        .btn-outline { background: var(--bg-primary); border: 1px solid var(--border-light); color: var(--text-dark); }
        .btn-primary-custom { background: var(--accent); color: white; }
        .selected-date { background: var(--border-light); text-align: center; padding: 12px; border-radius: 40px; font-size: 0.85rem; font-weight: 500; color: var(--text-dark); }

        /* Inventory Table */
        .table-container { background: var(--card-bg); border-radius: var(--radius-card); border: 1px solid var(--border-light); overflow-x: auto; }
        .inventory-table { width: 100%; border-collapse: collapse; min-width: 900px; }
        .inventory-table th { padding: 16px 12px; text-align: center; border-bottom: 1px solid var(--border-light); color: var(--text-muted); font-weight: 600; font-size: 0.7rem; background: var(--bg-primary); }
        .inventory-table td { padding: 12px 8px; text-align: center; border-bottom: 1px solid var(--border-light); font-size: 0.8rem; }
        .inventory-table td:first-child { text-align: left; font-weight: 500; }
        .inventory-table td input { width: 80px; padding: 8px 6px; border-radius: 30px; border: 1px solid var(--border-light); background: var(--bg-primary); color: var(--text-dark); text-align: center; font-size: 0.75rem; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 40px; font-size: 0.7rem; font-weight: 600; }
        .status-ok { background: rgba(16,185,129,0.15); color: var(--success); border: 1px solid rgba(16,185,129,0.3); }
        .status-warning { background: rgba(245,158,11,0.15); color: var(--warning); border: 1px solid rgba(245,158,11,0.3); }
        .status-critical { background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }
        .variance-positive { color: var(--success); font-weight: 600; }
        .variance-negative { color: var(--danger); font-weight: 600; }

        /* Export Button */
        .export-btn { background: var(--success); color: white; border: none; border-radius: 40px; padding: 10px 24px; font-weight: 600; font-size: 0.8rem; transition: transform 0.2s; }
        .export-btn:hover { transform: translateY(-1px); }

        /* Toast */
        .toast-notify { position: fixed; bottom: 24px; right: 24px; background: var(--card-bg); border-left: 4px solid var(--success); padding: 12px 20px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); z-index: 1100; display: none; align-items: center; gap: 12px; }

        /* RTL Support */
        [dir="rtl"] .inventory-table td:first-child { text-align: right; }
        [dir="rtl"] .action-buttons .btn { direction: rtl; }

        @media (max-width: 640px) { body { padding: 12px; } .stat-value { font-size: 1.2rem; } }
    </style>
</head>
<body>
<div class="container-fluid">
    <!-- Header -->
    <div class="header-card">
        <div class="logo-area"><h1><i class="fas fa-boxes me-2"></i><span id="titleMain">Inventory Control</span></h1></div>
        <div class="controls">
            <div class="lang-switch"><button class="lang-btn active" id="langEn">EN</button><button class="lang-btn" id="langAr">AR</button></div>
            <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i> <span id="themeText">Dark</span></button>
        </div>
    </div>

    <!-- Live Time -->
    <div class="live-time-card">
        <div class="time-display" id="clockDisplay">--:--:--</div>
        <div class="date-display" id="dateDisplay"></div>
    </div>

    <!-- Stats Cards -->
    <div class="stats-grid">
        <div class="stat-card"><div class="stat-label" data-key="totalItems">TOTAL ITEMS</div><div class="stat-value" id="totalItems">0</div></div>
        <div class="stat-card"><div class="stat-label" data-key="variance">VARIANCE</div><div class="stat-value" id="variancePct">0%</div></div>
        <div class="stat-card"><div class="stat-label" data-key="toReplenish">TO REPLENISH</div><div class="stat-value" id="toReplenish">0</div></div>
        <div class="stat-card"><div class="stat-label" data-key="mtdSales">MTD SALES</div><div class="stat-value" id="mtdSales">SAR 0</div></div>
    </div>

    <!-- Chart Panel - Balanced & Centered -->
    <div class="chart-panel">
        <div class="panel-title"><i class="fas fa-chart-bar"></i> <span data-key="varianceAnalytics">Variance Analytics</span></div>
        <div class="chart-wrapper">
            <div class="chart-container">
                <canvas id="varianceChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Sales Forecast -->
    <div class="forecast-panel">
        <div class="row g-3">
            <div class="col-12 col-md-3"><label data-key="mtdSalesLabel">📊 Month to Date Sales (SAR)</label><input type="number" id="mtdSalesInput" class="form-control" value="10900"></div>
            <div class="col-12 col-md-3"><label data-key="avgDailyLabel">📈 Average Daily Sales</label><input type="text" id="avgDailyInput" class="form-control" readonly></div>
            <div class="col-12 col-md-3"><label data-key="forecastDaysLabel">🔮 Forecast Days</label><select id="forecastDays" class="form-select"><option value="1">1 Day</option><option value="2">2 Days</option><option value="3" selected>3 Days</option><option value="7">7 Days</option><option value="10">10 Days</option></select></div>
            <div class="col-12 col-md-3"><label data-key="salesForecastLabel">💰 Sales Forecast (SAR)</label><input type="number" id="salesForecast" class="form-control" readonly></div>
        </div>
    </div>

    <!-- Date Navigator -->
    <div class="date-nav-panel">
        <div class="date-row"><select id="monthSelect"><option value="">Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10" selected>October</option><option value="11">November</option><option value="12">December</option></select>
        <select id="daySelect"><option value="">Day</option></select>
        <select id="yearSelect"><option value="">Year</option></select></div>
        <div class="action-buttons"><button class="btn btn-outline" id="loadBtn"><i class="fas fa-search"></i> <span data-key="load">Load</span></button><button class="btn btn-outline" id="newDayBtn"><i class="fas fa-plus-circle"></i> <span data-key="newDay">New Day</span></button><button class="btn btn-primary-custom" id="saveBtn"><i class="fas fa-save"></i> <span data-key="save">Save</span></button></div>
        <div class="selected-date" id="selectedDateDisplay">Select a date</div>
    </div>

    <!-- Inventory Table -->
    <div class="table-container">
        <div class="d-flex justify-content-between align-items-center p-3 border-bottom border-light"><div class="panel-title mb-0"><i class="fas fa-clipboard-list"></i> <span data-key="inventory">Inventory</span></div><button class="export-btn" id="exportBtn"><i class="fas fa-file-excel"></i> <span data-key="export">Export</span></button></div>
        <div style="overflow-x: auto;">
            <table class="inventory-table" id="inventoryTable">
                <thead><tr><th data-key="item">Item</th><th data-key="system">System</th><th data-key="onHand">On Hand</th><th data-key="varianceCol">Var</th><th data-key="mtdCons">MTD Cons</th><th data-key="avgCons">Avg Cons</th><th data-key="c1000">C/1000</th><th data-key="toOrder">To Order</th><th data-key="status">Status</th></tr></thead>
                <tbody id="inventoryBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast-notify"><i class="fas fa-check-circle"></i> <span id="toastText"></span></div>

<script>
    // ======================== TRANSLATIONS ========================
    const translations = {
        en: { titleMain: "Inventory Control", totalItems: "TOTAL ITEMS", variance: "VARIANCE", toReplenish: "TO REPLENISH", mtdSales: "MTD SALES", varianceAnalytics: "Variance Analytics", mtdSalesLabel: "📊 Month to Date Sales (SAR)", avgDailyLabel: "📈 Average Daily Sales", forecastDaysLabel: "🔮 Forecast Days", salesForecastLabel: "💰 Sales Forecast (SAR)", load: "Load", newDay: "New Day", save: "Save", inventory: "Inventory", export: "Export", item: "Item", system: "System", onHand: "On Hand", varianceCol: "Var", mtdCons: "MTD Cons", avgCons: "Avg Cons", c1000: "C/1000", toOrder: "To Order", status: "Status" },
        ar: { titleMain: "مراقبة المخزون", totalItems: "إجمالي العناصر", variance: "التباين", toReplenish: "للتزويد", mtdSales: "مبيعات الشهر", varianceAnalytics: "تحليل التباين", mtdSalesLabel: "📊 مبيعات الشهر الجاري (ريال)", avgDailyLabel: "📈 متوسط المبيعات اليومية", forecastDaysLabel: "🔮 أيام التوقعات", salesForecastLabel: "💰 توقعات المبيعات (ريال)", load: "تحميل", newDay: "يوم جديد", save: "حفظ", inventory: "المخزون", export: "تصدير", item: "المنتج", system: "النظام", onHand: "المتوفر", varianceCol: "التباين", mtdCons: "استهلاك الشهر", avgCons: "متوسط الاستهلاك", c1000: "ن/1000", toOrder: "للطلب", status: "الحالة" }
    };
    let currentLang = "en";
    let chart = null;
    let currentDate = null;
    let currentData = [];

    // Static items (71 items preserved)
    const staticItems = ["Philly Beef", "Beef Steak", "Chicken Steak", "Lunch Chicken", "Grill Chicken", "Spicy Chicken", "12 inch Tortilla", "10.5 inch Tortilla", "8 inch Tortilla", "Chicken Burger", "Junior Burger", "Nuggets", "Regular Bytes", "Spicy Bytes", "Veggie", "Nachoes", "Quatro", "Aldella Strips", "Hotdog", "Eggs", "Pancake Powder", "Fries", "Crispy", "Hushbrown", "Vanilla Muffin", "Choco Muffin", "Sansbastian Cake", "Brownese Cheese Cake", "Smokey Beef", "Smokey Chicken", "Smokey Turkey", "Steak Bread", "Brown Bread", "Big Bun", "Small Bun", "Kiddie Bread", "4.0 Potato Bun", "Potato Steak Bread", "White Bread", "Multigrain Bread", "Water", "Coffee Beans", "Milk Powder", "Hot Chocolate", "Karak", "Mushroom", "Sweet Kernel", "Pepsi Bib", "Diet Pepsi Bib", "7 Up Bib", "Dew Bib", "Merinda Bib", "Pepsi Cans", "Diet Pepsi Cans", "Merinda Cans", "7up Cans", "Dew Cans", "7up Diet Cans", "Lipton Can Peach", "Lipto Can Red Fruit", "Tomato", "Onion", "Green Pepper", "Chives", "Cherry Tomato", "Cucumber", "Lettuce", "Salad"];

    // DOM Elements
    const monthSelect = document.getElementById('monthSelect'), daySelect = document.getElementById('daySelect'), yearSelect = document.getElementById('yearSelect'), loadBtn = document.getElementById('loadBtn'), newDayBtn = document.getElementById('newDayBtn'), saveBtn = document.getElementById('saveBtn'), exportBtn = document.getElementById('exportBtn'), selectedDisplay = document.getElementById('selectedDateDisplay'), inventoryBody = document.getElementById('inventoryBody'), mtdSalesInput = document.getElementById('mtdSalesInput'), avgDailyInput = document.getElementById('avgDailyInput'), forecastDays = document.getElementById('forecastDays'), salesForecast = document.getElementById('salesForecast'), totalItemsEl = document.getElementById('totalItems'), variancePctEl = document.getElementById('variancePct'), toReplenishEl = document.getElementById('toReplenish'), mtdSalesEl = document.getElementById('mtdSales'), clockDisplay = document.getElementById('clockDisplay'), dateDisplay = document.getElementById('dateDisplay');

    // Populate year
    const yr = new Date().getFullYear();
    for (let y = yr-1; y <= yr+2; y++) { let opt = document.createElement('option'); opt.value = y; opt.textContent = y; yearSelect.appendChild(opt); }
    yearSelect.value = yr;

    function updateDays() { let m = parseInt(monthSelect.value), y = parseInt(yearSelect.value); if (!m || !y) return; let days = new Date(y, m, 0).getDate(); daySelect.innerHTML = '<option value="">Day</option>'; for (let d=1; d<=days; d++) { let opt = document.createElement('option'); opt.value = d; opt.textContent = d; daySelect.appendChild(opt); } daySelect.value = new Date().getDate(); }
    monthSelect.addEventListener('change', updateDays); yearSelect.addEventListener('change', updateDays); updateDays();

    // Clock
    function updateClock() { let now = new Date(); clockDisplay.textContent = now.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit', second:'2-digit'}); dateDisplay.textContent = now.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', year:'numeric'}); }
    setInterval(updateClock, 1000); updateClock();

    function initDate() { let today = new Date(); monthSelect.value = today.getMonth()+1; yearSelect.value = today.getFullYear(); updateDays(); daySelect.value = today.getDate(); currentDate = `${yearSelect.value}/${monthSelect.value}/${daySelect.value}`; selectedDisplay.textContent = `Inventory for ${new Date(yearSelect.value, monthSelect.value-1, daySelect.value).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})}`; }
    initDate();

    // Render table
    function renderInventory() {
        inventoryBody.innerHTML = '';
        staticItems.forEach(item => {
            let tr = document.createElement('tr');
            tr.innerHTML = `<td style="font-weight:500;">${item}</td>
                <td><input type="number" class="system-count" value="0" step="0.01"></td>
                <td><input type="number" class="on-hand" value="0" step="0.01"></td>
                <td class="variance-val">0</td>
                <td><input type="number" class="mtd-cons" value="0" step="0.01"></td>
                <td class="avg-cons">0</td><td class="cper1000">0</td><td class="to-order">0</td><td class="status-cell"></td>`;
            inventoryBody.appendChild(tr);
            let sysInp = tr.querySelector('.system-count'), handInp = tr.querySelector('.on-hand'), mtdInp = tr.querySelector('.mtd-cons'), varTd = tr.querySelector('.variance-val'), avgTd = tr.querySelector('.avg-cons'), c1000Td = tr.querySelector('.cper1000'), toOrderTd = tr.querySelector('.to-order'), statusTd = tr.querySelector('.status-cell');
            function calcRow() {
                let system = parseFloat(sysInp.value) || 0, onHand = parseFloat(handInp.value) || 0, variance = onHand - system;
                varTd.textContent = variance.toFixed(2); varTd.className = variance < 0 ? 'variance-negative' : variance > 0 ? 'variance-positive' : '';
                let mtd = parseFloat(mtdInp.value) || 0, day = parseInt(daySelect.value) || 1, avgCons = mtd / day;
                avgTd.textContent = avgCons.toFixed(2);
                let avgDaily = parseFloat(avgDailyInput.value) || 1, c1000 = (avgCons / avgDaily) * 1000;
                c1000Td.textContent = c1000.toFixed(2);
                let forecast = parseFloat(salesForecast.value) || 0, toOrder = c1000 * (forecast / 1000);
                toOrderTd.textContent = toOrder.toFixed(2);
                let replenish = toOrder - system;
                if (replenish <= 0) statusTd.innerHTML = '<span class="status-badge status-ok">OK</span>';
                else if (replenish <= 10) statusTd.innerHTML = '<span class="status-badge status-warning">LOW</span>';
                else statusTd.innerHTML = '<span class="status-badge status-critical">ORDER</span>';
            }
            sysInp.addEventListener('input', calcRow); handInp.addEventListener('input', calcRow); mtdInp.addEventListener('input', () => { calcRow(); saveMTD(); });
            calcRow();
        });
    }
    renderInventory();

    function saveMTD() { let mtdObj = {}; document.querySelectorAll('#inventoryBody tr').forEach((row, idx) => { let item = staticItems[idx]; let mtdVal = row.querySelector('.mtd-cons')?.value || 0; mtdObj[item] = parseFloat(mtdVal); }); localStorage.setItem('mtdConsumption', JSON.stringify(mtdObj)); }
    function loadMTD() { let saved = localStorage.getItem('mtdConsumption'); if (!saved) return; let mtdObj = JSON.parse(saved); document.querySelectorAll('#inventoryBody tr').forEach((row, idx) => { let item = staticItems[idx]; if (mtdObj[item] !== undefined) { let inp = row.querySelector('.mtd-cons'); if (inp) inp.value = mtdObj[item]; inp.dispatchEvent(new Event('input')); } }); }
    loadMTD();

    function calcSales() { let mtd = parseFloat(mtdSalesInput.value) || 0, day = parseInt(daySelect.value) || 1, avg = mtd / day; avgDailyInput.value = avg.toFixed(2); let days = parseInt(forecastDays.value) || 1, forecast = avg * days; salesForecast.value = forecast.toFixed(2); document.querySelectorAll('#inventoryBody tr').forEach(row => { let sys = row.querySelector('.system-count'); if (sys) sys.dispatchEvent(new Event('input')); }); updateMetrics(); }
    mtdSalesInput.addEventListener('input', calcSales); forecastDays.addEventListener('change', calcSales); daySelect.addEventListener('change', calcSales); calcSales();

    function updateMetrics() {
        totalItemsEl.textContent = staticItems.length;
        let totalVar = 0, totalSys = 0, replenishCount = 0;
        document.querySelectorAll('#inventoryBody tr').forEach(row => { let sys = parseFloat(row.querySelector('.system-count')?.value) || 0; let varTxt = row.querySelector('.variance-val')?.textContent || '0'; totalSys += sys; totalVar += Math.abs(parseFloat(varTxt)); let statusSpan = row.querySelector('.status-badge'); if (statusSpan && statusSpan.textContent.includes('ORDER')) replenishCount++; });
        let varPercent = totalSys ? (totalVar/totalSys*100).toFixed(1) : 0;
        variancePctEl.textContent = varPercent + '%'; toReplenishEl.textContent = replenishCount; mtdSalesEl.textContent = 'SAR ' + (parseFloat(mtdSalesInput.value) || 0).toLocaleString();
    }

    function updateChart() { 
        if (!currentData || currentData.length === 0) { 
            if (chart) chart.destroy(); 
            return; 
        } 
        let sorted = [...currentData].sort((a,b) => Math.abs(b.variance) - Math.abs(a.variance)).slice(0,8);
        let ctx = document.getElementById('varianceChart').getContext('2d'); 
        if (chart) chart.destroy(); 
        chart = new Chart(ctx, { 
            type: 'bar', 
            data: { 
                labels: sorted.map(d => d.itemName.length > 15 ? d.itemName.substring(0,12)+'…' : d.itemName), 
                datasets: [ 
                    { label: 'System', data: sorted.map(d => d.systemCount), backgroundColor: '#2c5f8a', borderRadius: 6, barPercentage: 0.7 }, 
                    { label: 'On Hand', data: sorted.map(d => d.onHand), backgroundColor: '#10b981', borderRadius: 6, barPercentage: 0.7 }, 
                    { label: 'Variance', data: sorted.map(d => d.variance), backgroundColor: '#f59e0b', borderRadius: 6, barPercentage: 0.7 }
                ] 
            }, 
            options: { 
                responsive: true, 
                maintainAspectRatio: true,
                layout: { padding: { top: 20, bottom: 20, left: 10, right: 10 } },
                plugins: { 
                    legend: { position: 'top', labels: { font: { size: 11, weight: '500' }, color: getComputedStyle(document.body).getPropertyValue('--text-dark'), usePointStyle: true, boxWidth: 10 } },
                    tooltip: { backgroundColor: 'rgba(0,0,0,0.8)', titleFont: { size: 12 }, bodyFont: { size: 11 } }
                }, 
                scales: { 
                    y: { grid: { color: 'rgba(128,128,128,0.15)' }, title: { display: true, text: 'Quantity', color: getComputedStyle(document.body).getPropertyValue('--text-muted'), font: { size: 10 } } },
                    x: { ticks: { font: { size: 9 }, maxRotation: 45, minRotation: 30 }, grid: { display: false } }
                } 
            } 
        }); 
    }

    function saveInventory() { if (!currentDate) return; let data = []; document.querySelectorAll('#inventoryBody tr').forEach((row, idx) => { data.push({ itemName: staticItems[idx], systemCount: parseFloat(row.querySelector('.system-count')?.value) || 0, onHand: parseFloat(row.querySelector('.on-hand')?.value) || 0, variance: parseFloat(row.querySelector('.variance-val')?.textContent) || 0, mtdConsumption: parseFloat(row.querySelector('.mtd-cons')?.value) || 0, avgConsumption: parseFloat(row.querySelector('.avg-cons')?.textContent) || 0, consumptionPer1000: parseFloat(row.querySelector('.cper1000')?.textContent) || 0, toOrder: parseFloat(row.querySelector('.to-order')?.textContent) || 0, status: row.querySelector('.status-badge')?.textContent || 'OK' }); }); localStorage.setItem(`inventory_${currentDate}`, JSON.stringify(data)); currentData = data; showToast(`Saved for ${currentDate}`, 'success'); updateChart(); }

    function loadInventory() { let m = monthSelect.value, d = daySelect.value, y = yearSelect.value; if (!m || !d || !y) { showToast('Select full date', 'error'); return; } currentDate = `${y}/${m}/${d}`; selectedDisplay.textContent = `Inventory for ${new Date(y, m-1, d).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})}`; let saved = localStorage.getItem(`inventory_${currentDate}`); if (!saved) { showToast('No data for this date', 'warning'); return; } let data = JSON.parse(saved); currentData = data; document.querySelectorAll('#inventoryBody tr').forEach((row, idx) => { if (data[idx]) { row.querySelector('.system-count').value = data[idx].systemCount; row.querySelector('.on-hand').value = data[idx].onHand; row.querySelector('.mtd-cons').value = data[idx].mtdConsumption; row.querySelector('.system-count').dispatchEvent(new Event('input')); } }); updateChart(); showToast(`Loaded ${currentDate}`, 'success'); }

    function newDay() { document.querySelectorAll('#inventoryBody tr').forEach(row => { row.querySelector('.system-count').value = 0; row.querySelector('.on-hand').value = 0; row.querySelector('.system-count').dispatchEvent(new Event('input')); }); showToast('New day ready', 'success'); }

    function exportExcel() { if (!currentData || currentData.length === 0) { showToast('No data to export', 'error'); return; } let wsData = [['Item','System','On Hand','Variance','MTD Cons','Avg Cons','C/1000','To Order','Status']]; currentData.forEach(i => wsData.push([i.itemName, i.systemCount, i.onHand, i.variance, i.mtdConsumption, i.avgConsumption, i.consumptionPer1000, i.toOrder, i.status])); let wb = XLSX.utils.book_new(); let ws = XLSX.utils.aoa_to_sheet(wsData); XLSX.utils.book_append_sheet(wb, ws, 'Inventory'); XLSX.writeFile(wb, `Inventory_${currentDate.replace(/\//g,'-')}.xlsx`); showToast('Export complete', 'success'); }

    function showToast(msg, type) { let toast = document.getElementById('toastMsg'); document.getElementById('toastText').innerText = msg; toast.style.display = 'flex'; toast.style.borderLeftColor = type === 'error' ? '#ef4444' : '#10b981'; setTimeout(() => toast.style.display = 'none', 2500); }

    loadBtn.addEventListener('click', loadInventory); newDayBtn.addEventListener('click', newDay); saveBtn.addEventListener('click', saveInventory); exportBtn.addEventListener('click', exportExcel);

    // Language & Theme
    function updateLanguage() { let t = translations[currentLang]; document.getElementById('titleMain').innerText = t.titleMain; document.querySelectorAll('[data-key]').forEach(el => { let key = el.getAttribute('data-key'); if (t[key]) el.innerText = t[key]; }); document.documentElement.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr'); document.body.style.textAlign = currentLang === 'ar' ? 'right' : 'left'; }
    document.getElementById('langEn').addEventListener('click', () => { currentLang = 'en'; document.getElementById('langEn').classList.add('active'); document.getElementById('langAr').classList.remove('active'); updateLanguage(); });
    document.getElementById('langAr').addEventListener('click', () => { currentLang = 'ar'; document.getElementById('langAr').classList.add('active'); document.getElementById('langEn').classList.remove('active'); updateLanguage(); });
    let darkMode = localStorage.getItem('inventoryDark') === 'true';
    function applyDarkMode() { if (darkMode) document.body.classList.add('dark'); else document.body.classList.remove('dark'); document.getElementById('themeText').innerText = darkMode ? 'Light' : 'Dark'; document.getElementById('themeToggle').innerHTML = darkMode ? '<i class="fas fa-sun"></i> Light' : '<i class="fas fa-moon"></i> Dark'; if (chart) updateChart(); }
    document.getElementById('themeToggle').addEventListener('click', () => { darkMode = !darkMode; localStorage.setItem('inventoryDark', darkMode); applyDarkMode(); });
    applyDarkMode(); updateLanguage(); setTimeout(() => { loadInventory(); updateMetrics(); }, 100);
</script>
</body>
</html>
