<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>SADWAP | Netflix Style Inventory</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS for Excel export -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* NETFLIX RED & BLACK THEME */
        :root {
            --netflix-black: #000000;
            --netflix-dark: #0a0a0a;
            --netflix-card: #141414;
            --netflix-card-hover: #1f1f1f;
            --netflix-red: #e50914;
            --netflix-red-dark: #b20710;
            --netflix-gray: #808080;
            --netflix-light-gray: #b3b3b3;
            --netflix-white: #ffffff;
            --netflix-border: #222222;
            --radius-card: 12px;
            --radius-element: 8px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--netflix-black);
            color: var(--netflix-white);
            transition: all 0.2s;
            padding: 20px;
        }

        .container-fluid { max-width: 1600px; margin: 0 auto; }

        /* Header - Netflix Style */
        .header-card {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-card);
            padding: 20px 24px;
            margin-bottom: 24px;
            border: 1px solid var(--netflix-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .logo-area h1 { 
            font-size: 1.6rem; 
            font-weight: 800; 
            margin: 0; 
            background: linear-gradient(135deg, var(--netflix-red), #ff4d4d);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .lang-switch { display: flex; gap: 6px; background: var(--netflix-card); padding: 4px; border-radius: 40px; border: 1px solid var(--netflix-border); }
        .lang-btn { background: transparent; border: none; padding: 6px 18px; border-radius: 32px; font-weight: 600; font-size: 0.75rem; cursor: pointer; color: var(--netflix-light-gray); transition: all 0.2s; }
        .lang-btn.active { background: var(--netflix-red); color: white; }
        
        /* Live Time Card */
        .live-time-card {
            background: var(--netflix-card);
            border-radius: var(--radius-card);
            padding: 16px 20px;
            margin-bottom: 24px;
            border: 1px solid var(--netflix-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .time-display { font-size: 1.1rem; font-weight: 600; color: var(--netflix-red); }
        .date-display { color: var(--netflix-gray); font-size: 0.8rem; }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
        @media (max-width: 768px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
        .stat-card { 
            background: var(--netflix-card); 
            border-radius: var(--radius-card); 
            padding: 18px 16px; 
            border: 1px solid var(--netflix-border); 
            transition: transform 0.2s, border-color 0.2s;
        }
        .stat-card:hover { transform: translateY(-2px); border-color: var(--netflix-red); }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; font-weight: 600; color: var(--netflix-gray); letter-spacing: 0.5px; }
        .stat-value { font-size: 1.6rem; font-weight: 700; margin: 6px 0 0; color: var(--netflix-white); }

        /* Chart Panel */
        .chart-panel {
            background: var(--netflix-card);
            border-radius: var(--radius-card);
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid var(--netflix-border);
        }
        .panel-title { 
            font-weight: 700; 
            font-size: 1rem; 
            margin-bottom: 20px; 
            color: var(--netflix-red); 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            border-bottom: 2px solid var(--netflix-border); 
            padding-bottom: 12px; 
        }
        .chart-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            height: 320px;
            position: relative;
        }
        @media (max-width: 768px) { .chart-container { height: 260px; } }

        /* Forecast Panel */
        .forecast-panel { 
            background: linear-gradient(135deg, var(--netflix-red), var(--netflix-red-dark)); 
            border-radius: var(--radius-card); 
            padding: 24px; 
            margin-bottom: 24px; 
        }
        .forecast-panel label { color: white; font-size: 0.75rem; font-weight: 600; margin-bottom: 8px; display: block; }
        .forecast-panel .form-control, .forecast-panel .form-select { 
            background: rgba(255,255,255,0.15); 
            border: 1px solid rgba(255,255,255,0.25); 
            color: white; 
            border-radius: 40px; 
            padding: 12px 18px; 
            font-size: 0.9rem; 
        }
        .forecast-panel .form-control:focus { background: rgba(255,255,255,0.25); border-color: white; box-shadow: none; }
        .forecast-panel .form-control::placeholder { color: rgba(255,255,255,0.6); }
        .forecast-panel .form-select option { background: var(--netflix-red); color: white; }

        /* Add Item Section */
        .add-item-section {
            background: var(--netflix-card);
            border-radius: var(--radius-card);
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid var(--netflix-border);
        }
        .add-item-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .add-item-row input {
            flex: 1;
            background: var(--netflix-dark);
            border: 1px solid var(--netflix-border);
            border-radius: var(--radius-element);
            padding: 12px 16px;
            color: var(--netflix-white);
            font-size: 0.9rem;
        }
        .add-item-row input:focus { outline: none; border-color: var(--netflix-red); }
        .btn-add {
            background: var(--netflix-red);
            border: none;
            border-radius: var(--radius-element);
            padding: 12px 24px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-add:hover { background: var(--netflix-red-dark); transform: scale(0.98); }

        /* Date Navigator */
        .date-nav-panel {
            background: var(--netflix-card);
            border-radius: var(--radius-card);
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid var(--netflix-border);
        }
        .date-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
        .date-row select { 
            flex: 1; 
            min-width: 100px; 
            background: var(--netflix-dark); 
            border: 1px solid var(--netflix-border); 
            border-radius: 40px; 
            padding: 12px 16px; 
            color: var(--netflix-white); 
            font-size: 0.85rem; 
        }
        .action-buttons { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
        .action-buttons .btn { 
            flex: 1; 
            border-radius: 40px; 
            padding: 12px; 
            font-weight: 600; 
            font-size: 0.8rem; 
            border: none; 
            transition: all 0.2s; 
            cursor: pointer;
        }
        .btn-outline { background: transparent; border: 1px solid var(--netflix-border); color: var(--netflix-white); }
        .btn-outline:hover { border-color: var(--netflix-red); color: var(--netflix-red); }
        .btn-primary-custom { background: var(--netflix-red); color: white; }
        .btn-primary-custom:hover { background: var(--netflix-red-dark); }
        .selected-date { 
            background: var(--netflix-dark); 
            text-align: center; 
            padding: 12px; 
            border-radius: 40px; 
            font-size: 0.85rem; 
            font-weight: 500; 
            color: var(--netflix-light-gray);
            border: 1px solid var(--netflix-border);
        }

        /* Inventory Table */
        .table-container { 
            background: var(--netflix-card); 
            border-radius: var(--radius-card); 
            border: 1px solid var(--netflix-border); 
            overflow-x: auto; 
        }
        .inventory-table { width: 100%; border-collapse: collapse; min-width: 800px; }
        .inventory-table th { 
            padding: 16px 12px; 
            text-align: center; 
            border-bottom: 1px solid var(--netflix-border); 
            color: var(--netflix-gray); 
            font-weight: 600; 
            font-size: 0.7rem; 
            background: var(--netflix-black); 
        }
        .inventory-table td { 
            padding: 12px 8px; 
            text-align: center; 
            border-bottom: 1px solid var(--netflix-border); 
            font-size: 0.8rem; 
        }
        .inventory-table td:first-child { text-align: left; font-weight: 500; }
        .inventory-table td input { 
            width: 80px; 
            padding: 8px 6px; 
            border-radius: 30px; 
            border: 1px solid var(--netflix-border); 
            background: var(--netflix-dark); 
            color: var(--netflix-white); 
            text-align: center; 
            font-size: 0.75rem; 
        }
        .inventory-table td input:focus { outline: none; border-color: var(--netflix-red); }
        .delete-btn {
            background: transparent;
            border: none;
            color: var(--netflix-red);
            cursor: pointer;
            font-size: 1.1rem;
            transition: transform 0.2s;
        }
        .delete-btn:hover { transform: scale(1.1); }
        .status-badge { 
            display: inline-block; 
            padding: 4px 12px; 
            border-radius: 40px; 
            font-size: 0.7rem; 
            font-weight: 600; 
        }
        .status-ok { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
        .status-warning { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }
        .status-critical { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }

        /* Export Button */
        .export-btn { 
            background: var(--netflix-red); 
            color: white; 
            border: none; 
            border-radius: 40px; 
            padding: 10px 24px; 
            font-weight: 600; 
            font-size: 0.8rem; 
            transition: transform 0.2s; 
        }
        .export-btn:hover { transform: translateY(-1px); background: var(--netflix-red-dark); }

        /* Toast */
        .toast-notify { 
            position: fixed; 
            bottom: 24px; 
            right: 24px; 
            background: var(--netflix-card); 
            border-left: 4px solid var(--netflix-red); 
            padding: 12px 20px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); 
            z-index: 1100; 
            display: none; 
            align-items: center; 
            gap: 12px; 
            color: var(--netflix-white);
        }

        /* RTL Support */
        [dir="rtl"] .inventory-table td:first-child { text-align: right; }
        [dir="rtl"] .action-buttons .btn { direction: rtl; }
        [dir="rtl"] .add-item-row { direction: rtl; }

        @media (max-width: 640px) { body { padding: 12px; } .stat-value { font-size: 1.2rem; } }
    </style>
</head>
<body>
<div class="container-fluid">
    <!-- Header -->
    <div class="header-card">
        <div class="logo-area"><h1><i class="fas fa-boxes me-2"></i><span id="titleMain">SADWAP Inventory</span></h1></div>
        <div class="controls">
            <div class="lang-switch"><button class="lang-btn active" id="langEn">EN</button><button class="lang-btn" id="langAr">AR</button></div>
        </div>
    </div>

    <!-- Live Time -->
    <div class="live-time-card">
        <div class="time-display" id="clockDisplay">--:--:--</div>
        <div class="date-display" id="dateDisplay"></div>
    </div>

    <!-- Stats Cards -->
    <div class="stats-grid">
        <div class="stat-card"><div class="stat-label" data-key="totalItems">TOTAL ITEMS</div><div class="stat-value" id="totalItems">0</div></div>
        <div class="stat-card"><div class="stat-label" data-key="toReplenish">TO REPLENISH</div><div class="stat-value" id="toReplenish">0</div></div>
        <div class="stat-card"><div class="stat-label" data-key="lowStock">LOW STOCK</div><div class="stat-value" id="lowStock">0</div></div>
        <div class="stat-card"><div class="stat-label" data-key="mtdSales">MTD SALES</div><div class="stat-value" id="mtdSales">SAR 0</div></div>
    </div>

    <!-- Chart Panel -->
    <div class="chart-panel">
        <div class="panel-title"><i class="fas fa-chart-bar"></i> <span data-key="consumptionAnalytics">Consumption Analytics</span></div>
        <div class="chart-container">
            <canvas id="consumptionChart"></canvas>
        </div>
    </div>

    <!-- Sales Forecast -->
    <div class="forecast-panel">
        <div class="row g-3">
            <div class="col-12 col-md-3"><label data-key="mtdSalesLabel">📊 Month to Date Sales (SAR)</label><input type="number" id="mtdSalesInput" class="form-control" value="10900"></div>
            <div class="col-12 col-md-3"><label data-key="avgDailyLabel">📈 Average Daily Sales</label><input type="text" id="avgDailyInput" class="form-control" readonly></div>
            <div class="col-12 col-md-3"><label data-key="forecastDaysLabel">🔮 Forecast Days</label><select id="forecastDays" class="form-select"><option value="1">1 Day</option><option value="2">2 Days</option><option value="3" selected>3 Days</option><option value="7">7 Days</option><option value="10">10 Days</option></select></div>
            <div class="col-12 col-md-3"><label data-key="salesForecastLabel">💰 Sales Forecast (SAR)</label><input type="number" id="salesForecast" class="form-control" readonly></div>
        </div>
    </div>

    <!-- Add New Item Section -->
    <div class="add-item-section">
        <div class="panel-title"><i class="fas fa-plus-circle"></i> <span data-key="addNewItem">Add New Item</span></div>
        <div class="add-item-row">
            <input type="text" id="newItemName" placeholder="Enter item name..." data-key-placeholder="itemPlaceholder">
            <button class="btn-add" id="addItemBtn"><i class="fas fa-plus"></i> <span data-key="addBtn">Add Item</span></button>
        </div>
    </div>

    <!-- Date Navigator -->
    <div class="date-nav-panel">
        <div class="date-row">
            <select id="monthSelect"><option value="">Month</option></select>
            <select id="daySelect"><option value="">Day</option></select>
            <select id="yearSelect"><option value="">Year</option></select>
        </div>
        <div class="action-buttons">
            <button class="btn btn-outline" id="loadBtn"><i class="fas fa-search"></i> <span data-key="load">Load</span></button>
            <button class="btn btn-outline" id="newDayBtn"><i class="fas fa-plus-circle"></i> <span data-key="newDay">New Day</span></button>
            <button class="btn btn-primary-custom" id="saveBtn"><i class="fas fa-save"></i> <span data-key="save">Save</span></button>
        </div>
        <div class="selected-date" id="selectedDateDisplay">Select a date</div>
    </div>

    <!-- Inventory Table -->
    <div class="table-container">
        <div class="d-flex justify-content-between align-items-center p-3 border-bottom" style="border-color: var(--netflix-border);">
            <div class="panel-title mb-0"><i class="fas fa-clipboard-list"></i> <span data-key="inventory">Inventory</span></div>
            <button class="export-btn" id="exportBtn"><i class="fas fa-file-excel"></i> <span data-key="export">Export</span></button>
        </div>
        <div style="overflow-x: auto;">
            <table class="inventory-table" id="inventoryTable">
                <thead>
                    <tr>
                        <th data-key="item">Item</th>
                        <th data-key="onHand">On Hand</th>
                        <th data-key="mtdCons">MTD Cons</th>
                        <th data-key="avgCons">Avg Cons</th>
                        <th data-key="c1000">C/1000</th>
                        <th data-key="toOrder">To Order</th>
                        <th data-key="status">Status</th>
                        <th data-key="actions">Actions</th>
                    </tr>
                </thead>
                <tbody id="inventoryBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast-notify"><i class="fas fa-check-circle"></i> <span id="toastText"></span></div>

<script>
    // ======================== TRANSLATIONS ========================
    const translations = {
        en: { 
            titleMain: "SADWAP Inventory", totalItems: "TOTAL ITEMS", toReplenish: "TO REPLENISH", 
            lowStock: "LOW STOCK", mtdSales: "MTD SALES", consumptionAnalytics: "Consumption Analytics",
            mtdSalesLabel: "📊 Month to Date Sales (SAR)", avgDailyLabel: "📈 Average Daily Sales",
            forecastDaysLabel: "🔮 Forecast Days", salesForecastLabel: "💰 Sales Forecast (SAR)",
            addNewItem: "Add New Item", itemPlaceholder: "Enter item name...", addBtn: "Add Item",
            load: "Load", newDay: "New Day", save: "Save", inventory: "Inventory", export: "Export",
            item: "Item", onHand: "On Hand", mtdCons: "MTD Cons", avgCons: "Avg Cons",
            c1000: "C/1000", toOrder: "To Order", status: "Status", actions: "Actions"
        },
        ar: { 
            titleMain: "مخزن سادواب", totalItems: "إجمالي العناصر", toReplenish: "للتزويد",
            lowStock: "مخزون منخفض", mtdSales: "مبيعات الشهر", consumptionAnalytics: "تحليل الاستهلاك",
            mtdSalesLabel: "📊 مبيعات الشهر الجاري (ريال)", avgDailyLabel: "📈 متوسط المبيعات اليومية",
            forecastDaysLabel: "🔮 أيام التوقعات", salesForecastLabel: "💰 توقعات المبيعات (ريال)",
            addNewItem: "إضافة عنصر جديد", itemPlaceholder: "أدخل اسم المنتج...", addBtn: "إضافة",
            load: "تحميل", newDay: "يوم جديد", save: "حفظ", inventory: "المخزون", export: "تصدير",
            item: "المنتج", onHand: "المتوفر", mtdCons: "استهلاك الشهر", avgCons: "متوسط الاستهلاك",
            c1000: "ن/1000", toOrder: "للطلب", status: "الحالة", actions: "إجراءات"
        }
    };
    
    let currentLang = "en";
    let chart = null;
    let currentDate = null;
    let currentData = [];
    
    // Default first 10 items
    let inventoryItems = [
        "Philly Beef", "Beef Steak", "Chicken Steak", "Lunch Chicken", 
        "Grill Chicken", "Spicy Chicken", "12 inch Tortilla", "10.5 inch Tortilla", 
        "8 inch Tortilla", "Chicken Burger"
    ];

    // DOM Elements
    const monthSelect = document.getElementById('monthSelect'), daySelect = document.getElementById('daySelect'), yearSelect = document.getElementById('yearSelect');
    const loadBtn = document.getElementById('loadBtn'), newDayBtn = document.getElementById('newDayBtn'), saveBtn = document.getElementById('saveBtn');
    const exportBtn = document.getElementById('exportBtn'), selectedDisplay = document.getElementById('selectedDateDisplay');
    const inventoryBody = document.getElementById('inventoryBody'), mtdSalesInput = document.getElementById('mtdSalesInput');
    const avgDailyInput = document.getElementById('avgDailyInput'), forecastDays = document.getElementById('forecastDays');
    const salesForecast = document.getElementById('salesForecast'), totalItemsEl = document.getElementById('totalItems');
    const toReplenishEl = document.getElementById('toReplenish'), lowStockEl = document.getElementById('lowStock');
    const mtdSalesEl = document.getElementById('mtdSales'), clockDisplay = document.getElementById('clockDisplay');
    const dateDisplay = document.getElementById('dateDisplay'), newItemName = document.getElementById('newItemName');
    const addItemBtn = document.getElementById('addItemBtn');

    // Populate months and years
    function populateSelectors() {
        // Months
        const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        monthSelect.innerHTML = '<option value="">' + (currentLang === 'ar' ? 'الشهر' : 'Month') + '</option>';
        months.forEach((m, idx) => {
            let opt = document.createElement('option');
            opt.value = idx + 1;
            opt.textContent = currentLang === 'ar' ? ['يناير', 'فبراير', 'مارس', 'إبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'][idx] : m;
            monthSelect.appendChild(opt);
        });
        
        // Years
        const yr = new Date().getFullYear();
        yearSelect.innerHTML = '<option value="">' + (currentLang === 'ar' ? 'السنة' : 'Year') + '</option>';
        for (let y = yr-1; y <= yr+2; y++) {
            let opt = document.createElement('option');
            opt.value = y;
            opt.textContent = y;
            yearSelect.appendChild(opt);
        }
        yearSelect.value = yr;
        monthSelect.value = new Date().getMonth() + 1;
        updateDays();
        daySelect.value = new Date().getDate();
    }

    function updateDays() { 
        let m = parseInt(monthSelect.value), y = parseInt(yearSelect.value); 
        if (!m || !y) return; 
        let days = new Date(y, m, 0).getDate(); 
        daySelect.innerHTML = '<option value="">' + (currentLang === 'ar' ? 'اليوم' : 'Day') + '</option>'; 
        for (let d=1; d<=days; d++) { 
            let opt = document.createElement('option'); 
            opt.value = d; 
            opt.textContent = d; 
            daySelect.appendChild(opt); 
        } 
        daySelect.value = Math.min(parseInt(daySelect.value) || new Date().getDate(), days);
    }
    
    monthSelect.addEventListener('change', updateDays);
    yearSelect.addEventListener('change', updateDays);

    // Clock
    function updateClock() { 
        let now = new Date(); 
        clockDisplay.textContent = now.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit', second:'2-digit'}); 
        dateDisplay.textContent = now.toLocaleDateString(currentLang === 'ar' ? 'ar-SA' : 'en-US', {weekday:'short', month:'short', day:'numeric', year:'numeric'}); 
    }
    setInterval(updateClock, 1000); 
    updateClock();

    function initDate() { 
        let today = new Date(); 
        monthSelect.value = today.getMonth()+1; 
        yearSelect.value = today.getFullYear(); 
        updateDays(); 
        daySelect.value = today.getDate(); 
        currentDate = `${yearSelect.value}/${monthSelect.value}/${daySelect.value}`; 
        selectedDisplay.textContent = (currentLang === 'ar' ? 'مخزون ليوم ' : 'Inventory for ') + new Date(yearSelect.value, monthSelect.value-1, daySelect.value).toLocaleDateString(currentLang === 'ar' ? 'ar-SA' : 'en-US', {month:'short', day:'numeric', year:'numeric'}); 
    }

    // Render inventory table
    function renderInventory() {
        inventoryBody.innerHTML = '';
        inventoryItems.forEach((item, idx) => {
            let tr = document.createElement('tr');
            tr.setAttribute('data-item-idx', idx);
            tr.innerHTML = `
                <td style="font-weight:500;">${item}</td>
                <td><input type="number" class="on-hand" value="0" step="0.01"></td>
                <td><input type="number" class="mtd-cons" value="0" step="0.01"></td>
                <td class="avg-cons">0</td>
                <td class="cper1000">0</td>
                <td class="to-order">0</td>
                <td class="status-cell"></td>
                <td><button class="delete-btn" onclick="deleteItem(${idx})"><i class="fas fa-trash"></i></button></td>
            `;
            inventoryBody.appendChild(tr);
            
            let handInp = tr.querySelector('.on-hand'), mtdInp = tr.querySelector('.mtd-cons');
            let avgTd = tr.querySelector('.avg-cons'), c1000Td = tr.querySelector('.cper1000');
            let toOrderTd = tr.querySelector('.to-order'), statusTd = tr.querySelector('.status-cell');
            
            function calcRow() {
                let onHand = parseFloat(handInp.value) || 0;
                let mtd = parseFloat(mtdInp.value) || 0;
                let day = parseInt(daySelect.value) || 1;
                let avgCons = day > 0 ? mtd / day : 0;
                avgTd.textContent = avgCons.toFixed(2);
                
                let avgDaily = parseFloat(avgDailyInput.value) || 1;
                let c1000 = avgDaily > 0 ? (avgCons / avgDaily) * 1000 : 0;
                c1000Td.textContent = c1000.toFixed(2);
                
                let forecast = parseFloat(salesForecast.value) || 0;
                let toOrder = c1000 * (forecast / 1000);
                toOrderTd.textContent = toOrder.toFixed(2);
                
                let replenish = toOrder - onHand;
                if (replenish <= 0) statusTd.innerHTML = '<span class="status-badge status-ok">OK</span>';
                else if (replenish <= 10) statusTd.innerHTML = '<span class="status-badge status-warning">LOW</span>';
                else statusTd.innerHTML = '<span class="status-badge status-critical">ORDER</span>';
            }
            
            handInp.addEventListener('input', calcRow);
            mtdInp.addEventListener('input', () => { calcRow(); saveMTD(); });
            calcRow();
        });
        updateMetrics();
    }

    function deleteItem(index) {
        if (confirm(currentLang === 'ar' ? 'هل أنت متأكد من حذف هذا العنصر؟' : 'Are you sure you want to delete this item?')) {
            inventoryItems.splice(index, 1);
            saveItemsToLocal();
            renderInventory();
            showToast(currentLang === 'ar' ? 'تم حذف العنصر' : 'Item deleted', 'success');
        }
    }
    
    window.deleteItem = deleteItem;

    function addNewItem() {
        let itemName = newItemName.value.trim();
        if (!itemName) {
            showToast(currentLang === 'ar' ? 'الرجاء إدخال اسم المنتج' : 'Please enter item name', 'error');
            return;
        }
        inventoryItems.push(itemName);
        saveItemsToLocal();
        renderInventory();
        newItemName.value = '';
        showToast(currentLang === 'ar' ? 'تم إضافة المنتج' : 'Item added', 'success');
    }

    function saveItemsToLocal() {
        localStorage.setItem('inventoryItems', JSON.stringify(inventoryItems));
    }

    function loadItemsFromLocal() {
        let saved = localStorage.getItem('inventoryItems');
        if (saved && JSON.parse(saved).length > 0) {
            inventoryItems = JSON.parse(saved);
        }
    }

    function saveMTD() { 
        let mtdObj = {}; 
        document.querySelectorAll('#inventoryBody tr').forEach((row, idx) => { 
            let item = inventoryItems[idx]; 
            let mtdVal = row.querySelector('.mtd-cons')?.value || 0; 
            mtdObj[item] = parseFloat(mtdVal); 
        }); 
        localStorage.setItem('mtdConsumption_' + (currentDate || 'default'), JSON.stringify(mtdObj)); 
    }
    
    function loadMTD() { 
        let saved = localStorage.getItem('mtdConsumption_' + (currentDate || 'default')); 
        if (!saved) return; 
        let mtdObj = JSON.parse(saved); 
        document.querySelectorAll('#inventoryBody tr').forEach((row, idx) => { 
            let item = inventoryItems[idx]; 
            if (mtdObj[item] !== undefined) { 
                let inp = row.querySelector('.mtd-cons'); 
                if (inp) inp.value = mtdObj[item]; 
                inp.dispatchEvent(new Event('input')); 
            } 
        }); 
    }

    function calcSales() { 
        let mtd = parseFloat(mtdSalesInput.value) || 0, day = parseInt(daySelect.value) || 1; 
        let avg = mtd / day; 
        avgDailyInput.value = avg.toFixed(2); 
        let days = parseInt(forecastDays.value) || 1, forecast = avg * days; 
        salesForecast.value = forecast.toFixed(2); 
        document.querySelectorAll('#inventoryBody tr').forEach(row => { 
            let hand = row.querySelector('.on-hand'); 
            if (hand) hand.dispatchEvent(new Event('input')); 
        }); 
        updateMetrics(); 
    }
    
    mtdSalesInput.addEventListener('input', calcSales); 
    forecastDays.addEventListener('change', calcSales); 
    daySelect.addEventListener('change', calcSales); 

    function updateMetrics() {
        totalItemsEl.textContent = inventoryItems.length;
        let replenishCount = 0, lowStockCount = 0;
        document.querySelectorAll('#inventoryBody tr').forEach(row => { 
            let statusSpan = row.querySelector('.status-badge'); 
            if (statusSpan) {
                let statusText = statusSpan.textContent;
                if (statusText.includes('ORDER')) replenishCount++;
                if (statusText.includes('LOW')) lowStockCount++;
            }
        });
        toReplenishEl.textContent = replenishCount;
        lowStockEl.textContent = lowStockCount;
        mtdSalesEl.textContent = 'SAR ' + (parseFloat(mtdSalesInput.value) || 0).toLocaleString();
    }

    function updateChart() { 
        if (!currentData || currentData.length === 0) { 
            if (chart) chart.destroy(); 
            return; 
        } 
        let sorted = [...currentData].sort((a,b) => b.mtdConsumption - a.mtdConsumption).slice(0,8);
        let ctx = document.getElementById('consumptionChart').getContext('2d'); 
        if (chart) chart.destroy(); 
        chart = new Chart(ctx, { 
            type: 'bar', 
            data: { 
                labels: sorted.map(d => d.itemName.length > 15 ? d.itemName.substring(0,12)+'…' : d.itemName), 
                datasets: [{ 
                    label: currentLang === 'ar' ? 'الاستهلاك الشهري' : 'MTD Consumption', 
                    data: sorted.map(d => d.mtdConsumption), 
                    backgroundColor: '#e50914', 
                    borderRadius: 6, 
                    barPercentage: 0.7 
                }] 
            }, 
            options: { 
                responsive: true, 
                maintainAspectRatio: true,
                plugins: { 
                    legend: { labels: { color: '#b3b3b3' } },
                    tooltip: { backgroundColor: '#141414', titleColor: '#e50914' }
                }, 
                scales: { 
                    y: { 
                        grid: { color: 'rgba(128,128,128,0.15)' }, 
                        title: { display: true, text: currentLang === 'ar' ? 'الكمية' : 'Quantity', color: '#808080' } 
                    },
                    x: { ticks: { color: '#b3b3b3', maxRotation: 45, minRotation: 30 }, grid: { display: false } }
                } 
            } 
        }); 
    }

    function saveInventory() { 
        if (!currentDate) return; 
        let data = []; 
        document.querySelectorAll('#inventoryBody tr').forEach((row, idx) => { 
            data.push({ 
                itemName: inventoryItems[idx], 
                onHand: parseFloat(row.querySelector('.on-hand')?.value) || 0, 
                mtdConsumption: parseFloat(row.querySelector('.mtd-cons')?.value) || 0, 
                avgConsumption: parseFloat(row.querySelector('.avg-cons')?.textContent) || 0, 
                consumptionPer1000: parseFloat(row.querySelector('.cper1000')?.textContent) || 0, 
                toOrder: parseFloat(row.querySelector('.to-order')?.textContent) || 0, 
                status: row.querySelector('.status-badge')?.textContent || 'OK' 
            }); 
        }); 
        localStorage.setItem(`inventory_${currentDate}`, JSON.stringify(data)); 
        currentData = data; 
        showToast((currentLang === 'ar' ? 'تم حفظ مخزون ' : 'Saved for ') + currentDate, 'success'); 
        updateChart(); 
    }

    function loadInventory() { 
        let m = monthSelect.value, d = daySelect.value, y = yearSelect.value; 
        if (!m || !d || !y) { 
            showToast(currentLang === 'ar' ? 'اختر تاريخ كامل' : 'Select full date', 'error'); 
            return; 
        } 
        currentDate = `${y}/${m}/${d}`; 
        selectedDisplay.textContent = (currentLang === 'ar' ? 'مخزون ليوم ' : 'Inventory for ') + new Date(y, m-1, d).toLocaleDateString(currentLang === 'ar' ? 'ar-SA' : 'en-US', {month:'short', day:'numeric', year:'numeric'}); 
        let saved = localStorage.getItem(`inventory_${currentDate}`); 
        if (!saved) { 
            showToast(currentLang === 'ar' ? 'لا توجد بيانات لهذا التاريخ' : 'No data for this date', 'warning'); 
            return; 
        } 
        let data = JSON.parse(saved); 
        currentData = data; 
        document.querySelectorAll('#inventoryBody tr').forEach((row, idx) => { 
            if (data[idx]) { 
                row.querySelector('.on-hand').value = data[idx].onHand; 
                row.querySelector('.mtd-cons').value = data[idx].mtdConsumption; 
                row.querySelector('.on-hand').dispatchEvent(new Event('input')); 
            } 
        }); 
        updateChart(); 
        showToast((currentLang === 'ar' ? 'تم تحميل ' : 'Loaded ') + currentDate, 'success'); 
    }

    function newDay() { 
        document.querySelectorAll('#inventoryBody tr').forEach(row => { 
            row.querySelector('.on-hand').value = 0; 
            row.querySelector('.mtd-cons').value = 0; 
            row.querySelector('.on-hand').dispatchEvent(new Event('input')); 
        }); 
        showToast(currentLang === 'ar' ? 'يوم جديد جاهز' : 'New day ready', 'success'); 
    }

    function exportExcel() { 
        if (!currentData || currentData.length === 0) { 
            showToast(currentLang === 'ar' ? 'لا توجد بيانات للتصدير' : 'No data to export', 'error'); 
            return; 
        } 
        let wsData = [['Item','On Hand','MTD Cons','Avg Cons','C/1000','To Order','Status']]; 
        currentData.forEach(i => wsData.push([i.itemName, i.onHand, i.mtdConsumption, i.avgConsumption, i.consumptionPer1000, i.toOrder, i.status])); 
        let wb = XLSX.utils.book_new(); 
        let ws = XLSX.utils.aoa_to_sheet(wsData); 
        XLSX.utils.book_append_sheet(wb, ws, 'Inventory'); 
        XLSX.writeFile(wb, `Inventory_${currentDate.replace(/\//g,'-')}.xlsx`); 
        showToast(currentLang === 'ar' ? 'تم التصدير بنجاح' : 'Export complete', 'success'); 
    }

    function showToast(msg, type) { 
        let toast = document.getElementById('toastMsg'); 
        document.getElementById('toastText').innerText = msg; 
        toast.style.display = 'flex'; 
        toast.style.borderLeftColor = type === 'error' ? '#ef4444' : '#e50914'; 
        setTimeout(() => toast.style.display = 'none', 2500); 
    }

    // Language
    function updateLanguage() { 
        let t = translations[currentLang]; 
        document.getElementById('titleMain').innerText = t.titleMain; 
        document.querySelectorAll('[data-key]').forEach(el => { 
            let key = el.getAttribute('data-key'); 
            if (t[key]) el.innerText = t[key]; 
        });
        document.querySelectorAll('[data-key-placeholder]').forEach(el => {
            let key = el.getAttribute('data-key-placeholder');
            if (t[key]) el.placeholder = t[key];
        });
        document.documentElement.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr'); 
        document.body.style.textAlign = currentLang === 'ar' ? 'right' : 'left';
        populateSelectors();
        initDate();
        renderInventory();
        if (currentDate) loadInventory();
        calcSales();
    }
    
    document.getElementById('langEn').addEventListener('click', () => { 
        currentLang = 'en'; 
        document.getElementById('langEn').classList.add('active'); 
        document.getElementById('langAr').classList.remove('active'); 
        updateLanguage(); 
    });
    
    document.getElementById('langAr').addEventListener('click', () => { 
        currentLang = 'ar'; 
        document.getElementById('langAr').classList.add('active'); 
        document.getElementById('langEn').classList.remove('active'); 
        updateLanguage(); 
    });

    // Event Listeners
    loadBtn.addEventListener('click', loadInventory);
    newDayBtn.addEventListener('click', newDay);
    saveBtn.addEventListener('click', saveInventory);
    exportBtn.addEventListener('click', exportExcel);
    addItemBtn.addEventListener('click', addNewItem);
    newItemName.addEventListener('keypress', (e) => { if (e.key === 'Enter') addNewItem(); });

    // Initialize
    loadItemsFromLocal();
    populateSelectors();
    initDate();
    renderInventory();
    calcSales();
    updateLanguage();
    setTimeout(() => { updateChart(); }, 500);
</script>
</body>
</html>
