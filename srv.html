<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>SADWAP · Cleaning Manager</title>
    <!-- Bootstrap 5.3.3 + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- html2pdf -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- jsPDF for direct image handling -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: #0f172a; 
            color: #e2e8f0; 
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding: 16px; 
            transition: background 0.2s, color 0.2s;
        }
        .card {
            background: #1e293b; 
            border: 1px solid #334155;
            border-radius: 24px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .card-header {
            background: #0f2a44; 
            color: white; 
            border-radius: 24px 24px 0 0 !important;
            padding: 16px 20px; 
            font-weight: 600; 
            border: none;
        }
        .btn { 
            border-radius: 40px; 
            padding: 10px 20px; 
            font-weight: 600; 
            font-size: 0.8rem; 
            min-height: 44px; 
        }
        .btn-primary { background: #2563eb; border: none; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-success { background: #0b7e4b; border: none; }
        .btn-danger { background: #b91c1c; }
        .btn-outline-secondary { 
            background: #1e293b; 
            border: 1px solid #475569; 
            color: #e2e8f0; 
        }
        .btn-outline-secondary:hover { background: #2d3b52; color: white; }
        .form-control, .form-select {
            background: #1e293b; 
            border: 1px solid #475569; 
            color: #e2e8f0;
            border-radius: 40px; 
            padding: 10px 16px; 
        }
        .form-control::placeholder { color: #94a3b8; }
        .form-control:focus, .form-select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }
        .stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin: 20px 0; }
        @media (max-width:600px){ .stats-grid { grid-template-columns: repeat(2,1fr); } }
        .stat-card { 
            background: #1e293b; 
            border-radius: 20px; 
            padding: 16px; 
            text-align: center; 
            border: 1px solid #334155;
        }
        .stat-title { 
            font-size: 0.6rem; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            color: #94a3b8; 
        }
        .stat-value { font-size: 1.8rem; font-weight: 700; color: #f1f5f9; }
        .camera-container { 
            background: #0b1a2a; 
            border-radius: 20px; 
            overflow: hidden; 
            min-height: 200px; 
            position: relative; 
            border: 1px solid #334155;
        }
        #videoElement { width: 100%; height: 200px; object-fit: cover; display: none; }
        .camera-placeholder { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 200px; 
            color: #64748b; 
        }
        .photo-thumbnails { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(70px,1fr)); 
            gap: 10px; 
            margin-top: 12px; 
        }
        .photo-thumbnail { 
            position: relative; 
            aspect-ratio: 1; 
            border-radius: 16px; 
            overflow: hidden; 
            border: 2px solid #334155; 
            background: #1e293b; 
        }
        .photo-thumbnail img { width: 100%; height: 100%; object-fit: cover; }
        .photo-number { 
            position: absolute; top: 4px; left: 4px; 
            background: #2563eb; color: white; 
            width: 22px; height: 22px; border-radius: 30px; 
            font-size: 0.6rem; font-weight: 700; 
            display: flex; align-items: center; justify-content: center; 
        }
        .delete-photo { 
            position: absolute; top: 4px; right: 4px; 
            background: #b91c1c; color: white; 
            border: none; width: 22px; height: 22px; border-radius: 30px; 
            font-size: 0.8rem; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; 
        }
        .task-card { 
            background: #1e293b; 
            border-radius: 20px; 
            padding: 16px; 
            margin-bottom: 14px; 
            border-left: 5px solid #475569; 
            border: 1px solid #334155;
            border-left-width: 5px;
        }
        .task-card.high-priority { border-left-color: #ef4444; }
        .task-card.medium-priority { border-left-color: #f59e0b; }
        .task-card.low-priority { border-left-color: #10b981; }
        .task-images { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
        .task-image { 
            width: 56px; height: 56px; object-fit: cover; 
            border-radius: 14px; border: 1px solid #334155; 
            cursor: pointer; 
        }
        .crew-member, .team-member { 
            background: #2d3b52; 
            color: #b9d0f0; 
            padding: 4px 14px; 
            border-radius: 40px; 
            font-size: 0.75rem; 
            font-weight: 500; 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            margin: 2px; 
        }
        .remove-crew, .remove-team-member { 
            background: none; 
            border: none; 
            color: #94a3b8; 
            cursor: pointer; 
            font-size: 1rem; 
        }
        .toast-notify { 
            position: fixed; bottom: 20px; left: 20px; right: 20px; 
            max-width: 400px; margin: 0 auto; 
            background: #1e293b; 
            border-left: 5px solid #3b82f6; 
            padding: 12px 18px; 
            border-radius: 16px; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.5); 
            z-index: 1200; 
            display: none; 
            align-items: center; 
            gap: 10px; 
            color: #e2e8f0;
        }
        .badge { font-weight: 500; padding: 6px 12px; border-radius: 40px; }
        .lang-switch { 
            background: #2d3b52; 
            border-radius: 40px; 
            padding: 4px; 
            display: inline-flex; 
        }
        .lang-btn { 
            background: transparent; 
            border: none; 
            padding: 4px 16px; 
            border-radius: 40px; 
            font-weight: 600; 
            font-size: 0.7rem; 
            cursor: pointer; 
            color: #94a3b8; 
        }
        .lang-btn.active { background: #3b82f6; color: white; }
        .store-card { 
            background: #0f2a44; 
            border-radius: 24px; 
            padding: 16px 20px; 
            color: white; 
            margin-bottom: 20px; 
        }
        .store-card .form-control { 
            background: rgba(255,255,255,0.08); 
            border: 1px solid rgba(255,255,255,0.15); 
            color: white; 
            border-radius: 40px; 
        }
        .store-card .form-control::placeholder { color: rgba(255,255,255,0.4); }
        .store-card .form-label { font-size: 0.65rem; opacity: 0.8; margin-bottom: 2px; }
        .task-list-wrapper { max-height: 520px; overflow-y: auto; }
        
        .highlight-banner {
            background: #facc15; 
            color: #0f172a; 
            padding: 12px 20px; 
            border-radius: 60px; 
            font-weight: 600; 
            font-size: 0.9rem; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin-bottom: 18px;
            box-shadow: 0 4px 12px rgba(250,204,21,0.25);
            border: 1px solid #eab308;
            flex-wrap: wrap;
            justify-content: center;
        }
        .highlight-banner i { font-size: 1.2rem; color: #0f172a; }
        .highlight-banner span { 
            background: rgba(15,23,42,0.08); 
            padding: 4px 16px; 
            border-radius: 40px; 
            font-weight: 700; 
            letter-spacing: 0.3px;
        }
        @media (max-width:640px){ 
            .highlight-banner { font-size: 0.75rem; padding: 10px 14px; }
            .photo-thumbnails { grid-template-columns: repeat(3,1fr); }
        }
        [dir="rtl"] .task-card { border-left-width: 1px; border-right-width: 5px; }
        [dir="rtl"] .task-card.high-priority { border-right-color: #ef4444; border-left-color: #334155; }
        [dir="rtl"] .task-card.medium-priority { border-right-color: #f59e0b; }
        [dir="rtl"] .task-card.low-priority { border-right-color: #10b981; }
        .task-list-wrapper::-webkit-scrollbar { width: 6px; }
        .task-list-wrapper::-webkit-scrollbar-track { background: #1e293b; }
        .task-list-wrapper::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
</head>
<body class="dark">
<div class="app-container">
    <!-- header -->
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h1 style="font-size:1.4rem; font-weight:700; color:#facc15;" id="brandTitle">SADWAP</h1>
        <div class="d-flex gap-3 align-items-center">
            <div class="lang-switch">
                <button class="lang-btn active" id="langEn" data-lang="en">EN</button>
                <button class="lang-btn" id="langAr" data-lang="ar">AR</button>
            </div>
        </div>
    </div>

    <!-- YELLOW HIGHLIGHT -->
    <div class="highlight-banner">
        <i class="bi bi-camera-reels"></i>
        <span>📸</span> 
        Cleaning assignments utilise the rear-facing camera to capture superior imagery of critical zones — optimised for tablets and mobile devices.
        <i class="bi bi-phone"></i>
    </div>

    <!-- store info -->
    <div class="store-card row g-2">
        <div class="col-md-6"><label class="form-label" data-key="storeNameLabel">Store Name</label><input type="text" class="form-control" id="storeName" value="Fine Dining Restaurant"></div>
        <div class="col-md-6"><label class="form-label" data-key="locationLabel">Location</label><input type="text" class="form-control" id="storeLocation" value="123 Main Street"></div>
    </div>

    <!-- stats -->
    <div class="stats-grid">
        <div class="stat-card"><div class="stat-title" data-key="totalTasks">TOTAL</div><div class="stat-value" id="totalTasks">0</div></div>
        <div class="stat-card"><div class="stat-title" data-key="pendingTasks">PENDING</div><div class="stat-value" id="pendingTasks">0</div></div>
        <div class="stat-card"><div class="stat-title" data-key="inProgressTasks">IN PROGRESS</div><div class="stat-value" id="inProgressTasks">0</div></div>
        <div class="stat-card"><div class="stat-title" data-key="completedTasks">COMPLETED</div><div class="stat-value" id="completedTasks">0</div></div>
    </div>

    <!-- team management -->
    <div class="card mb-4">
        <div class="card-header" data-key="teamManagement"><i class="bi bi-people me-2"></i>Team Management</div>
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-5"><label class="form-label" data-key="addTeamMemberLabel">Add member</label><div class="input-group"><input type="text" class="form-control" id="teamMemberInput" placeholder="Name"><button class="btn btn-primary" id="addTeamMemberBtn"><i class="bi bi-plus-lg"></i></button></div></div>
                <div class="col-md-7"><label class="form-label" data-key="teamMembersLabel">Team members</label><div id="teamMemberList" class="d-flex flex-wrap gap-1"></div></div>
            </div>
        </div>
    </div>

    <!-- add task + list -->
    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card">
                <div class="card-header" data-key="addNewTask"><i class="bi bi-plus-circle me-2"></i>New Task</div>
                <div class="card-body">
                    <form id="taskForm">
                        <label class="fw-bold" data-key="beforePictures">Before Pictures <span class="text-danger">(min 3)</span></label>
                        <div class="d-flex justify-content-between mt-1"><span id="photoProgressText">0 / 3</span><span class="text-muted small" data-key="minPhotos">minimum 3</span></div>
                        <div class="progress mb-2" style="height:6px; background:#2d3b52;"><div class="progress-bar bg-success" id="photoProgress" style="width:0%"></div></div>
                        <div class="camera-container">
                            <video id="videoElement" autoplay playsinline></video>
                            <canvas id="canvasElement" style="display:none;"></canvas>
                            <div id="cameraPlaceholder" class="camera-placeholder"><i class="bi bi-camera display-4"></i><p class="mt-1">Camera off</p></div>
                        </div>
                        <div class="d-flex gap-2 mt-2 flex-wrap">
                            <button type="button" class="btn btn-outline-secondary flex-grow-1" id="startCameraBtn" data-key="startCamera"><i class="bi bi-camera-video"></i> Start</button>
                            <button type="button" class="btn btn-success flex-grow-1" id="captureBtn" disabled data-key="capture"><i class="bi bi-camera"></i> Capture</button>
                            <button type="button" class="btn btn-outline-secondary flex-grow-1" id="stopCameraBtn" disabled data-key="stopCamera"><i class="bi bi-stop-circle"></i> Stop</button>
                        </div>
                        <div id="photoGallery" style="display:none;" class="mt-2"><div class="d-flex justify-content-between"><small data-key="photosLabel">Photos</small><button type="button" class="btn btn-sm btn-outline-danger" id="clearAllPhotosBtn" data-key="clearAll"><i class="bi bi-trash"></i> Clear</button></div><div class="photo-thumbnails" id="photoThumbnails"></div></div>

                        <div class="mt-3"><label class="fw-bold" data-key="taskDescLabel">Task Description *</label><textarea class="form-control" id="taskDesc" rows="2" required></textarea></div>

                        <div class="mt-2"><label class="fw-bold" data-key="assignLabel">Assign to (from team)</label>
                            <select class="form-select" id="assignSelect"><option value="">-- select --</option></select>
                            <div id="selectedCrewList" class="d-flex flex-wrap gap-1 mt-2"></div>
                        </div>

                        <div class="row g-2 mt-2">
                            <div class="col-4"><label class="fw-bold" data-key="priorityLabel">Priority</label><select class="form-select" id="prioritySelect"><option value="">Select</option><option value="High">High</option><option value="Medium">Medium</option><option value="Low">Low</option></select></div>
                            <div class="col-4"><label class="fw-bold" data-key="areaLabel">Area</label><select class="form-select" id="areaSelect"><option value="">Select</option><option value="Kitchen">Kitchen</option><option value="Dining">Dining</option><option value="Restrooms">Restrooms</option><option value="Storage">Storage</option><option value="Entrance">Entrance</option></select></div>
                            <div class="col-4"><label class="fw-bold" data-key="statusLabel">Status</label><select class="form-select" id="statusSelect"><option value="Pending">Pending</option><option value="In Progress">In Progress</option><option value="Completed">Completed</option></select></div>
                        </div>
                        <div class="row g-2 mt-2">
                            <div class="col-6"><label class="fw-bold" data-key="dueDateLabel">Due Date</label><input type="date" class="form-control" id="dueDateInput"></div>
                            <div class="col-6"><label class="fw-bold" data-key="finishDateLabel">Finish Date</label><input type="date" class="form-control" id="finishDateInput"></div>
                        </div>
                        <div class="alert alert-warning mt-3 d-none" id="validationAlert"><i class="bi bi-exclamation-triangle me-2"></i><span id="validationMsg"></span></div>
                        <button type="submit" class="btn btn-primary w-100 mt-3" data-key="addTaskBtn"><i class="bi bi-plus-circle me-2"></i>Add Task</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center flex-wrap">
                    <span><i class="bi bi-list-check me-2"></i><span data-key="taskList">Task List</span></span>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-success" id="exportPdfBtn" data-key="exportPdf"><i class="bi bi-file-pdf"></i> PDF</button>
                        <button class="btn btn-sm btn-outline-secondary" id="toggleListBtn" data-key="hideList"><i class="bi bi-eye-slash"></i> Hide</button>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="p-3 border-bottom" style="border-color:#334155 !important;">
                        <div class="d-flex gap-2 flex-wrap">
                            <select class="form-select form-select-sm w-auto" id="statusFilter"><option value="" data-key="allStatus">All status</option><option value="Pending">Pending</option><option value="In Progress">In Progress</option><option value="Completed">Completed</option></select>
                            <select class="form-select form-select-sm w-auto" id="priorityFilter"><option value="" data-key="allPriority">All priority</option><option value="High">High</option><option value="Medium">Medium</option><option value="Low">Low</option></select>
                            <span class="badge bg-secondary px-3 py-2" id="taskCount">0 tasks</span>
                        </div>
                    </div>
                    <div id="taskListContainer" class="task-list-wrapper p-3"></div>
                    <div id="emptyState" class="text-center p-5"><i class="bi bi-clipboard-x display-4 text-muted"></i><p class="mt-2 text-muted" data-key="noTasks">No tasks</p></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast-notify"><i class="bi bi-check-circle-fill me-2"></i><span id="toastText"></span></div>

<script>
    // ----- TRANSLATIONS -----
    const translations = {
        en: {
            storeNameLabel: "Store Name", locationLabel: "Location",
            totalTasks: "TOTAL", pendingTasks: "PENDING", inProgressTasks: "IN PROGRESS", completedTasks: "COMPLETED",
            teamManagement: "Team Management", addTeamMemberLabel: "Add member", teamMembersLabel: "Team members",
            addNewTask: "New Task", beforePictures: "Before Pictures", minPhotos: "minimum 3",
            startCamera: "Start", capture: "Capture", stopCamera: "Stop",
            photosLabel: "Photos", clearAll: "Clear",
            taskDescLabel: "Task Description *", assignLabel: "Assign to (from team)",
            priorityLabel: "Priority", areaLabel: "Area", statusLabel: "Status",
            dueDateLabel: "Due Date", finishDateLabel: "Finish Date",
            addTaskBtn: "Add Task", taskList: "Task List",
            exportPdf: "PDF", hideList: "Hide", allStatus: "All status", allPriority: "All priority",
            noTasks: "No tasks", brand: "SADWAP"
        },
        ar: {
            storeNameLabel: "اسم المتجر", locationLabel: "الموقع",
            totalTasks: "إجمالي المهام", pendingTasks: "قيد الانتظار", inProgressTasks: "قيد التنفيذ", completedTasks: "مكتملة",
            teamManagement: "إدارة الفريق", addTeamMemberLabel: "إضافة عضو", teamMembersLabel: "أعضاء الفريق",
            addNewTask: "مهمة جديدة", beforePictures: "الصور قبل التنظيف", minPhotos: "الحد الأدنى ٣",
            startCamera: "تشغيل", capture: "التقاط", stopCamera: "إيقاف",
            photosLabel: "الصور", clearAll: "مسح الكل",
            taskDescLabel: "وصف المهمة *", assignLabel: "تعيين (من الفريق)",
            priorityLabel: "الأولوية", areaLabel: "المنطقة", statusLabel: "الحالة",
            dueDateLabel: "تاريخ الاستحقاق", finishDateLabel: "تاريخ الانتهاء",
            addTaskBtn: "إضافة مهمة", taskList: "قائمة المهام",
            exportPdf: "PDF", hideList: "إخفاء", allStatus: "كل الحالات", allPriority: "كل الأولويات",
            noTasks: "لا توجد مهام", brand: "سادواب"
        }
    };

    // ----- STATE -----
    let tasks = [];
    let teamMembers = [];
    let assignedCrew = [];
    let capturedPhotos = [];
    let stream = null;
    const MIN_PHOTOS = 3;
    let currentLang = 'en';

    // DOM refs
    const $ = id => document.getElementById(id);
    const storeName = $('storeName'), storeLocation = $('storeLocation');
    const teamInput = $('teamMemberInput'), addTeamBtn = $('addTeamMemberBtn'), teamList = $('teamMemberList');
    const taskForm = $('taskForm'), taskDesc = $('taskDesc'), assignSelect = $('assignSelect'), selectedCrewList = $('selectedCrewList');
    const prioritySelect = $('prioritySelect'), areaSelect = $('areaSelect'), dueDateInput = $('dueDateInput'), finishDateInput = $('finishDateInput'), statusSelect = $('statusSelect');
    const startCam = $('startCameraBtn'), captureBtn = $('captureBtn'), stopCam = $('stopCameraBtn');
    const video = $('videoElement'), canvas = $('canvasElement'), camPlaceholder = $('cameraPlaceholder');
    const photoProgress = $('photoProgress'), photoProgressText = $('photoProgressText'), photoGallery = $('photoGallery'), photoThumbnails = $('photoThumbnails'), clearPhotosBtn = $('clearAllPhotosBtn');
    const taskContainer = $('taskListContainer'), emptyState = $('emptyState'), taskCount = $('taskCount');
    const totalEl = $('totalTasks'), pendingEl = $('pendingTasks'), inProgEl = $('inProgressTasks'), completedEl = $('completedTasks');
    const statusFilter = $('statusFilter'), priorityFilter = $('priorityFilter'), exportBtn = $('exportPdfBtn'), toggleListBtn = $('toggleListBtn');
    const validationAlert = $('validationAlert'), validationMsg = $('validationMsg');
    const toast = $('toastMsg'), toastText = $('toastText');
    const brandTitle = $('brandTitle');

    function showToast(msg, type='success'){ toastText.innerText=msg; toast.style.display='flex'; toast.style.borderLeftColor=type==='error'?'#ef4444':'#3b82f6'; setTimeout(()=>toast.style.display='none',2500); }

    // ----- i18n -----
    function applyTranslations() {
        const t = translations[currentLang];
        document.querySelectorAll('[data-key]').forEach(el => {
            const key = el.dataset.key;
            if (t[key] !== undefined) {
                if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT') {
                } else {
                    el.innerText = t[key];
                }
            }
        });
        brandTitle.innerText = t.brand || 'SADWAP';
        teamInput.placeholder = currentLang === 'ar' ? 'الاسم' : 'Name';
        document.querySelectorAll('#statusFilter option, #priorityFilter option').forEach(opt => {
            const key = opt.dataset.key;
            if (key && t[key]) opt.innerText = t[key];
        });
        document.querySelectorAll('#assignSelect option, #prioritySelect option, #areaSelect option').forEach(opt => {
            if (opt.value === '' && currentLang === 'ar') opt.innerText = '-- اختر --';
            else if (opt.value === '' && currentLang === 'en') opt.innerText = '-- select --';
        });
        document.querySelectorAll('[data-key]').forEach(el => {
            const key = el.dataset.key;
            if (key && t[key] && (el.id === 'startCameraBtn' || el.id === 'captureBtn' || el.id === 'stopCameraBtn' || el.id === 'clearAllPhotosBtn' || el.id === 'exportPdfBtn' || el.id === 'toggleListBtn' || el.id === 'addTeamMemberBtn')) {
                const icon = el.querySelector('i');
                if (icon) {
                    const iconHtml = icon.outerHTML;
                    el.innerHTML = iconHtml + ' ' + t[key];
                } else {
                    el.innerText = t[key];
                }
            }
        });
        const addBtn = document.querySelector('button[type="submit"]');
        if (addBtn) {
            const icon = addBtn.querySelector('i');
            if (icon) addBtn.innerHTML = icon.outerHTML + ' ' + t.addTaskBtn;
        }
        document.querySelectorAll('.store-card .form-label').forEach(el => {
            const key = el.dataset.key;
            if (key && t[key]) el.innerText = t[key];
        });
        document.querySelectorAll('.stat-title').forEach(el => {
            const key = el.dataset.key;
            if (key && t[key]) el.innerText = t[key];
        });
        document.querySelectorAll('.card-header').forEach(el => {
            const key = el.dataset.key;
            if (key && t[key]) {
                const icon = el.querySelector('i');
                if (icon) el.innerHTML = icon.outerHTML + ' ' + t[key];
                else el.innerText = t[key];
            }
        });
        const taskListHeader = document.querySelector('.card-header span span');
        if (taskListHeader) {
            const key = taskListHeader.dataset.key;
            if (key && t[key]) taskListHeader.innerText = t[key];
        }
        document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
    }

    document.getElementById('langEn').addEventListener('click', ()=>{ currentLang='en'; document.getElementById('langEn').classList.add('active'); document.getElementById('langAr').classList.remove('active'); applyTranslations(); });
    document.getElementById('langAr').addEventListener('click', ()=>{ currentLang='ar'; document.getElementById('langAr').classList.add('active'); document.getElementById('langEn').classList.remove('active'); applyTranslations(); });

    // ----- STORAGE -----
    function loadData() {
        teamMembers = JSON.parse(localStorage.getItem('teamMembers')) || ['John Smith', 'Maria Garcia', 'David Johnson'];
        tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        if (localStorage.getItem('storeName')) storeName.value = localStorage.getItem('storeName');
        if (localStorage.getItem('storeLocation')) storeLocation.value = localStorage.getItem('storeLocation');
        renderTeamMembers();
        renderAssignOptions();
        renderTasks();
        updateStats();
    }
    function saveData() {
        localStorage.setItem('teamMembers', JSON.stringify(teamMembers));
        localStorage.setItem('tasks', JSON.stringify(tasks));
        localStorage.setItem('storeName', storeName.value);
        localStorage.setItem('storeLocation', storeLocation.value);
    }

    // ----- TEAM -----
    function renderTeamMembers() {
        teamList.innerHTML = teamMembers.map(m => `<span class="team-member">${escHtml(m)}<button class="remove-team-member" onclick="removeTeam('${escHtml(m)}')"><i class="bi bi-x"></i></button></span>`).join('');
        renderAssignOptions();
    }
    window.removeTeam = function(name) {
        teamMembers = teamMembers.filter(m => m !== name);
        assignedCrew = assignedCrew.filter(m => m !== name);
        saveData(); renderTeamMembers(); renderCrewList(); 
        showToast(currentLang==='ar'?'تم الحذف':'Removed', 'info');
    };
    addTeamBtn.addEventListener('click', ()=>{
        const name = teamInput.value.trim();
        if(name && !teamMembers.includes(name)){ teamMembers.push(name); saveData(); renderTeamMembers(); teamInput.value=''; showToast(currentLang==='ar'?`تم إضافة ${name}`:`Added ${name}`); }
    });
    function renderAssignOptions() {
        assignSelect.innerHTML = `<option value="">${currentLang==='ar'?'-- اختر --':'-- select --'}</option>` + teamMembers.map(m => `<option value="${escHtml(m)}">${escHtml(m)}</option>`).join('');
    }
    assignSelect.addEventListener('change', ()=>{
        const val = assignSelect.value;
        if(val && !assignedCrew.includes(val) && teamMembers.includes(val)) {
            assignedCrew.push(val);
            renderCrewList();
            assignSelect.value = '';
            validateForm();
        }
    });
    function renderCrewList() {
        selectedCrewList.innerHTML = assignedCrew.map(m => `<span class="crew-member">${escHtml(m)}<button class="remove-crew" onclick="removeCrew('${escHtml(m)}')"><i class="bi bi-x"></i></button></span>`).join('');
    }
    window.removeCrew = function(name) { assignedCrew = assignedCrew.filter(m => m !== name); renderCrewList(); validateForm(); };

    // ----- CAMERA -----
    async function startCamera() {
        try { if(stream) stopCamera(); stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment', width:{ideal:640}, height:{ideal:480} } }); video.srcObject=stream; video.style.display='block'; camPlaceholder.style.display='none'; startCam.disabled=true; captureBtn.disabled=false; stopCam.disabled=false; } catch(e){ showToast(currentLang==='ar'?'تعذر الوصول للكاميرا':'Camera access denied','error'); }
    }
    function stopCamera() { if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } video.style.display='none'; camPlaceholder.style.display='flex'; startCam.disabled=false; captureBtn.disabled=true; stopCam.disabled=true; }
    
    function capturePhoto() {
        const ctx = canvas.getContext('2d');
        const maxWidth = 640;
        const maxHeight = 480;
        let width = video.videoWidth;
        let height = video.videoHeight;
        if (width > maxWidth) {
            height = height * (maxWidth / width);
            width = maxWidth;
        }
        if (height > maxHeight) {
            width = width * (maxHeight / height);
            height = maxHeight;
        }
        canvas.width = width;
        canvas.height = height;
        ctx.drawImage(video, 0, 0, width, height);
        capturedPhotos.push(canvas.toDataURL('image/jpeg', 0.6));
        updatePhotoUI();
        validateForm();
        showToast(currentLang==='ar'?`تم التقاط الصورة ${capturedPhotos.length}`:`Photo ${capturedPhotos.length} captured`);
    }
    
    function updatePhotoUI() {
        const pct = Math.min((capturedPhotos.length / MIN_PHOTOS)*100, 100);
        photoProgress.style.width = pct+'%';
        photoProgressText.textContent = `${capturedPhotos.length} / ${MIN_PHOTOS}`;
        if(capturedPhotos.length===0) { photoGallery.style.display='none'; } else {
            photoGallery.style.display='block';
            photoThumbnails.innerHTML = capturedPhotos.map((p,i)=>`
                <div class="photo-thumbnail"><img src="${p}"><div class="photo-number">${i+1}</div><button class="delete-photo" onclick="deletePhoto(${i})"><i class="bi bi-x"></i></button></div>`).join('');
        }
    }
    window.deletePhoto = function(idx) { capturedPhotos.splice(idx,1); updatePhotoUI(); validateForm(); };
    clearPhotosBtn.addEventListener('click', ()=>{ if(confirm(currentLang==='ar'?'مسح كل الصور؟':'Clear all photos?')){ capturedPhotos=[]; updatePhotoUI(); validateForm(); } });
    startCam.addEventListener('click', startCamera);
    captureBtn.addEventListener('click', capturePhoto);
    stopCam.addEventListener('click', stopCamera);

    // ----- VALIDATION -----
    function validateForm() {
        let errors = [];
        if(capturedPhotos.length < MIN_PHOTOS) errors.push(currentLang==='ar'?`تحتاج ${MIN_PHOTOS} صور (${capturedPhotos.length})`:`Need ${MIN_PHOTOS} photos (${capturedPhotos.length})`);
        if(assignedCrew.length === 0) errors.push(currentLang==='ar'?'تعيين عضو واحد على الأقل':'Assign at least one team member');
        if(!taskDesc.value.trim()) errors.push(currentLang==='ar'?'الوصف مطلوب':'Description required');
        if(!prioritySelect.value) errors.push(currentLang==='ar'?'الأولوية مطلوبة':'Priority required');
        if(!areaSelect.value) errors.push(currentLang==='ar'?'المنطقة مطلوبة':'Area required');
        if(!dueDateInput.value) errors.push(currentLang==='ar'?'تاريخ الاستحقاق مطلوب':'Due date required');
        if(errors.length>0){ validationAlert.classList.remove('d-none'); validationMsg.innerHTML=errors.map(e=>`• ${e}`).join('<br>'); return false; }
        validationAlert.classList.add('d-none'); return true;
    }

    // ----- ADD TASK -----
    taskForm.addEventListener('submit', (e)=>{
        e.preventDefault();
        if(!validateForm()) return;
        const task = {
            id: Date.now(),
            description: taskDesc.value,
            assignedTo: [...assignedCrew],
            priority: prioritySelect.value,
            area: areaSelect.value,
            dueDate: dueDateInput.value,
            finishDate: finishDateInput.value || '',
            status: statusSelect.value,
            beforePhotos: [...capturedPhotos],
            createdAt: new Date().toISOString()
        };
        tasks.push(task);
        saveData();
        renderTasks();
        updateStats();
        resetForm();
        showToast(currentLang==='ar'?'تمت إضافة المهمة':'Task added!');
    });

    function resetForm() {
        taskDesc.value = ''; assignedCrew = []; renderCrewList(); capturedPhotos=[]; updatePhotoUI();
        prioritySelect.value=''; areaSelect.value=''; dueDateInput.value=''; finishDateInput.value=''; statusSelect.value='Pending';
        stopCamera(); validateForm();
    }

    // ----- RENDER TASKS -----
    function renderTasks() {
        const filtered = tasks.filter(t => {
            if(statusFilter.value && t.status !== statusFilter.value) return false;
            if(priorityFilter.value && t.priority !== priorityFilter.value) return false;
            return true;
        });
        if(filtered.length === 0) {
            taskContainer.innerHTML = '';
            emptyState.style.display = 'block';
            taskCount.textContent = '0 ' + (currentLang==='ar'?'مهام':'tasks');
            return;
        }
        emptyState.style.display = 'none';
        taskCount.textContent = `${filtered.length} ${currentLang==='ar'?'مهمة':'task'}${filtered.length>1?(currentLang==='ar'?'':'s'):''}`;
        taskContainer.innerHTML = filtered.sort((a,b)=> new Date(a.dueDate)-new Date(b.dueDate)).map(t => `
            <div class="task-card ${t.priority.toLowerCase()}-priority">
                <div class="d-flex justify-content-between align-items-start">
                    <h6 class="mb-1">${escHtml(t.description)}</h6>
                    <div class="d-flex gap-1">
                        <button class="btn btn-sm btn-outline-secondary border-0" onclick="deleteTask(${t.id})" title="${currentLang==='ar'?'حذف':'Delete'}"><i class="bi bi-trash text-danger"></i></button>
                    </div>
                </div>
                ${t.beforePhotos && t.beforePhotos.length > 0 ? `<div class="task-images">${t.beforePhotos.slice(0,4).map(p => `<img src="${p}" class="task-image" onclick="alert('${currentLang==='ar'?'عرض الصورة':'view photo'}')">`).join('')}${t.beforePhotos.length>4?`<span class="task-image d-flex align-items-center justify-content-center bg-secondary text-muted">+${t.beforePhotos.length-4}</span>`:''}</div>` : ''}
                <div class="d-flex flex-wrap gap-1 mb-1">
                    <span class="badge ${t.priority==='High'?'bg-danger':t.priority==='Medium'?'bg-warning text-dark':'bg-success'}">${t.priority}</span>
                    <span class="badge ${t.status==='Completed'?'bg-success':t.status==='In Progress'?'bg-info text-dark':'bg-secondary'}">${t.status}</span>
                    <span class="badge bg-primary">${t.area}</span>
                </div>
                <div class="d-flex flex-wrap gap-1">${t.assignedTo.map(m=>`<span class="crew-member">${escHtml(m)}</span>`).join('')}</div>
                <div class="small text-muted mt-1"><i class="bi bi-calendar-event"></i> ${currentLang==='ar'?'استحقاق':'Due'}: ${new Date(t.dueDate).toLocaleDateString()} ${t.finishDate ? `| ${currentLang==='ar'?'انتهاء':'Finish'}: ${new Date(t.finishDate).toLocaleDateString()}` : ''}</div>
            </div>`).join('');
    }

    window.deleteTask = function(id) {
        if(confirm(currentLang==='ar'?'حذف هذه المهمة؟':'Delete this task?')) {
            tasks = tasks.filter(t => t.id !== id);
            saveData(); renderTasks(); updateStats(); showToast(currentLang==='ar'?'تم الحذف':'Deleted','info');
        }
    };

    let listVisible = true;
    toggleListBtn.addEventListener('click', ()=>{
        listVisible = !listVisible;
        taskContainer.style.display = listVisible ? 'block' : 'none';
        emptyState.style.display = listVisible ? (tasks.length===0?'block':'none') : 'none';
        toggleListBtn.innerHTML = listVisible ? '<i class="bi bi-eye-slash"></i> '+(currentLang==='ar'?'إخفاء':'Hide') : '<i class="bi bi-eye"></i> '+(currentLang==='ar'?'إظهار':'Show');
    });

    // ----- STATS -----
    function updateStats() {
        totalEl.textContent = tasks.length;
        pendingEl.textContent = tasks.filter(t=>t.status==='Pending').length;
        inProgEl.textContent = tasks.filter(t=>t.status==='In Progress').length;
        completedEl.textContent = tasks.filter(t=>t.status==='Completed').length;
    }

    statusFilter.addEventListener('change', renderTasks);
    priorityFilter.addEventListener('change', renderTasks);

    // ----- PDF EXPORT - WITH HORIZONTAL IMAGES -----
    exportBtn.addEventListener('click', async ()=>{
        if(tasks.length===0){ showToast(currentLang==='ar'?'لا توجد مهام للتصدير':'No tasks to export','error'); return; }
        
        exportBtn.disabled = true;
        exportBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Generating...';
        
        try {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            const pageWidth = 210;
            const pageHeight = 297;
            let y = 20;
            const margin = 15;
            const maxWidth = pageWidth - (margin * 2);
            
            // Helper function to add text with wrapping
            function addWrappedText(text, x, y, maxWidth, lineHeight = 5) {
                const lines = doc.splitTextToSize(text, maxWidth);
                doc.text(lines, x, y);
                return y + (lines.length * lineHeight);
            }
            
            // Header
            doc.setFontSize(18);
            doc.setTextColor(30, 58, 95);
            doc.text(storeName.value || 'Cleaning Report', margin, y);
            y += 8;
            
            doc.setFontSize(11);
            doc.setTextColor(71, 85, 105);
            doc.text(storeLocation.value || '', margin, y);
            y += 6;
            doc.text(new Date().toLocaleString(), margin, y);
            y += 8;
            
            doc.setFontSize(13);
            doc.setTextColor(0, 0, 0);
            doc.text(`Total Tasks: ${tasks.length}`, margin, y);
            y += 10;
            
            // Line
            doc.setDrawColor(226, 232, 240);
            doc.line(margin, y, pageWidth - margin, y);
            y += 8;
            
            // Process each task
            for (let i = 0; i < tasks.length; i++) {
                const task = tasks[i];
                
                // Check if we need a new page
                if (y > pageHeight - 50) {
                    doc.addPage();
                    y = 20;
                }
                
                // Task number and description
                doc.setFontSize(12);
                doc.setTextColor(30, 41, 59);
                const descText = `${i+1}. ${task.description}`;
                y = addWrappedText(descText, margin, y, maxWidth, 5.5);
                y += 2;
                
                // Badges - Priority
                const priorityColors = {
                    'High': [185, 28, 28],
                    'Medium': [217, 119, 6],
                    'Low': [11, 126, 75]
                };
                const statusColors = {
                    'Pending': [100, 116, 139],
                    'In Progress': [37, 99, 235],
                    'Completed': [22, 163, 74]
                };
                
                const pColor = priorityColors[task.priority] || [100, 116, 139];
                const sColor = statusColors[task.status] || [100, 116, 139];
                
                // Priority badge
                doc.setFillColor(pColor[0], pColor[1], pColor[2]);
                doc.roundedRect(margin, y - 3, 20, 6, 2, 2, 'F');
                doc.setFontSize(8);
                doc.setTextColor(255, 255, 255);
                doc.text(task.priority, margin + 2, y + 1.5);
                
                // Status badge
                const statusX = margin + 24;
                doc.setFillColor(sColor[0], sColor[1], sColor[2]);
                doc.roundedRect(statusX, y - 3, 22, 6, 2, 2, 'F');
                doc.text(task.status, statusX + 2, y + 1.5);
                
                // Area badge
                const areaX = statusX + 26;
                doc.setFillColor(219, 234, 254);
                doc.roundedRect(areaX, y - 3, 20, 6, 2, 2, 'F');
                doc.setTextColor(30, 58, 138);
                doc.text(task.area, areaX + 2, y + 1.5);
                
                y += 6;
                
                // Due date and assignee
                doc.setFontSize(9);
                doc.setTextColor(71, 85, 105);
                const dateStr = `Due: ${new Date(task.dueDate).toLocaleDateString()}`;
                doc.text(dateStr, margin, y);
                y += 5;
                
                const assignStr = `Team: ${task.assignedTo.join(', ')}`;
                y = addWrappedText(assignStr, margin, y, maxWidth, 4.5);
                y += 4;
                
                // Images - HORIZONTAL LAYOUT
                if (task.beforePhotos && task.beforePhotos.length > 0) {
                    const imgSize = 35; // Slightly smaller to fit more in a row
                    const maxImages = Math.min(task.beforePhotos.length, 6); // Show up to 6 images
                    let imgX = margin;
                    const imgY = y;
                    let imagesAdded = 0;
                    
                    // Calculate how many images fit in one row
                    const maxImagesPerRow = Math.floor((maxWidth - 10) / (imgSize + 4));
                    const imagesToShow = Math.min(maxImages, maxImagesPerRow);
                    
                    for (let j = 0; j < imagesToShow; j++) {
                        try {
                            const imgData = task.beforePhotos[j];
                            if (imgData && imgData.startsWith('data:image')) {
                                // Get image properties to maintain aspect ratio
                                const imgProps = doc.getImageProperties(imgData);
                                const imgWidth = imgProps.width;
                                const imgHeight = imgProps.height;
                                
                                let w = imgSize;
                                let h = imgSize;
                                if (imgWidth > imgHeight) {
                                    w = imgSize;
                                    h = imgSize * (imgHeight / imgWidth);
                                } else {
                                    h = imgSize;
                                    w = imgSize * (imgWidth / imgHeight);
                                }
                                
                                // Center the image in the box
                                const xOffset = (imgSize - w) / 2;
                                const yOffset = (imgSize - h) / 2;
                                
                                doc.addImage(imgData, 'JPEG', imgX + xOffset, imgY + yOffset, w, h);
                                imagesAdded++;
                            }
                        } catch(e) {
                            // Skip this image
                        }
                        imgX += imgSize + 4;
                    }
                    
                    // Show "+N more" indicator
                    let totalImagesDisplayed = imagesAdded;
                    let moreText = '';
                    if (task.beforePhotos.length > totalImagesDisplayed) {
                        moreText = `+${task.beforePhotos.length - totalImagesDisplayed} more`;
                    }
                    
                    // Draw border around images
                    if (imagesAdded > 0) {
                        doc.setDrawColor(203, 213, 225);
                        doc.setLineWidth(0.3);
                        const borderY = imgY - 1;
                        const borderHeight = imgSize + 2;
                        const borderWidth = (imagesAdded * (imgSize + 4)) - 4;
                        doc.roundedRect(margin, borderY, borderWidth, borderHeight, 2, 2, 'S');
                    }
                    
                    // Update Y position
                    y = imgY + imgSize + 6;
                    
                    // Add "more" text if needed
                    if (moreText) {
                        doc.setFontSize(8);
                        doc.setTextColor(100, 116, 139);
                        doc.text(moreText, margin + (imagesAdded * (imgSize + 4)) + 2, imgY + (imgSize / 2) + 2);
                    }
                    
                } else {
                    doc.setFontSize(9);
                    doc.setTextColor(148, 163, 184);
                    doc.text('No photos', margin, y);
                    y += 6;
                }
                
                // Separator line
                y += 4;
                doc.setDrawColor(226, 232, 240);
                doc.line(margin, y, pageWidth - margin, y);
                y += 6;
            }
            
            // Save the PDF
            doc.save(`cleaning-report-${new Date().toISOString().slice(0,10)}.pdf`);
            showToast(currentLang==='ar'?'تم تصدير PDF بنجاح':'PDF exported successfully');
            
        } catch (error) {
            console.error('PDF Export Error:', error);
            showToast(currentLang==='ar'?'خطأ في تصدير PDF':'PDF export error', 'error');
        } finally {
            exportBtn.disabled = false;
            exportBtn.innerHTML = '<i class="bi bi-file-pdf"></i> ' + (currentLang==='ar'?'PDF':'PDF');
        }
    });

    // ----- HELPERS -----
    function escHtml(str) { 
        return String(str).replace(/[&<>"]/g, function(m){ 
            if(m==='&') return '&amp;'; 
            if(m==='<') return '&lt;'; 
            if(m==='>') return '&gt;'; 
            if(m==='"') return '&quot;'; 
            return m;
        }); 
    }

    // store autosave
    storeName.addEventListener('change', ()=>localStorage.setItem('storeName', storeName.value));
    storeLocation.addEventListener('change', ()=>localStorage.setItem('storeLocation', storeLocation.value));

    // init
    applyTranslations();
    loadData();
    const today = new Date().toISOString().split('T')[0];
    dueDateInput.min = today; finishDateInput.min = today;
    updatePhotoUI();
    validateForm();
    renderCrewList();
</script>
</body>
</html>
